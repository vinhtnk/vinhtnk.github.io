rông có vẻ · Đi làm gì rồi quay lại","summary":"Bài này dạy cách nói dự đoán dựa trên những gì nhìn thấy bằng 〜そうです (trông có vẻ, sắp ~) và cách nói đi đâu đó làm việc rồi quay lại bằng 〜てきます.","grammar":[{"pattern":"Vます / Aい(bỏ い) / Aな + そうです","meaning":"Trông có vẻ ~; (sự việc) sắp ~ (dự đoán từ những gì nhìn thấy)","form":"Vます (bỏ ます) + そうです; Aい bỏ い + そうです; Aな + そうです; ngoại lệ: いい → よさそう, ない → なさそう (Aくない → Aくなさそう)","notes":"Dùng khi phán đoán qua vẻ bề ngoài, không dùng cho điều nhìn là biết ngay (không nói きれいそう cho người đẹp rõ ràng). Bổ nghĩa danh từ: おいしそうなケーキ; bổ nghĩa động từ: おいしそうに食べる. Phủ định: Aくなさそうです (面白くなさそう), Aじゃなさそうです; với động từ: Vます bỏ ます + そうもありません (雨は降りそうもありません).","examples":[{"ja":"空{そら}が暗{くら}いですね。今{いま}にも雨{あめ}が降{ふ}りそうです。","vi":"Trời tối quá. Mưa sắp đổ tới nơi rồi."},{"ja":"このケーキはおいしそうですね。","vi":"Cái bánh này trông ngon nhỉ."},{"ja":"木村{きむら}さんは今日{きょう}は暇{ひま}そうです。","vi":"Hôm nay anh Kimura có vẻ rảnh."},{"ja":"あの店{みせ}はよさそうですね。入{はい}ってみましょう。","vi":"Quán kia trông được đấy. Vào thử xem."}]},{"pattern":"Vて + きます","meaning":"Đi làm ~ rồi quay lại","form":"Vて + きます; (địa điểm) へ 行ってきます","notes":"Nhấn mạnh việc sẽ quay về chỗ cũ sau khi làm xong. Câu chào 行ってきます khi ra khỏi nhà cũng xuất phát từ mẫu này.","examples":[{"ja":"ちょっとコンビニで飲{の}み物{もの}を買{か}ってきます。","vi":"Tôi đi mua đồ uống ở cửa hàng tiện lợi một chút rồi về."},{"ja":"昼{ひる}ご飯{はん}を食{た}べてきます。一時{いちじ}に戻{もど}ります。","vi":"Tôi đi ăn trưa đây. 1 giờ tôi quay lại."},{"ja":"郵便局{ゆうびんきょく}へ行{い}ってきます。","vi":"Tôi đi bưu điện rồi về."}]}],"vocab":[{"w":"増える","r":"ふえる","m":"tăng lên (tự)","t":"v","g":2,"cls":1,"mw":"増えます","mr":"ふえます","k":["nhiều lên","gia tăng","tăng thêm"]},{"w":"減る","r":"へる","m":"giảm đi (tự)","t":"v","g":1,"trap":1,"cls":1,"mw":"減ります","mr":"へります","k":["ít đi","bớt","sút"]},{"w":"上がる","r":"あがる","m":"tăng, lên (giá, nhiệt độ)","t":"v","g":1,"cls":1,"mw":"上がります","mr":"あがります","k":["leo thang","đi lên","lên cao"]},{"w":"下がる","r":"さがる","m":"giảm, xuống (giá, nhiệt độ)","t":"v","g":1,"cls":1,"mw":"下がります","mr":"さがります","k":["hạ","đi xuống","giảm xuống","hạ xuống"]},{"w":"切れる","r":"きれる","m":"(dây) đứt","t":"v","g":2,"cls":1,"mw":"切れます","mr":"きれます","k":["bị đứt","cắt được","hết hạn"]},{"w":"とれる","r":"とれる","m":"(cúc áo) bung ra, tuột","t":"v","g":2,"cls":1,"mw":"とれます","mr":"とれます","k":["rơi ra","lấy được","rơi","bị tuột"]},{"w":"落ちる","r":"おちる","m":"rơi (tự)","t":"v","g":2,"cls":1,"mw":"落ちます","mr":"おちます","k":["rơi xuống","ngã","bị rơi","trượt"]},{"w":"なくなる","r":"なくなる","m":"hết, mất","t":"v","g":1,"cls":1,"mw":"なくなります","mr":"なくなります","k":["biến mất","qua đời","hết sạch","không còn"]},{"w":"丈夫","r":"じょうぶ","m":"bền, chắc; khỏe","t":"a","k":["chắc chắn","cứng cáp","khỏe khoắn","bền chắc"]},{"w":"変","r":"へん","m":"lạ, kỳ quặc","t":"a","cls":1,"k":["kỳ lạ","kỳ cục","khác thường","lạ lùng"]},{"w":"幸せ","r":"しあわせ","m":"hạnh phúc","t":"a","cls":1,"k":["vui sướng","sung sướng","may mắn"]},{"w":"うまい","r":"うまい","m":"ngon; giỏi","t":"a","cls":1,"k":["khéo","tốt","giỏi giang","ngon lành"]},{"w":"まずい","r":"まずい","m":"dở, không ngon","t":"a","cls":1,"k":["tệ","kém","dở tệ","khó ăn"]},{"w":"つまらない","r":"つまらない","m":"chán, nhạt","t":"a","cls":1,"k":["nhàm chán","vô vị","nhạt nhẽo","chán ngắt"]},{"w":"ガソリン","r":"ガソリン","m":"xăng","t":"n","cls":1,"k":["xăng dầu","nhiên liệu","dầu"]},{"w":"火","r":"ひ","m":"lửa","t":"n","cls":1,"k":["ngọn lửa","bếp lửa","nhiệt"]},{"w":"暖房","r":"だんぼう","m":"máy sưởi, hệ thống sưởi","t":"n","k":["lò sưởi","hệ thống sưởi","sưởi ấm"]},{"w":"冷房","r":"れいぼう","m":"máy lạnh, điều hòa","t":"n","k":["điều hòa","máy điều hòa","làm mát"]},{"w":"センス","r":"センス","m":"gu, khiếu thẩm mỹ","t":"n","k":["có khiếu","tinh tế","óc thẩm mỹ","cảm nhận"]},{"w":"今にも","r":"いまにも","m":"sắp sửa, ngay bây giờ","t":"x","cls":1,"k":["ngay lập tức","chực","chực chờ","sắp sửa ngay"]},{"w":"わあ","r":"わあ","m":"Ôi!, Oa! (cảm thán)","t":"x","k":["wow","chà","ồ","trời ơi"]},{"w":"会員","r":"かいいん","m":"hội viên, thành viên","t":"n","k":["người đăng ký","thành viên câu lạc bộ","member"]},{"w":"適当","r":"てきとう","m":"thích hợp, phù hợp","t":"a","k":["vừa phải","qua loa","tùy tiện","thích đáng"]},{"w":"年齢","r":"ねんれい","m":"tuổi tác","t":"n","k":["độ tuổi","năm sinh","bao nhiêu tuổi"]},{"w":"収入","r":"しゅうにゅう","m":"thu nhập","t":"n","k":["lương","tiền kiếm được","doanh thu"]},{"w":"ぴったり","r":"ぴったり","m":"vừa vặn, hoàn toàn phù hợp","t":"x","k":["vừa khít","đúng","chính xác"]},{"w":"そのうえ","r":"そのうえ","m":"hơn nữa, thêm vào đó","t":"x","k":["thêm nữa","ngoài ra","vả lại"]},{"w":"～と言います","r":"～といいます","m":"tên là ~, gọi là ~","t":"e","k":["tên tôi là","được gọi là","mang tên"]},{"w":"ばら","r":"ばら","m":"hoa hồng","t":"n","cls":1,"k":["bông hồng","hoa hồng đỏ","cây hồng"]},{"w":"ドライブ","r":"ドライブ","m":"lái xe đi chơi","t":"n","cls":1,"k":["lái xe dạo","đi dạo bằng xe","đi chơi xa"]},{"w":"パンフレット","r":"パンフレット","m":"tờ rơi, sách giới thiệu","t":"n","cls":1,"add":1,"k":["tờ quảng cáo","sách hướng dẫn","catalogue"]},{"w":"理由","r":"りゆう","m":"lý do","t":"n","cls":1,"add":1,"k":["nguyên nhân","vì sao","duyên cớ"]},{"w":"楽","r":"らく","m":"nhàn, thoải mái, dễ dàng","t":"a","cls":1,"add":1,"k":["nhẹ nhàng","nhàn hạ","nhàn nhã","thong thả","đơn giản"]}],"compare":[{"title":"〜そうです (trông có vẻ, bài 43) vs 普通形 + そうです (nghe nói, bài 47)","points":[{"label":"Trông có vẻ (bài 43)","text":"Gắn vào Vます, Aい bỏ い, Aな; là phán đoán của chính mình qua mắt thấy. Ví dụ: 雨が降りそうです (trông như sắp mưa), このラーメンはおいしそうです."},{"label":"Nghe nói (bài 47)","text":"Gắn vào thể thường đầy đủ; truyền đạt thông tin nghe được. Ví dụ: 雨が降るそうです (nghe nói trời sẽ mưa), このラーメンはおいしいそうです."}],"tip":"Thấy bằng mắt → bỏ đuôi (降りそう、おいしそう); nghe từ người khác → giữ nguyên thể thường (降るそう、おいしいそう)."}],"quiz":[{"q":"空{そら}が急{きゅう}に暗{くら}くなりました。雨{あめ}が＿＿です。","options":["降りそう","降りたい","降ったそう","降りよう"],"answer":0,"explain":"Phán đoán từ việc nhìn thấy trời tối → Vます + そうです: 降りそう. 降ったそう là nghe nói đã mưa, không hợp."},{"q":"このカレーは＿＿な色{いろ}ですね。","options":["からいそう","からそう","からくそう","からさそう"],"answer":1,"explain":"Aい bỏ い + そう: からい → からそう (からそうな色: màu trông có vẻ cay). からいそう là dạng 'nghe nói', không bổ nghĩa danh từ bằng な được."},{"q":"この映画{えいが}はあまり面白{おもしろ}く＿＿ですね。","options":["なそう","なさそう","なくそう","なしそう"],"answer":1,"explain":"ない → なさそう (ngoại lệ). なそう là lỗi thường gặp."},{"q":"天気{てんき}が＿＿ですから、散歩{さんぽ}に行{い}きましょう。","options":["よそう","いそう","いさそう","よさそう"],"answer":3,"explain":"いい → よさそう (ngoại lệ). Các dạng còn lại đều sai."},{"q":"「どこへ行{い}くんですか。」「ちょっと郵便局{ゆうびんきょく}へ＿＿。」","options":["行ってあります","行ってきます","行っておきます","行ってしまいます"],"answer":1,"explain":"Đi đâu đó rồi quay lại → 行ってきます. 行っておきます là làm sẵn để chuẩn bị, không hợp với câu trả lời này."}]},{"lesson":44,"title":"Quá ~ · Dễ / khó làm · Làm cho ~ · Chọn","summary":"Bài này dạy cách nói 'quá mức' (〜すぎます), 'dễ / khó làm' (〜やすい / 〜にくい), 'làm cho cái gì trở nên ~' (〜くします / 〜にします) và cách nói lựa chọn, quyết định (Nにします).","grammar":[{"pattern":"Vます / Aい(bỏ い) / Aな + すぎます","meaning":"Quá ~, ~ quá mức","form":"Vます (bỏ ます) + すぎます; Aい bỏ い + すぎます; Aな + すぎます","notes":"Thường mang ý tiêu cực. Chia như động từ nhóm II: すぎて、すぎた. いい → よすぎる, ない → なさすぎる.","examples":[{"ja":"昨夜{ゆうべ}、お酒{さけ}を飲{の}みすぎて、今朝{けさ}は頭{あたま}が痛{いた}いです。","vi":"Tối qua uống rượu quá nhiều nên sáng nay đau đầu."},{"ja":"この問題{もんだい}は難{むずか}しすぎて、わかりません。","vi":"Câu hỏi này khó quá, tôi không hiểu."},{"ja":"この町{まち}は静{しず}かすぎて、ちょっと寂{さび}しいです。","vi":"Thị trấn này yên tĩnh quá nên hơi buồn."}]},{"pattern":"Vます + やすいです / にくいです","meaning":"Dễ ~ / khó ~","form":"Vます (bỏ ます) + やすい / にくい (chia như tính từ đuôi い)","notes":"Nói về tính chất của đồ vật hoặc khuynh hướng dễ xảy ra (汚れやすい、壊れやすい). Chia: やすくて、にくくなる.","examples":[{"ja":"このペンは軽{かる}くて、書{か}きやすいです。","vi":"Cây bút này nhẹ, dễ viết."},{"ja":"この薬{くすり}は苦{にが}くて、飲{の}みにくいです。","vi":"Thuốc này đắng, khó uống."},{"ja":"白{しろ}いシャツは汚{よご}れやすいです。","vi":"Áo sơ mi trắng dễ bẩn."}]},{"pattern":"Aい → く / Aな → に / N に + します","meaning":"Làm cho (cái gì) trở nên ~","form":"N を + Aい bỏ い + く します; N を + Aな + に します; N を + N に します","notes":"Diễn tả chủ thể chủ động thay đổi đối tượng. Phân biệt với 〜くなります/〜になります (tự trở nên, bài 19).","examples":[{"ja":"テレビの音{おと}を小{ちい}さくしてください。","vi":"Hãy vặn nhỏ tiếng tivi."},{"ja":"お客{きゃく}さんが来{く}るので、部屋{へや}をきれいにしました。","vi":"Vì có khách đến nên tôi đã dọn phòng sạch sẽ."},{"ja":"この部屋{へや}を子{こ}どもの部屋{へや}にします。","vi":"Tôi sẽ biến phòng này thành phòng của con."}]},{"pattern":"N に + します","meaning":"Chọn N, quyết định N","form":"N + に + します","notes":"Dùng khi gọi món, chọn đồ, quyết định ngày giờ. Hay gặp trong câu hỏi 何にしますか.","examples":[{"ja":"「飲{の}み物{もの}は何{なに}にしますか。」「私{わたし}はコーヒーにします。」","vi":"\"Đồ uống chọn gì?\" \"Tôi chọn cà phê.\""},{"ja":"次{つぎ}の会議{かいぎ}は来週{らいしゅう}の月曜日{げつようび}にしましょう。","vi":"Cuộc họp tới thì chốt vào thứ Hai tuần sau nhé."}]}],"vocab":[{"w":"泣く","r":"なく","m":"khóc","t":"v","g":1,"cls":1,"mw":"泣きます","mr":"なきます","k":["rơi lệ","khóc lóc","khóc nức nở"]},{"w":"笑う","r":"わらう","m":"cười","t":"v","g":1,"cls":1,"mw":"笑います","mr":"わらいます","k":["mỉm cười","cười to","cười đùa"]},{"w":"乾く","r":"かわく","m":"(quần áo) khô","t":"v","g":1,"cls":1,"mw":"乾きます","mr":"かわきます","k":["khô ráo","khát","ráo"]},{"w":"ぬれる","r":"ぬれる","m":"bị ướt","t":"v","g":2,"cls":1,"mw":"ぬれます","mr":"ぬれます","k":["ướt sũng","dính nước","ướt át"]},{"w":"滑る","r":"すべる","m":"trơn, trượt","t":"v","g":1,"trap":1,"cls":1,"mw":"滑ります","mr":"すべります","k":["trơn trượt","trượt chân","trượt ngã"]},{"w":"起きる","r":"おきる","m":"xảy ra (事故が～: tai nạn xảy ra)","t":"v","g":2,"cls":1,"mw":"起きます","mr":"おきます","k":["phát sinh","diễn ra","thức dậy"]},{"w":"調節する","r":"ちょうせつする","m":"điều chỉnh","t":"v","g":3,"cls":1,"mw":"調節します","mr":"ちょうせつします","k":["điều tiết","căn chỉnh","điều chỉnh lại","chỉnh lại"]},{"w":"安全","r":"あんぜん","m":"an toàn","t":"a","cls":1,"k":["bình an","yên ổn","không nguy hiểm"]},{"w":"丁寧","r":"ていねい","m":"lịch sự; cẩn thận, kỹ lưỡng","t":"a","k":["kỹ càng","chu đáo","lễ phép"]},{"w":"細かい","r":"こまかい","m":"nhỏ, vụn; chi tiết","t":"a","k":["tỉ mỉ","tiền lẻ","li ti","vụn vặt"]},{"w":"濃い","r":"こい","m":"đậm, đặc","t":"a","cls":1,"k":["sẫm","nồng","đậm đặc","màu đậm"]},{"w":"薄い","r":"うすい","m":"nh  đi với を. Ví dụ: 部屋を暖かくします (làm phòng ấm lên)."},{"label":"〜くなります / 〜になります (bài 19)","text":"Sự vật tự biến đổi, đi với が. Ví dụ: 部屋が暖かくなりました (phòng đã ấm lên)."}],"tip":"します = có người tác động (を); なります = tự thay đổi (が)."}],"quiz":[{"q":"昨日{きのう}、ケーキを食{た}べ＿＿、おなかが痛{いた}くなりました。","options":["すぎて","やすくて","にくくて","そうで"],"answer":0,"explain":"Ăn quá nhiều dẫn đến đau bụng → 食べすぎて. やすくて (dễ ăn) không giải thích được việc đau bụng."},{"q":"この靴{くつ}は軽{かる}くて、とても歩{ある}き＿＿です。","options":["すぎ","にくい","やすい","そう"],"answer":2,"explain":"Giày nhẹ → dễ đi: 歩きやすい. にくい (khó đi) trái nghĩa với 軽くて."},{"q":"テレビの音{おと}が大{おお}きいので、少{すこ}し＿＿してください。","options":["小さい","小さく","小さに","小さくて"],"answer":1,"explain":"Aい → bỏ い + く + します: 小さくしてください. 小さに là cách chia của tính từ đuôi な, sai."},{"q":"「飲{の}み物{もの}は何{なに}にしますか。」「私{わたし}はオレンジジュース＿＿します。」","options":["を","が","で","に"],"answer":3,"explain":"Chọn món: N + に + します. を します là 'làm' chứ không phải 'chọn'."},{"q":"この部屋{へや}は＿＿すぎて、勉強{べんきょう}できません。","options":["うるさ","うるさい","うるさく","うるさくて"],"answer":0,"explain":"Aい bỏ い + すぎる: うるさすぎて. うるさいすぎ là lỗi thường gặp."}]},{"lesson":45,"title":"Trường hợp · Vậy mà (trái kỳ vọng)","summary":"Bài này dạy cách nói 'trong trường hợp ~ thì…' bằng 〜場合は (thường kèm chỉ dẫn, quy định) và cách bày tỏ sự bất ngờ, bất mãn khi kết quả trái với mong đợi bằng 〜のに.","grammar":[{"pattern":"Vる・Vない・Vた / Aい / Aな / N の + 場合は","meaning":"Trong trường hợp ~ thì…","form":"Vる・Vない・Vた + 場合は; Aい + 場合は; Aな + な + 場合は; N + の + 場合は","notes":"Dùng cho tình huống giả định có thể xảy ra; vế sau thường là chỉ dẫn, cách xử lý. Không dùng cho sự việc đã xảy ra một lần cụ thể trong quá khứ.","examples":[{"ja":"火事{かじ}の場合{ばあい}は、エレベーターを使{つか}わないでください。","vi":"Trong trường hợp hỏa hoạn, đừng dùng thang máy."},{"ja":"会議{かいぎ}に間{ま}に合{あ}わない場合{ばあい}は、連絡{れんらく}してください。","vi":"Trường hợp không kịp giờ họp thì hãy liên lạc."},{"ja":"カードをなくした場合{ばあい}は、すぐ銀行{ぎんこう}に電話{でんわ}してください。","vi":"Trường hợp làm mất thẻ thì hãy gọi ngay cho ngân hàng."}]},{"pattern":"普通形 + のに","meaning":"Vậy mà, thế mà, mặc dù ~ (kết quả trái mong đợi, kèm bất mãn, ngạc nhiên)","form":"V・Aい thể thường + のに; Aな・N + な + のに","notes":"Vế sau là sự thật đã/đang xảy ra, thể hiện cảm xúc thất vọng, bất mãn. Không dùng khi vế sau là ý chí, lời mời, nhờ vả (〜ましょう、〜てください).","examples":[{"ja":"約束{やくそく}したのに、彼{かれ}は来{き}ませんでした。","vi":"Đã hứa rồi vậy mà anh ta không đến."},{"ja":"日曜日{にちようび}なのに、会社{かいしゃ}へ行{い}かなければなりません。","vi":"Chủ nhật vậy mà vẫn phải đi làm."},{"ja":"一生懸命{いっしょうけんめい}勉強{べんきょう}したのに、試験{しけん}に落{お}ちてしまいました。","vi":"Đã học chăm chỉ vậy mà vẫn trượt kỳ thi."}]}],"vocab":[{"w":"謝る","r":"あやまる","m":"xin lỗi, tạ lỗi","t":"v","g":1,"mw":"謝ります","mr":"あやまります","k":["nhận lỗi","xin tha thứ","tạ tội"]},{"w":"遭う","r":"あう","m":"gặp (tai nạn) (事故に～: gặp tai nạn)","t":"v","g":1,"mw":"遭います","mr":"あいます","k":["gặp phải","bị","gặp nạn"]},{"w":"信じる","r":"しんじる","m":"tin","t":"v","g":2,"cls":1,"mw":"信じます","mr":"しんじます","k":["tin tưởng","tin cậy","tin rằng"]},{"w":"用意する","r":"よういする","m":"chuẩn bị","t":"v","g":3,"mw":"用意します","mr":"よういします","k":["sửa soạn","sắp xếp","chuẩn bị sẵn"]},{"w":"キャンセルする","r":"キャンセルする","m":"hủy","t":"v","g":3,"cls":1,"mw":"キャンセルします","mr":"キャンセルします","k":["hủy bỏ","cancel","hủy đặt"]},{"w":"うまくいく","r":"うまくいく","m":"suôn sẻ, thuận lợi","t":"v","g":1,"mw":"うまくいきます","mr":"うまくいきます","k":["trôi chảy","thành công","êm xuôi"]},{"w":"保証書","r":"ほしょうしょ","m":"phiếu bảo hành","t":"n","cls":1,"k":["giấy bảo hành","thẻ bảo hành","giấy bảo đảm"]},{"w":"領収書","r":"りょうしゅうしょ","m":"hóa đơn, biên lai","t":"n","cls":1,"k":["phiếu thu","giấy biên nhận","hóa đơn thanh toán","biên nhận"]},{"w":"贈り物","r":"おくりもの","m":"quà tặng","t":"n","k":["món quà","quà biếu","tặng phẩm"]},{"w":"間違い電話","r":"まちがいでんわ","m":"cuộc gọi nhầm số","t":"n","k":["gọi sai số","nhầm máy","điện thoại nhầm"]},{"w":"キャンプ","r":"キャンプ","m":"cắm trại","t":"n","cls":1,"k":["dã ngoại","camp","đi cắm trại","cắm lều"]},{"w":"係","r":"かかり","m":"người phụ trách","t":"n","k":["nhân viên phụ trách","nhân viên"]},{"w":"中止","r":"ちゅうし","m":"hủy bỏ, đình c t":"v","g":3,"mw":"セットします","mr":"セットします","k":["hẹn giờ","đặt báo thức","đặt giờ","cài báo thức"]},{"w":"それでも","r":"それでも","m":"dù vậy, dù thế","t":"x","k":["tuy vậy","nhưng mà","thế mà"]},{"w":"知らせる","r":"しらせる","m":"thông báo, báo cho biết","t":"v","cls":1,"add":1,"g":2,"mw":"知らせます","mr":"しらせます","k":["báo","báo tin","cho biết","cho hay"]},{"w":"梅","r":"うめ","m":"mơ, mận (cây/hoa)","t":"n","cls":1,"add":1,"k":["hoa mơ","quả mơ","cây mơ","hoa mai"]},{"w":"110番","r":"ひゃくとおばん","m":"số 110 (gọi cảnh sát)","t":"n","cls":1,"add":1,"k":["báo cảnh sát","gọi 110","đường dây cảnh sát"]},{"w":"119番","r":"ひゃくじゅうきゅうばん","m":"số 119 (cứu hỏa, cấp cứu)","t":"n","cls":1,"add":1,"k":["gọi cấp cứu","xe cứu thương","gọi cứu hỏa"]},{"w":"無理に","r":"むりに","m":"ép, cố quá sức","t":"x","cls":1,"add":1,"k":["ép buộc","gượng ép","cố gắng quá"]}],"compare":[{"title":"〜のに vs 〜けど / 〜が","points":[{"label":"〜のに","text":"Nhấn mạnh kết quả trái kỳ vọng, kèm cảm xúc bất mãn, tiếc nuối. Vế sau không thể là ý chí, lời mời, nhờ vả. Ví dụ: 薬を飲んだのに、熱が下がりません."},{"label":"〜けど / 〜が","text":"Chỉ nối hai ý tương phản một cách trung tính, vế sau dùng được cả ý chí, lời mời. Ví dụ: 雨が降っているけど、出かけましょう (không nói 降っているのに、出かけましょう)."}],"tip":"Có cảm xúc 'thế mà…!' → のに; chỉ nối 'nhưng' bình thường hoặc vế sau là rủ rê, nhờ vả → けど / が."}],"quiz":[{"q":"地震{じしん}の＿＿は、机{つくえ}の下{した}に入{はい}ってください。","options":["ので","のに","ために","場合"],"answer":3,"explain":"N の + 場合は: trong trường hợp động đất. のに diễn tả trái kỳ vọng, không đi với lời chỉ dẫn."},{"q":"熱{ねつ}が＿＿場合{ばあい}は、この薬{くすり}を飲{の}んでください。","options":["あるの","ある","あるな","あって"],"answer":1,"explain":"Động từ thể thường gắn trực tiếp vào 場合: ある場合は. の chỉ dùng sau danh từ, な sau tính từ đuôi な."},{"q":"一生懸命{いっしょうけんめい}練習{れんしゅう}した＿＿、試合{しあい}に負{ま}けました。","options":["ので","のに","から","ために"],"answer":1,"explain":"Đã luyện tập chăm chỉ mà vẫn thua → kết quả trái mong đợi: のに. ので/から/ために là quan hệ nguyên nhân, không hợp nghĩa."},{"q":"この辺{へん}はいつも静{しず}か＿＿のに、今日{きょう}はうるさいですね。","options":["だ","の","な","に"],"answer":2,"explain":"Tính từ đuôi な + な + のに: 静かなのに. だのに không dùng ở trình độ này."},{"q":"雨{あめ}が降{ふ}っている＿＿、出{で}かけましょう。","options":["のに","けど","ように","ために"],"answer":1,"explain":"Vế sau là lời rủ (〜ましょう) nên không dùng のに; dùng けど để nối ý tương phản. ように/ために không nối được hai vế như vậy."}]},{"lesson":46,"title":"Thời điểm của hành động · Dự đoán có căn cứ","summary":"Bài này dạy cách nói một hành động sắp xảy ra, đang diễn ra hay vừa xong (ところです, ばかりです), và cách nêu dự đoán chắc chắn dựa trên lý do (はずです).","grammar":[{"pattern":"Vる + ところです","meaning":"Sắp sửa làm V (ngay trước khi bắt đầu)","form":"V thể từ điển + ところです","notes":"Thường đi với これから, 今から. Diễn tả thời điểm ngay trước hành động, không phải kế hoạch xa.","examples":[{"ja":"今{いま}から昼{ひる}ご飯{はん}を食{た}べるところです。","vi":"Bây giờ tôi chuẩn bị ăn trưa."},{"ja":"これから出{で}かけるところですから、あとで電話{でんわ}します。","vi":"Tôi sắp ra ngoài nên lát nữa tôi sẽ gọi lại."}]},{"pattern":"Vている + ところです","meaning":"Đang trong lúc làm V","form":"V thể て + いる + ところです","notes":"Nhấn mạnh đang ở giữa quá trình, thường để giải thích vì sao chưa xong hoặc không rảnh. Hay đi với 今.","examples":[{"ja":"今{いま}、故障{こしょう}の原因{げんいん}を調{しら}べているところです。","vi":"Bây giờ chúng tôi đang tìm nguyên nhân hỏng hóc."},{"ja":"会議{かいぎ}の資料{しりょう}を作{つく}っているところですから、もう少{すこ}し待{ま}ってください。","vi":"Tôi đang làm tài liệu cho cuộc họp, xin chờ thêm chút nữa."}]},{"pattern":"Vた + ところです","meaning":"Vừa mới làm V xong (ngay lúc này)","form":"V thể た + ところです","notes":"Chỉ khoảng thời gian rất ngắn sau khi xong, thường đi với たった今, ちょうど. Không dùng cho việc đã xảy ra từ hôm qua, tuần trước.","examples":[{"ja":"たった今{いま}、駅{えき}に着{つ}いたところです。","vi":"Tôi vừa mới đến ga xong."},{"ja":"会議{かいぎ}はちょうど終{お}わったところです。","vi":"Cuộc họp vừa kết thúc."}]},{"pattern":"Vた + ばかりです","meaning":"Mới vừa làm V (theo cảm nhận của người nói)","form":"V thể た + ばかりです; bổ nghĩa danh từ: Vた + ばかりの + N","notes":"Mang tính chủ quan: dù đã qua vài ngày, vài tháng, nếu người nói thấy là còn mới thì vẫn dùng được.","examples":[{"ja":"先月{せんげつ}日本{にほん}に来{き}たばかりですから、まだ日本語{にほんご}が上手{じょうず}じゃありません。","vi":"Tôi mới sang Nhật tháng trước nên tiếng Nhật chưa giỏi."},{"ja":"買{か}ったばかりのパソコンが壊{こわ}れてしまいました。","vi":"Cái máy tính vừa mới mua đã bị hỏng mất rồi."}]},{"pattern":"普通形 + はずです","meaning":"Chắc chắn là..., lẽ ra là... (suy luận có căn cứ)","form":"V・Aい thể thường + はずです; Aな + な + はずです; N + の + はずです","notes":"Người nói tin chắc dựa trên lý do, thông tin cụ thể. Không dùng cho hành động có ý chí của chính mình (dùng つもり).","examples":[{"ja":"田中{たなか}さんは今日{きょう}休{やす}みだから、会社{かいしゃ}にいないはずです。","vi":"Hôm nay anh Tanaka nghỉ nên chắc chắn không có ở công ty."},{"ja":"荷物{にもつ}は昨日{きのう}送{おく}ったので、明日{あした}届{とど}くはずです。","vi":"Hành lý đã gửi hôm qua nên chắc ngày mai sẽ tới."},{"ja":"あの店{みせ}は駅{えき}の前{まえ}だから、便利{べんり}なはずです。","vi":"Cửa hàng đó ở trước ga nên chắc là tiện."}]}],"vocab":[{"w":"焼く","r":"やく","m":"nướng","t":"v","g":1,"cls":1,"mw":"焼きます","mr":"やきます","k":["đốt","rán","chiên"]},{"w":"渡す","r":"わたす","m":"đưa, trao","t":"v","g":1,"cls":1,"mw":"渡します","mr":"わたします","k":["giao","đưa cho","trao cho","đưa tận tay"]},{"w":"帰って来る","r":"かえってくる","m":"trở về","t":"v","g":3,"cls":1,"mw":"帰って来ます","mr":"かえってきます","k":["quay về","quay lại","trở lại"]},{"w":"出る","r":"でる","m":"xuất phát, chạy (バスが～: xe buýt xuất phát)","t":"v","g":2,"cls":1,"mw":"出ます","mr":"でます","k":["dự thi","tham dự","thi đấu cho","góp mặt","dự giải"]},{"w":"留守","r":"るす","m":"vắng nhà","t":"n","cls":1,"k":["đi vắng","không có nhà","không ở nhà","vắng mặt"]},{"w":"宅配便","r":"たくはいびん","m":"dịch vụ chuyển phát tận nhà","t":"n","cls":1,"k":["giao hàng tận nhà","ship","giao hàng"]},{"w":"原因","r":"げんいん","m":"nguyên nhân","t":"n","cls":1,"k":["lý do","căn nguyên","nguồn gốc"]},{"w":"注射","r":"ちゅうしゃ","m":"tiêm","t":"n","k":["chích","tiêm thuốc","mũi tiêm"]},{"w":"食欲","r":"しょくよく","m":"cảm giác thèm ăn","t":"n","k":["ăn ngon miệng","khẩu vị","ngon miệng"]},{"w":"パンフレット","r":"パンフレット","m":"tờ rơi, sách giới thiệu","t":"n","k":["tờ quảng cáo","sách hướng dẫn","catalogue"]},{" いちぶぶん","m":"một phần","t":"n","k":["một bộ phận","một chút","phần nhỏ","một ít"]},{"w":"入力する","r":"にゅうりょくする","m":"nhập (dữ liệu)","t":"v","g":3,"mw":"入力します","mr":"にゅうりょくします","k":["gõ","điền","nhập liệu","đánh máy"]},{"w":"～秒","r":"～びょう","m":"～ giây","t":"x","k":["giây đồng hồ","số giây","mấy giây"]},{"w":"届く","r":"とどく","m":"được gửi đến (荷物が～: hàng đến nơi)","t":"v","cls":1,"add":1,"g":1,"mw":"届きます","mr":"とどきます","k":["nhận được","gửi đến","giao đến"]},{"w":"入学する","r":"にゅうがくする","m":"nhập học (大学に～: vào đại học)","t":"v","cls":1,"add":1,"g":3,"mw":"入学します","mr":"にゅうがくします","k":["vào trường","vào học","nhập trường"]},{"w":"卒業する","r":"そつぎょうする","m":"tốt nghiệp (大学を～: tốt nghiệp đại học)","t":"v","cls":1,"add":1,"g":3,"mw":"卒業します","mr":"そつぎょうします","k":["ra trường","học xong","tốt nghiệp xong"]},{"w":"焼ける","r":"やける","m":"chín, được nướng (tự) (肉が～: thịt chín)","t":"v","cls":1,"add":1,"g":2,"mw":"焼けます","mr":"やけます","k":["bị thiêu","cháy rụi","được nướng","rám nắng"]},{"w":"留守番","r":"るすばん","m":"trông nhà (khi vắng)","t":"n","cls":1,"add":1,"k":["giữ nhà","ở nhà","coi nhà","người trông nhà"]},{"w":"半年","r":"はんとし","m":"nửa năm","t":"n","cls":1,"add":1,"k":["sáu tháng","6 tháng","nửa năm trời"]},{"w":"今いいですか。","r":"いまいいですか。","m":"Bây giờ có tiện không ạ?","t":"e","cls":1,"add":1,"k":["có rảnh không","bây giờ được không","làm phiền chút","có thời gian không"]},{"w":"申し訳ありません。","r":"もうしわけありません。","m":"Tôi thành thật xin lỗi.","t":"e","cls":1,"add":1,"k":["xin lỗi","thật xin lỗi","rất xin lỗi","xin thứ lỗi","vô cùng xin lỗi"]}],"compare":[{"title":"Vたところです vs Vたばかりです","points":[{"label":"Vたところです","text":"Khách quan, chỉ ngay sau khi xong (vài phút). Thường với たった今, ちょうど. Ví dụ: 今、起きたところです (Tôi vừa ngủ dậy xong)."},{"label":"Vたばかりです","text":"Chủ quan, người nói cảm thấy còn mới dù đã lâu hơn (vài ngày, vài tháng). Ví dụ: 去年結婚したばかりです (Tôi mới cưới năm ngoái). Có thể bổ nghĩa danh từ: 買ったばかりの靴."},{"label":"Lưu ý","text":"Câu có mốc thời gian xa như 先週, 去年 thì chỉ dùng ばかり, không dùng ところ."}],"tip":"ところ = đồng hồ bấm giờ (vừa xong tức thì); ばかり = cảm giác (thấy vẫn còn mới)."}],"quiz":[{"q":"「もう晩{ばん}ご飯{はん}を食{た}べましたか。」「いいえ、今{いま}から＿＿ところです。」","options":["食べた","食べている","食べる","食べて"],"answer":2,"explain":"今から (từ bây giờ) báo hiệu hành động sắp bắt đầu nên dùng thể từ điển 食べるところ. 食べたところ là vừa ăn xong, mâu thuẫn với いいえ."},{"q":"田中{たなか}さんは先週{せんしゅう}退院{たいいん}した＿＿なのに、もう仕事{しごと}をしています。","options":["ところ","ばかり","はず","よう"],"answer":1,"explain":"先週 là mốc thời gian đã qua vài ngày, người nói cảm thấy còn mới nên dùng ばかり. ところ chỉ dùng cho việc vừa xong ngay tức thì."},{"q":"地図{ちず}を送{おく}りましたから、道{みち}がわかる＿＿です。","options":["ところ","ばかり","はず","つもり"],"answer":2,"explain":"Có căn cứ (đã gửi bản đồ) nên người nói tin chắc người kia biết đường: はずです. つもり chỉ ý định của bản thân, không hợp."},{"q":"ごめん、今{いま}、料理{りょうり}を＿＿ところで手{て}が離{はな}せないから、あとで電話{でんわ}するね。","options":["作る","作った","作っている","作って"],"answer":2,"explain":"手が離せない (đang bận tay) cho thấy đang giữa lúc nấu ăn nên dùng 作っているところ. 作るところ là sắp nấu, chưa bận tay."},{"q":"あの公園{こうえん}は日曜日{にちようび}はにぎやか＿＿はずです。","options":["だ","な","の","に"],"answer":1,"explain":"Tính từ đuôi な khi đi với はず giữ な: にぎやかなはずです. の chỉ dùng sau danh từ (休みのはず)."}]},{"lesson":47,"title":"Truyền đạt tin nghe được · Phán đoán từ dấu hiệu","summary":"Bài này dạy cách truyền đạt lại thông tin nghe được (そうです), nêu phán đoán dựa trên những gì quan sát thấy (ようです), và cách diễn tả cảm nhận bằng giác quan (音がします, においがします...).","grammar":[{"pattern":"普通形 + そうです（伝聞）","meaning":"Nghe nói là..., nghe bảo là...","form":"V・Aい thể thường + そうです; Aな・N + だ + そうです","notes":"Nguồn tin đặt trước bằng 〜によると hoặc 〜では. Phải giữ だ với Aな và N (雨だそうです). Không có dạng quá khứ そうでした hay phủ định そうではありません.","examples":[{"ja":"天気予報{てんきよほう}によると、明日{あした}は雨{あめ}が降{ふ}るそうです。","vi":"Theo dự báo thời tiết thì nghe nói ngày mai trời mưa."},{"ja":"ニュースによると、昨日{きのう}大阪{おおさか}で大{おお}きい火事{かじ}があったそうです。","vi":"Theo tin tức thì hôm qua ở Osaka có đám cháy lớn."},{"ja":"林{はやし}さんの話{はなし}では、あのレストランはとても有名{ゆうめい}だそうです。","vi":"Theo lời chị Hayashi thì nhà hàng đó rất nổi tiếng."}]},{"pattern":"普通形 + ようです","meaning":"Có vẻ như..., hình như... (phán đoán từ dấu hiệu quan sát được)","form":"V・Aい thể thường + ようです; Aな + な + ようです; N + の + ようです","notes":"Người nói tự quan sát tình huống (âm thanh, cảnh vật, thái độ) rồi kết luận. Hay đi với どうも để làm mềm câu.","examples":[{"ja":"人{ひと}がたくさん集{あつ}まっていますね。事故{じこ}のようです。","vi":"Người tụ tập đông quá nhỉ. Hình như có tai nạn."},{"ja":"電気{でんき}が消{き}えていますから、誰{だれ}もいないようです。","vi":"Đèn tắt rồi nên có vẻ không có ai."},{"ja":"彼{かれ}はいつもケーキを食{た}べていますね。甘{あま}いものが好{す}きなようです。","vi":"Anh ấy lúc nào cũng ăn bánh ngọt nhỉ. Có vẻ thích đồ ngọt."}]},{"pattern":"声／音／におい／味 + がします","meaning":"Nghe thấy tiếng / ngửi thấy mùi / cảm thấy vị...","form":"N (声, 音, におい, 味) + がします","notes":"Diễn tả cảm nhận tự nhiên bằng giác quan, không phải cố ý nghe, ngửi. Thường có bổ ngữ phía trước: いいにおい, 変な音.","examples":[{"ja":"隣{となり}の部屋{へや}から変{へん}な音{おと}がします。","vi":"Có tiếng động lạ từ phòng bên cạnh."},{"ja":"台所{だいどころ}からいいにおいがしますね。","vi":"Có mùi thơm từ bếp nhỉ."},{"ja":"このスープは少{すこ}し変{へん}な味{あじ}がします。","vi":"Món súp này có vị hơi lạ."}]}],"vocab":[{"w":"集まる","r":"あつまる","m":"tập trung, tụ tập","t":"v","g":1,"cls":1,"mw":"集まります","mr":"あつまります","k":["tụ tập","gom lại","quây quần"]},{"w":"別れる","r":"わかれる","m":"chia tay","t":"v","g":2,"cls":1,"mw":"別れます","mr":"わかれます","k":["chia ly","ly biệt","tạm biệt"]},{"w":"長生きする","r":"ながいきする","m":"sống lâu","t":"v","g":3,"mw":"長生きします","mr":"ながいきします","k":["trường thọ","thọ","sống thọ","sống dai"]},{"w":"する","r":"する","m":"nghe thấy (音／声が～: có tiếng, có giọng)","t":"v","g":3,"cls":1,"mw":"します","mr":"します","k":["có tiếng","phát ra","cảm thấy","có mùi","có vị"]},{"w":"する","r":"する","m":"có vị (味が～)","t":"v","g":3,"mw":"します","mr":"します","k":["có tiếng","phát ra","cảm thấy","có mùi","có vị"]},{"w":"する","r":"する","m":"có mùi (においが～)","t":"v","g":3,"mw":"します","mr":"します","k":["có tiếng","phát ra","cảm thấy","có mùi","có vị"]},{"w":"さす","r":"さす","m":"che, giương (傘を～: che ô)","t":"v","g":1,"mw":"さします","mr":"さします","k":["giương ô","bung dù","che dù"]},{"w":"ひどい","r":"ひどい","m":"tồi tệ, khủng khiếp","t":"a","cls":1,"k":["kinh khủng","tệ hại","quá đáng","tàn nhẫn","dữ dội","tệ"]},{"w":"怖い","r":"こわい","m":"sợ, đáng sợ","t":"a","cls":1,"k":["sợ hãi","kinh khủng","ghê"]},{"w":"天気予報","r":"てんきよほう","m":"dự báo thời tiết","t":"n","k":["dự báo","thời tiết","bản tin thời tiết"]},{"w":"発表","r":"はっぴょう","m":"công bố, phát biểu","t":"n","k":["trình bày","thông báo","báo cáo"]},{"w":"実験","r":"じっけん","m":"thí nghiệm","t":"n","cls":1,"k":["thử nghiệm","làm thí nghiệm","kiểm nghiệm","thực nghiệm"]},{"w":"人口","r":"じんこう","m":"dân số","t":"n","cls":1,"k":["số dân","dân cư","số người"]},{"w":"におい","r":"におい","m":"mùi","t":"n","cls":1,"k":["hương","mùi hương","mùi thơm","mùi hôi"]},{"w":"科学","r":"かがく","m":"khoa học","t":"n","cls":1,"k":["khoa học tự nhiên","môn khoa học","nhà khoa học"]},{"w":"医学","r":"いがく","m":"y học","t":"n","cls":1,"k":["ngành y","y khoa","y tế","y dược"]},{"w":"文学","r":"ぶんがく","m":"văn học","t":"n","cls":1,"k":["văn chương","môn văn","ngữ văn"]},{"w":"パトカー","r":"パトカー","m":"xe cảnh sát","t":"n","cls":1,"k":["xe công an","xe tuần tra","xe cảnh sát tuần tra"]},{"w":"救急車","r":"きゅうきゅうしゃ","m":"xe cấp cứu","t":"n","cls":1,"k":["xe cứu thương","cấp cứu","xe bệnh viện"]},{"w":"賛成","r":"さんせい","m":"tán thành","t":"n","k":["đồng ý","ủng hộ","nhất trí","tán đồng"]},{"w":"反対","r":"はんたい","m":"phản đối","t":"n","k":["không đồng ý","chống đối","ngược lại","trái ngược","phản kháng"]},{"w":"男性","r":"だんせい","m":"nam giới","t":"n","cls":1,"k":["đàn ông","nam","phái mạnh","nam tính"]},{"w":"女性","r":"じょせい","m":"nữ giới","t":"n","cls":1,"k":["phụ nữ","nữ","đàn bà","phái nữ"]},{"w":"どうも","r":"どうも","m":"có vẻ như (dù không rõ lắm)","t":"x","k":["hình như","dường như","có lẽ","chẳng hiểu sao"]},{"w":"～によると","r":"～によると","m":"theo ～ (nguồn tin)","t":"x","cls":1,"k":["dựa theo","căn cứ","nghe nói","theo như"]},{"w":"イラン","r":"イラン","m":"Iran","t":"n","k":["nước Iran","Ba Tư"]},{"w":"恋人","r":"こいびと","m":"người yêu","t":"n","cls":1,"k":["bạn trai","bạn gái","người thương","người tình"]},{"w":"婚約する","r":"こんやくする","m":"đính hôn","t":"v","g":3,"mw":"婚約します","mr":"こんやくします","k":["hứa hôn","đính ước","làm lễ đính hôn","đám hỏi"]},{"w":"相手","r":"あいて","m":"đối phương, người kia","t":"n","cls":1,"k":["người đối diện","đối tác","đối thủ","bạn đời","người ta"]},{"w":"知り合う","r":"しりあう","m":"quen biết nhau","t":"v","g":1,"cls":1,"mw":"知り合います","mr":"しりあいます","k":["làm quen","quen nhau","gặp gỡ","kết bạn"]},{"w":"平均寿命","r":"へいきんじゅみょう","m":"tuổi thọ trung bình","t":"n","k":["tuổi thọ","tuổi thọ bình quân","thọ trung bình"]},{"w":"比べる","r":"くらべる","m":"so sánh","t":"v","g":2,"mw":"比べます","mr":"くらべます","k":["đối chiếu","so","so với","so bì"]},{"w":"博士","r":"はかせ","m":"tiến sĩ, nhà khoa học","t":"n","k":["học vị","nhà bác học","bác sĩ","học giả"]},{"w":"脳","r":"のう","m":"não","t":"n","k":["bộ não","đầu óc","trí não"]},{"w":"ホルモン","r":"ホルモン","m":"hoóc-môn","t":"n","k":["hormone","nội tiết tố","hormon"]},{"w":"化粧品","r":"けしょうひん","m":"mỹ phẩm","t":"n","k":["đồ trang điểm","son phấn","mỹ phẩm làm đẹp"]},{"w":"調べ","r":"しらべ","m":"kết quả điều tra, nghiên cứu","t":"n","k":["cuộc điều tra","khảo sát","số liệu"]},{"w":"化粧","r":"けしょう","m":"trang điểm","t":"n","k":["makeup","son phấn","đánh phấn","trang điểm mặt"]},{"w":"吹く","r":"ふく","m":"thổi (風が～: gió thổi)","t":"v","cls":1,"add":1,"g":1,"mw":"吹きます","mr":"ふきます","k":["thổi bay","gió","gió lộng"]},{"w":"燃える","r":"もえる","m":"cháy (ごみが～: rác cháy được)","t":"v","cls":1,"add":1,"g":2,"mw":"燃えます","mr":"もえます","k":["bốc cháy","bị cháy","cháy rực"]},{"w":"亡くなる","r":"なくなる","m":"qua đời","t":"v","cls":1,"add":1,"g":1,"mw":"亡くなります","mr":"なくなります","k":["chết","từ trần","mất đi","tạ thế"]},{"w":"化粧をする","r":"けしょうをする","m":"trang điểm","t":"v","cls":1,"add":1,"g":3,"mw":"化粧をします","mr":"けしょうをします","k":["makeup","đánh phấn","tô son","làm đẹp"]},{"w":"賛成する","r":"さんせいする","m":"tán thành (意見に～: tán thành ý kiến)","t":"v","cls":1,"add":1,"g":3,"mw":"賛成します","mr":"さんせいします","k":["đồng ý","ủng hộ","nhất trí","tán đồng"]},{"w":"反対する","r":"はんたいする","m":"phản đối (意見に～: phản đối ý kiến)","t":"v","cls":1,"add":1,"g":3,"mw":"反対します","mr":"はんたいします","k":["không đồng ý","chống đối","phản đối kịch liệt","chống lại"]},{"w":"世話をする","r":"せわをする","m":"chăm sóc","t":"v","cls":1,"add":1,"g":3,"mw":"世話をします","mr":"せわをします","k":["chăm nom","trông nom","coi sóc","lo cho"]},{"w":"企画する","r":"きかくする","m":"lên kế hoạch","t":"v","cls":1,"add":1,"g":3,"mw":"企画します","mr":"きかくします","k":["lập kế hoạch","hoạch định","lên ý tưởng","lên dự án"]},{"w":"データ","r":"データ","m":"dữ liệu","t":"n","cls":1,"add":1,"k":["số liệu","data","thông tin số","cơ sở dữ liệu"]},{"w":"関係","r":"かんけい","m":"quan hệ","t":"n","cls":1,"add":1,"k":["mối quan hệ","liên hệ","có liên quan","dính líu"]},{"w":"大統領","r":"だいとうりょう","m":"tổng thống","t":"n","cls":1,"add":1,"k":["nguyên thủ","người đứng đầu","chủ tịch nước"]},{"w":"消防車","r":"しょうぼうしゃ","m":"xe cứu hỏa","t":"n","cls":1,"add":1,"k":["xe chữa cháy","cứu hỏa","xe chữa lửa"]},{"w":"厳しい","r":"きびしい","m":"nghiêm khắc, khắc nghiệt","t":"a","cls":1,"add":1,"k":["khắt khe","nghiêm ngặt","khó khăn"]}],"compare":[{"title":"そうです (nghe nói) vs ようです vs らしい","points":[{"label":"そうです","text":"Truyền đạt nguyên thông tin nghe từ người khác, báo, TV; người nói không thêm phán đoán. Ví dụ: 天気予報によると、明日は雪だそうです."},{"label":"ようです","text":"Người nói tự quan sát dấu hiệu rồi phán đoán. Ví dụ: 道がぬれています。雨が降ったようです."},{"label":"らしい (N3)","text":"Ở giữa hai cái trên: phán đoán dựa trên thông tin nghe được hoặc dấu hiệu bên ngoài, mang tính khách quan, xa cách hơn. Ví dụ: 田中さんは会社をやめるらしい. Sẽ học kỹ ở N3."}],"tip":"Tai nghe được → そうです; mắt thấy rồi tự đoán → ようです; nghe phong thanh → らしい."},{"title":"そうです nghe nói (bài 47) vs そうです trông có vẻ (bài 43)","points":[{"label":"Nghe nói","text":"Thể thường + そうです: 雨が降るそうです (nghe nói trời sẽ mưa), おいしいそうです (nghe nói ngon)."},{"label":"Trông có vẻ","text":"Vます bỏ ます / Aい bỏ い / Aな + そうです: 雨が降りそうです (trông như sắp mưa), おいしそうです (trông có vẻ ngon)."}],"tip":"Thấy nguyên thể thường đứng trước そう là tin nghe kể; thấy gốc từ bị cắt là nhìn bằng mắt."}],"quiz":[{"q":"ニュースによると、昨日{きのう}九州{きゅうしゅう}で大{おお}きい地震{じしん}があった＿＿。","options":["ようです","ところです","そうです","はずです"],"answer":2,"explain":"によると cho biết thông tin nghe từ tin tức nên dùng そうです (nghe nói). ようです là phán đoán của chính người nói từ dấu hiệu quan sát được; khi nêu nguồn tin bằng によると thì truyền đạt lại bằng そうです."},{"q":"天気予報{てんきよほう}によると、明日{あした}は晴{は}れ＿＿そうです。","options":["だ","な","の","に"],"answer":0,"explain":"そうです (nghe nói) sau danh từ phải có だ: 晴れだそうです. の dùng với ようです (晴れのようです)."},{"q":"部屋{へや}の電気{でんき}が消{き}えています。マリアさんはもう寝{ね}た＿＿。","options":["そうです","ばかりです","ようです","つもりです"],"answer":2,"explain":"Người nói quan sát thấy đèn tắt rồi đoán nên dùng ようです. そうです là truyền lại lời người khác, không phù hợp với tình huống tự quan sát."},{"q":"外{そと}に人{ひと}がたくさん集{あつ}まっていますね。事故{じこ}＿＿ようです。","options":["な","の","だ","で"],"answer":1,"explain":"Danh từ đi với ようです phải thêm の: 事故のようです. な dùng cho tính từ đuôi な."},{"q":"台所{だいどころ}からいいにおいが＿＿。","options":["あります","します","なります","です"],"answer":1,"explain":"Cảm nhận mùi, tiếng, vị bằng giác quan dùng cấu trúc においがします. あります không dùng cho cảm nhận giác quan."}]},{"lesson":48,"title":"Thể sai khiến · Bắt làm và cho phép làm","summary":"Bài này dạy thể sai khiến (使役形) để nói ai đó bắt hoặc cho phép người khác làm gì, và cách xin phép lịch sự bằng 〜させていただけませんか.","grammar":[{"pattern":"使役形（thể sai khiến）","meaning":"Bắt / cho / để ai đó làm V","form":"Nhóm I: đuôi -u → -a + せる (書く→書かせる, 行く→行かせる, 待つ→待たせる, 買う→買わせる); Nhóm II: bỏ る + させる (食べる→食べさせる, 見る→見させる); Nhóm III: する→させる, 来る→来させる (こさせる)","notes":"Động từ sai khiến chia như động từ nhóm II (書かせます, 書かせて...). Chủ ngữ là người có quyền hơn (cha mẹ, cấp trên, giáo viên); không dùng khi người dưới bắt người trên làm.","examples":[{"ja":"母{はは}は子{こ}どもに野菜{やさい}を食{た}べさせます。","vi":"Mẹ bắt con ăn rau."},{"ja":"部長{ぶちょう}は新{あたら}しい社員{しゃいん}に報告書{ほうこくしょ}を書{か}かせました。","vi":"Trưởng phòng bắt nhân viên mới viết báo cáo."}]},{"pattern":"人を + 自動詞（使役）","meaning":"Bắt / cho ai đó làm (động từ tự động)","form":"Người làm hành động + を + 自動詞 thể sai khiến (行かせる, 帰らせる, 遊ばせる, 笑わせる...)","notes":"Với tự động từ, người thực hiện thường đánh dấu bằng を. Cũng dùng với động từ cảm xúc: 笑わせる (làm cho cười), 泣かせる (làm khóc), 心配させる (làm lo lắng).","examples":[{"ja":"部長{ぶちょう}は田中{たなか}さんを大阪{おおさか}へ出張{しゅっちょう}させました。","vi":"Trưởng phòng cử anh Tanaka đi công tác Osaka."},{"ja":"天気{てんき}がいいので、子{こ}どもを公園{こうえん}で遊{あそ}ばせました。","vi":"Trời đẹp nên tôi cho con chơi ở công viên."},{"ja":"彼{かれ}はおもしろい話{はなし}をして、みんなを笑{わら}わせました。","vi":"Anh ấy kể chuyện vui làm mọi người cười."}]},{"pattern":"人に + Nを + 他動詞（使役）","meaning":"Bắt / cho ai đó làm gì với N (động từ tha động)","form":"Người làm hành động + に + N + を + 他動詞 thể sai khiến","notes":"Câu đã có を cho tân ngữ nên người làm hành động dùng に (tránh hai を trong một câu).","examples":[{"ja":"先生{せんせい}は学生{がくせい}に作文{さくぶん}を書{か}かせました。","vi":"Thầy giáo bắt học sinh viết bài văn."},{"ja":"娘{むすめ}にピアノを習{なら}わせています。","vi":"Tôi cho con gái học piano."}]},{"pattern":"Bắt buộc (強制) vs Cho phép (許可)","meaning":"Cùng một thể sai khiến, nghĩa tùy ngữ cảnh: ép làm hoặc để cho làm","form":"Ngữ cảnh quyết định; với tự động từ, 人に thường thiên về cho phép, 人を thiên về bắt buộc","notes":"Nếu người kia muốn làm thì là cho phép (để cho), nếu không muốn thì là bắt buộc (bắt).","examples":[{"ja":"息子{むすこ}が留学{りゅうがく}したいと言{い}ったので、アメリカへ行{い}かせました。","vi":"Con trai nói muốn du học nên tôi để nó đi Mỹ. (cho phép)"},{"ja":"嫌{いや}がる子{こ}どもに薬{くすり}を飲{の}ませました。","vi":"Tôi bắt đứa trẻ đang không chịu uống thuốc phải uống. (bắt buộc)"}]},{"pattern":"Vさせていただけませんか","meaning":"Xin cho phép tôi được làm V (xin phép rất lịch sự)","form":"V thể sai khiến dạng て + いただけませんか","notes":"Người nói là người thực hiện hành động, xin phép người trên. Khác với Vていただけませんか (nhờ người kia làm).","examples":[{"ja":"体{からだ}の調子{ちょうし}が悪{わる}いので、今日{きょう}は早{はや}く帰{かえ}らせていただけませんか。","vi":"Tôi không được khỏe, hôm nay cho phép tôi về sớm được không ạ?"},{"ja":"この資料{しりょう}をコピーさせていただけませんか。","vi":"Cho phép tôi photo tài liệu này được không ạ?"}]}],"vocab":[{"w":"降ろす・下ろす","r":"おろす","m":"cho (người) xuống xe; hạ xuống, bỏ xuống","t":"v","g":1,"cls":1,"mw":"降ろします・下ろします","mr":"おろします","k":["thả xuống","đặt xuống","rút tiền","cho xuống"]},{"w":"届ける","r":"とどける","m":"chuyển đến, mang đến","t":"v","g":2,"cls":1,"mw":"届けます","mr":"とどけます","k":["giao","giao hàng","gửi đến","đưa tới","nộp"]},{"w":"世話をする","r":"せわをする","m":"chăm sóc","t":"v","g":3,"mw":"世話をします","mr":"せわをします","k":["chăm nom","trông nom","coi sóc","lo cho"]},{"w":"嫌","r":"いや","m":"ghét, không thích","t":"a","cls":1,"k":["không thích","không muốn","chán ghét"]},{"w":"厳しい","r":"きびしい","m":"nghiêm khắc, khắc nghiệt","t":"a","k":["khắt khe","nghiêm ngặt","khó khăn"]},{"w":"塾","r":"じゅく","m":"lớp học thêm","t":"n","cls":1,"k":["trung tâm luyện thi","học thêm","lò luyện thi","trường tư"]},{"w":"スケジュール","r":"スケジュール","m":"lịch trình","t":"n","cls":1,"k":["thời gian biểu","kế hoạch","lịch","lịch làm việc"]},{"w":"生徒","r":"せいと","m":"học sinh","t":"n","cls":1,"k":["học trò","học sinh trung học","trò"]},{"w":"者","r":"もの","m":"người (cách nói khiêm tốn về người phía mình)","t":"n","k":["người của tôi","kẻ","nhân viên"]},{"w":"入管","r":"にゅうかん","m":"cục quản lý xuất nhập cảnh","t":"n","k":["xuất nhập cảnh","sở di trú","cục di trú"]},{"w":"再入国ビザ","r":"さいにゅうこくビザ","m":"visa tái nhập cảnh","t":"n","k":["thị thực tái nhập","tái nhập cảnh","visa quay lại"]},{"w":"自由に","r":"じゆうに","m":"tự do, thoải mái","t":"x","cls":1,"k":["tự do","thoải mái","tùy thích","tùy ý"]},{"w":"～間","r":"～かん","m":"trong khoảng (thời gian) ～","t":"x","k":["trong vòng","suốt","khoảng"]},{"w":"いいことですね","r":"いいことですね","m":"Thật là tốt nhỉ","t":"e","k":["tốt quá","hay quá","tuyệt nhỉ","thật tốt"]},{"w":"お忙しいですか","r":"おいそがしいですか","m":"Anh/chị có bận không ạ?","t":"e","k":["bận không","có rảnh không","bận lắm không"]},{"w":"久しぶり","r":"ひさしぶり","m":"lâu rồi (mới lại ～)","t":"a","cls":1,"k":["lâu quá không gặp","đã lâu","lâu lắm rồi","lâu ngày"]},{"w":"営業","r":"えいぎょう","m":"kinh doanh, bộ phận bán hàng","t":"n","k":["bán hàng","sales","doanh nghiệp","buôn bán","kinh doanh bán hàng"]},{"w":"それまでに","r":"それまでに","m":"trước lúc đó","t":"x","k":["đến lúc đó","trước thời hạn","cho đến khi đó"]},{"w":"かまいません","r":"かまいません","m":"Không sao, không vấn đề gì","t":"e","cls":1,"k":["không sao đâu","được","không thành vấn đề","không hề gì"]},{"w":"楽しむ","r":"たのしむ","m":"tận hưởng, vui thú","t":"v","g":1,"mw":"楽しみます","mr":"たのしみます","k":["vui chơi","thưởng thức","vui vẻ","hưởng thụ"]},{"w":"もともと","r":"もともと","m":"vốn dĩ, ban đầu","t":"x","k":["vốn","vốn là","từ đầu","nguyên là","từ trước"]},{"w":"～世紀","r":"～せいき","m":"thế kỷ ～","t":"x","k":["thế kỉ"]},{"w":"代わりをする","r":"かわりをする","m":"thay thế, làm thay","t":"v","g":3,"mw":"代わりをします","mr":"かわりをします","k":["thay","thay mặt","làm hộ","thế chỗ"]},{"w":"スピード","r":"スピード","m":"tốc độ","t":"n","k":["vận tốc","nhanh","tốc lực"]},{"w":"競走する","r":"きょうそうする","m":"chạy đua","t":"v","g":3,"mw":"競走します","mr":"きょうそうします","k":["thi chạy","đua","chạy thi","thi đấu"]},{"w":"サーカス","r":"サーカス","m":"xiếc","t":"n","k":["rạp xiếc","đoàn xiếc","làm xiếc"]},{"w":"芸","r":"げい","m":"tiết mục, kỹ năng biểu diễn","t":"n","k":["nghệ thuật","tài nghệ","trò biểu diễn","màn biểu diễn"]},{"w":"美しい","r":"うつくしい","m":"đẹp","t":"a","cls":1,"k":["xinh đẹp","tươi đẹp","đẹp đẽ"]},{"w":"姿","r":"すがた","m":"dáng vẻ, hình dáng","t":"n","cls":1,"k":["bóng dáng","hình bóng","dung mạo","vóc dáng"]},{"w":"心","r":"こころ","m":"trái tim, tâm hồn","t":"n","k":["tấm lòng","lòng","tâm","tinh thần","cõi lòng"]},{"w":"とらえる","r":"とらえる","m":"nắm bắt, chiếm lấy (lòng người)","t":"v","g":2,"mw":"とらえます","mr":"とらえます","k":["bắt","tóm","bắt được","thu hút"]},{"w":"～にとって","r":"～にとって","m":"đối với ～","t":"x","k":["với","theo","về phía"]},{"w":"録音する","r":"ろくおんする","m":"ghi âm","t":"v","cls":1,"add":1,"g":3,"mw":"録音します","mr":"ろくおんします","k":["thu âm","ghi lại","thu tiếng"]},{"w":"代わる","r":"かわる","m":"thay, thay thế","t":"v","cls":1,"add":1,"g":1,"mw":"代わります","mr":"かわります","k":["thay mặt","đổi","thế chỗ","làm thay"]},{"w":"ファイル","r":"ファイル","m":"tệp, bìa hồ sơ","t":"n","cls":1,"add":1,"k":["tập tài liệu","tệp","file tài liệu"]}],"compare":[{"title":"人を vs 人に trong câu sai khiến","points":[{"label":"人を + 自動詞","text":"Động từ không có tân ngữ: 子どもを買い物に行かせる (bắt/cho con đi mua đồ), 社員を出張させる."},{"label":"人に + Nを + 他動詞","text":"Động từ có tân ngữ を: 子どもに部屋を掃除させる (bắt con dọn phòng). Không nói 子どもを部屋を…"},{"label":"人に + 自動詞","text":"Cũng có thể dùng に với tự động từ, khi đó thường mang ý tôn trọng ý muốn người kia (cho phép): 行きたい人に行かせる."}],"tip":"Một câu không được có hai を: đã có tân ngữ を thì người làm chuyển sang に."},{"title":"Vさせていただけませんか vs Vていただけませんか","points":[{"label":"させていただけませんか","text":"Tôi làm, xin người kia cho phép: 写真を撮らせていただけませんか (cho tôi chụp ảnh được không ạ)."},{"label":"ていただけませんか","text":"Người kia làm, tôi nhờ: 写真を撮っていただけませんか (anh chụp ảnh giúp tôi được không ạ)."}],"tip":"Có させ → mình là người làm; không có させ → nhờ người khác làm."}],"quiz":[{"q":"母{はは}は毎朝{まいあさ}弟{おとうと}に牛乳{ぎゅうにゅう}を＿＿。","options":["飲まれます","飲めます","飲ませます","飲みます"],"answer":2,"explain":"Mẹ bắt em trai uống sữa: chủ ngữ 母 + người làm に + thể sai khiến 飲ませます. 飲まれます là bị động/tôn kính, không hợp với cấu trúc 弟に牛乳を."},{"q":"部長{ぶちょう}は鈴木{すずき}さん＿＿大阪{おおさか}へ出張{しゅっちょう}させました。","options":["が","を","で","と"],"answer":1,"explain":"出張する là tự động từ, câu sai khiến đánh dấu người làm bằng を: 鈴木さんを出張させる. が sẽ biến 鈴木さん thành chủ ngữ, sai nghĩa."},{"q":"先生{せんせい}は学生{がくせい}＿＿漢字{かんじ}を書{か}かせました。","options":["を","が","に","で"],"answer":2,"explain":"Câu đã có 漢字を (tân ngữ) nên người làm hành động dùng に, tránh hai を. を sai vì sẽ thành hai を trong một câu."},{"q":"社長{しゃちょう}は朝{あさ}早{はや}く社員{しゃいん}を会社{かいしゃ}に＿＿。","options":["来られました","来ました","来れました","来させました"],"answer":3,"explain":"Thể sai khiến của 来る là 来させる (こさせる): giám đốc bắt nhân viên đến sớm. 来られました là bị động/tôn kính, không đi với 社員を."},{"q":"部長{ぶちょう}、すみません。熱{ねつ}があるので、今日{きょう}は＿＿いただけませんか。","options":["休んで","休ませて","休まれて","休めて"],"answer":1,"explain":"Người nói (bị sốt) xin trưởng phòng cho mình nghỉ nên dùng 休ませていただけませんか. 休んでいただけませんか là nhờ trưởng phòng nghỉ, sai nghĩa."}]},{"lesson":49,"title":"Tôn kính ngữ · Nói về hành động của người trên","summary":"Bài này dạy tôn kính ngữ (尊敬語) để nâng cao hành động của người trên, khách hàng: động từ tôn kính đặc biệt, お〜になります, thể bị động dùng làm tôn kính và お〜ください.","grammar":[{"pattern":"尊敬語の特別な動詞","meaning":"Động từ tôn kính đặc biệt","form":"行く・来る・いる→いらっしゃる; 食べる・飲む→召し上がる; 言う→おっしゃる; 見る→ご覧になる; する→なさる; くれる→くださる; 知っている→ご存じです","notes":"Dạng ます bất quy tắc: いらっしゃいます, おっしゃいます, なさいます, くださいます (る→い). Chỉ dùng cho hành động của người khác, không dùng cho bản thân.","examples":[{"ja":"社長{しゃちょう}は今{いま}、会議室{かいぎしつ}にいらっしゃいます。","vi":"Giám đốc hiện đang ở phòng họp."},{"ja":"先生{せんせい}、お昼{ひる}は何{なに}を召{め}し上{あ}がりますか。","vi":"Thưa thầy, buổi trưa thầy dùng món gì ạ?"},{"ja":"部長{ぶちょう}は山田{やまだ}さんの電話番号{でんわばんごう}をご存{ぞん}じですか。","vi":"Trưởng phòng có biết số điện thoại của anh Yamada không ạ?"}]},{"pattern":"お + Vます + になります / ご + N + になります","meaning":"Cách tôn kính chung cho hầu hết động từ","form":"お + V bỏ ます + になります (お帰りになる, お書きになる); với động từ Hán Nhật する: ご + N + になります (ご出席になる, ご利用になる)","notes":"Không dùng cho động từ có gốc một âm tiết (見る, 寝る) và động từ đã có dạng đặc biệt (行く→いらっしゃる). Không nói お見になる.","examples":[{"ja":"部長{ぶちょう}はもうお帰{かえ}りになりました。","vi":"Trưởng phòng đã về rồi ạ."},{"ja":"この本{ほん}は先生{せんせい}がお書{か}きになったんですか。","vi":"Cuốn sách này là thầy viết ạ?"},{"ja":"社長{しゃちょう}は来週{らいしゅう}の会議{かいぎ}にご出席{しゅっせき}になります。","vi":"Giám đốc sẽ tham dự cuộc họp tuần sau."}]},{"pattern":"受身形（Vれる・Vられる）を尊敬語として使う","meaning":"Dùng thể bị động làm tôn kính (mức độ nhẹ)","form":"Giống thể bị động: 読む→読まれる, 帰る→帰られる, 出かける→出かけられる, する→される, 来る→来られる","notes":"Mức kính trọng thấp hơn お〜になります, hay dùng trong công ty, văn viết. Dễ nhầm với nghĩa bị động, phải dựa vào ngữ cảnh.","examples":[{"ja":"社長{しゃちょう}は毎朝{まいあさ}新聞{しんぶん}を読{よ}まれます。","vi":"Giám đốc đọc báo mỗi sáng."},{"ja":"先生{せんせい}は明日{あした}何時{なんじ}に来{こ}られますか。","vi":"Ngày mai mấy giờ thầy đến ạ?"},{"ja":"部長{ぶちょう}は先週{せんしゅう}から出張{しゅっちょう}されています。","vi":"Trưởng phòng đi công tác từ tuần trước."}]},{"pattern":"お + Vます + ください / ご + N + ください","meaning":"Xin mời ... (yêu cầu, mời lịch sự hơn 〜てください)","form":"お + V bỏ ます + ください (お待ちください, お入りください); ご + N + ください (ご利用ください, ご注意ください)","notes":"Động từ có dạng đặc biệt dùng dạng riêng: 召し上がってください, ご覧ください, いらっしゃってください. Không dùng với gốc một âm tiết (không nói お見ください).","examples":[{"ja":"こちらで少々{しょうしょう}お待{ま}ちください。","vi":"Xin vui lòng đợi một chút ở đây."},{"ja":"どうぞ、お入{はい}りください。","vi":"Xin mời vào."},{"ja":"エレベーターをご利用{りよう}ください。","vi":"Xin hãy sử dụng thang máy."}]}],"vocab":[{"w":"勤める","r":"つとめる","m":"làm việc (会社に～: làm việc ở công ty)","t":"v","g":2,"cls":1,"mw":"勤めます","mr":"つとめます","k":["đi làm","công tác","làm cho","làm tại"]},{"w":"休む","r":"やすむ","m":"ngủ, nghỉ ngơi","t":"v","g":1,"mw":"休みます","mr":"やすみます","k":["nghỉ","nghỉ học","nghỉ làm","vắng mặt","đi ngủ"]},{"w":"掛ける","r":"かける","m":"ngồi (いすに～: ngồi lên ghế)","t":"v","g":2,"cls":1,"mw":"掛けます","mr":"かけます","k":["treo lên","móc","móc lên"]},{"w":"過ごす","r":"すごす","m":"trải qua (thời gian)","t":"v","g":1,"cls":1,"mw":"過ごします","mr":"すごします","k":["trôi qua","sống qua","dành thời gian","qua"]},{"w":"寄る","r":"よる","m":"ghé qua (銀行に～: ghé ngân hàng)","t":"v","g":1,"mw":"寄ります","mr":"よります","k":["tạt qua","tạt vào","ghé","ghé vào"]},{"w":"いらっしゃる","r":"いらっしゃる","m":"đi, đến, ở (tôn kính)","t":"v","g":1,"cls":1,"mw":"いらっしゃいます","mr":"いらっしゃいます","k":["có mặt","kính ngữ","ngài đến","có nhà"]},{"w":"召し上がる","r":"めしあがる","m":"ăn, uống (tôn kính)","t":"v","g":1,"cls":1,"mw":"召し上がります","mr":"めしあがります","k":["dùng bữa","mời ăn","xơi","thưởng thức"]},{"w":"おっしゃる","r":"おっしゃる","m":"nói (tôn kính)","t":"v","g":1,"cls":1,"mw":"おっしゃいます","mr":"おっしゃいます","k":["phát biểu","nói chuyện","bảo"]},{"w":"なさる","r":"なさる","m":"làm (tôn kính)","t":"v","g":1,"cls":1,"mw":"なさいます","mr":"なさいます","k":["thực hiện","tiến hành","ngài làm","quyết định"]},{"w":"ご覧になる","r":"ごらんになる","m":"xem (tôn kính)","t":"v","g":1,"cls":1,"mw":"ご覧になります","mr":"ごらんになります","k":["nhìn","coi","ngắm","xem qua"]},{"w":"あいさつ","r":"あいさつ","m":"chào hỏi, phát biểu chào mừng","t":"n","k":["lời chào","chào","phát biểu","chúc mừng"]},{"w":"灰皿","r":"はいざら","m":"gạt tàn","t":"n","k":["cái gạt tàn","đồ gạt tàn thuốc","gạt tàn thuốc"]},{"w":"旅館","r":"りょかん","m":"nhà trọ kiểu Nhật","t":"n","cls":1,"k":["ryokan","khách sạn Nhật","nhà nghỉ","quán trọ"]},{"w":"会場","r":"かいじょう","m":"hội trường, địa điểm tổ chức","t":"n","k":["nơi tổ chức","sảnh","nơi diễn ra","địa điểm sự kiện"]},{"w":"バス停","r":"バスてい","m":"bến xe buýt","t":"n","cls":1,"k":["trạm xe buýt","điểm dừng xe buýt","bến xe"]},{"w":"貿易","r":"ぼうえき","m":"thương mại, mậu dịch","t":"n","k":["buôn bán","ngoại thương","xuất nhập khẩu","giao thương"]},{"w":"～様","r":"～さま","m":"ngài, quý (tôn kính của ～さん)","t":"x","cls":1,"k":["quý khách","quý ông","kính gửi"]},{"w":"帰りに","r":"かえりに","m":"trên đường về","t":"x","k":["lúc về","khi về","tiện đường về"]},{"w":"たまに","r":"たまに","m":"thỉnh thoảng","t":"x","cls":1,"k":["đôi khi","thi thoảng","lâu lâu","hiếm khi"]},{"w":"ちっとも","r":"ちっとも","m":"chẳng ～ chút nào (đi với phủ định)","t":"x","k":["không chút nào","hoàn toàn không","chẳng hề","tí nào"]},{"w":"遠慮なく","r":"えんりょなく","m":"đừng ngại, cứ tự nhiên","t":"x","k":["đừng khách sáo","tự nhiên","không cần ngại","thoải mái"]},{"w":"～年～組","r":"～ねん～くみ","m":"lớp ～ năm thứ ～","t":"x","k":["lớp","năm học","khối lớp"]},{"w":"では","r":"では","m":"vậy thì","t":"x","k":["thế thì","vậy","thế","nào"]},{"w":"出す","r":"だす","m":"bị (sốt) (熱を～: bị sốt)","t":"v","g":1,"mw":"出します","mr":"だします","k":["vứt","lấy ra","đưa ra"]},{"w":"よろしくお伝えください","r":"よろしくおつたえください","m":"Cho tôi gửi lời hỏi thăm","t":"e","k":["gửi lời hỏi thăm","cho gửi lời chào","nhắn hộ"]},{"w":"失礼いたします","r":"しつれいいたします","m":"Xin phép (chào khi rời đi, cúp máy)","t":"e","k":["tạm biệt","chào ạ","xin phép cúp máy","xin cáo từ"]},{"w":"講師","r":"こうし","m":"giảng viên","t":"n","k":["giáo viên","thầy giáo","người dạy","diễn giả"]},{"w":"多くの～","r":"おおくの～","m":"nhiều ～","t":"x","k":["rất nhiều","nhiều người","đông đảo"]},{"w":"作品","r":"さくひん","m":"tác phẩm","t":"n","k":["tác phẩm nghệ thuật","sản phẩm","công trình"]},{"w":"受賞する","r":"じゅしょうする","m":"đoạt giải","t":"v","g":3,"mw":"受賞します","mr":"じゅしょうします","k":["nhận giải","được giải","giành giải","đạt giải"]},{"w":"世界的に","r":"せかいてきに","m":"mang tầm thế giới","t":"x","k":["toàn cầu","quốc tế","nổi tiếng thế giới"]},{"w":"作家","r":"さっか","m":"nhà văn","t":"n","k":["tác giả","nhà thơ","văn sĩ","người viết"]},{"w":"～でございます","r":"～でございます","m":"là ～ (lịch sự của ～です)","t":"e","k":["xin thưa","chính là","đây là"]},{"w":"長男","r":"ちょうなん","m":"con trai cả","t":"n","k":["con cả","trưởng nam","con trai đầu"]},{"w":"障害","r":"しょうがい","m":"khuyết tật, trở ngại","t":"n","k":["tàn tật","chướng ngại","khó khăn","cản trở"]},{"w":"お持ちです","r":"おもちです","m":"có (tôn kính của 持っています)","t":"e","k":["sở hữu","đang có","mang theo"]},{"w":"作曲","r":"さっきょく","m":"sáng tác nhạc","t":"n","k":["soạn nhạc","nhạc sĩ","viết nhạc","sáng tác"]},{"w":"活動","r":"かつどう","m":"hoạt động","t":"n","k":["công việc","hoạt động xã hội","sự hoạt động"]},{"w":"それでは","r":"それでは","m":"vậy thì, sau đây","t":"x","k":["thế thì","vậy","tiếp theo"]},{"w":"東京大学","r":"とうきょうだいがく","m":"Đại học Tokyo","t":"n","k":["Todai","đại học Đông Kinh"]},{"w":"ノーベル文学賞","r":"ノーベルぶんがくしょう","m":"giải Nobel Văn học","t":"n","k":["giải Nobel","Nobel văn chương"]},{"w":"利用する","r":"りようする","m":"sử dụng","t":"v","cls":1,"add":1,"g":3,"mw":"利用します","mr":"りようします","k":["dùng","khai thác","sử dụng dịch vụ"]},{"w":"挨拶する","r":"あいさつする","m":"chào hỏi","t":"v","cls":1,"add":1,"g":3,"mw":"挨拶します","mr":"あいさつします","k":["chào","chào hỏi xã giao","phát biểu"]},{"w":"ご存じです","r":"ごぞんじです","m":"biết (tôn kính ngữ của 知っています)","t":"e","cls":1,"add":1,"k":["biết rõ","có biết","hiểu"]},{"w":"奥様","r":"おくさま","m":"phu nhân, vợ (người khác, kính ngữ)","t":"n","cls":1,"add":1,"k":["bà xã","phu nhân của anh","vợ ngài","bà nhà"]}],"compare":[{"title":"Vられる bị động (bài 37) vs Vられる tôn kính (bài 49)","points":[{"label":"Bị động","text":"Chủ ngữ chịu tác động, người gây ra hành động đánh dấu bằng に: 私は先生に叱られました (tôi bị thầy mắng)."},{"label":"Tôn kính","text":"Chủ ngữ là người trên tự làm hành động, không có 人に: 先生は7時に来られました (thầy đã đến lúc 7 giờ)."}],"tip":"Thấy người trên là chủ ngữ tự làm việc → tôn kính; thấy ai đó に làm gì mình → bị động."},{"title":"お〜ください vs 〜てください","points":[{"label":"〜てください","text":"Yêu cầu thông thường, dùng với bạn bè, đồng nghiệp: ここで待ってください."},{"label":"お〜ください","text":"Lịch sự hơn, dùng với khách hàng, người trên, thông báo nơi công cộng: こちらでお待ちください."}],"tip":"Nhân viên nói với khách thì luôn chọn お〜ください."}],"quiz":[{"q":"先生{せんせい}、もう昼{ひる}ご飯{はん}を＿＿か。","options":["いただきました","召し上がりました","お食べしました","拝見しました"],"answer":1,"explain":"Hỏi về hành động ăn của thầy nên dùng tôn kính ngữ 召し上がる. いただく là khiêm nhường ngữ, chỉ dùng cho hành động của mình."},{"q":"部長{ぶちょう}は何時{なんじ}ごろ会社{かいしゃ}に＿＿か。","options":["参ります","おります","いらっしゃいます","伺います"],"answer":2,"explain":"Hành động đến của trưởng phòng dùng tôn kính ngữ いらっしゃいます. 参ります là khiêm nhường ngữ của 行く・来る, dùng cho bản thân."},{"q":"社長{しゃちょう}はもうお帰{かえ}り＿＿。","options":["しました","いたしました","ください","になりました"],"answer":3,"explain":"Tôn kính ngữ dạng お + Vます + になります: お帰りになりました. お帰りしました là dạng khiêm nhường (お〜します), sai khi nói về giám đốc."},{"q":"少々{しょうしょう}お待{ま}ち＿＿。","options":["ください","になります","られます","させます"],"answer":0,"explain":"Mời khách chờ: お + Vます + ください → お待ちください. お待ちになります là câu trần thuật, không phải lời mời."},{"q":"部長{ぶちょう}、この写真{しゃしん}をもう＿＿か。","options":["拝見しました","ご覧になりました","お見になりました","見させました"],"answer":1,"explain":"見る có dạng tôn kính đặc biệt là ご覧になる. Không có dạng お見になる vì 見る có gốc chỉ một âm tiết; 拝見する là khiêm nhường."}]},{"lesson":50,"title":"Khiêm nhường ngữ · Lịch sự ngữ","summary":"Bài này dạy khiêm nhường ngữ (謙譲語) để hạ thấp hành động của mình hoặc người trong nhóm mình khi nói với người trên, khách hàng, và lịch sự ngữ ございます・でございます.","grammar":[{"pattern":"謙譲語の特別な動詞","meaning":"Động từ khiêm nhường đặc biệt","form":"行く・来る→参る (伺う: đến thăm); いる→おる; 食べる・飲む・もらう→いただく; 言う→申す; する→いたす; 見る→拝見する; 知っている→存じております (知らない→存じません); 聞く・訪ねる→伺う; 会う→お目にかかる","notes":"Chỉ dùng cho hành động của mình hoặc người thuộc nhóm mình (gia đình, công ty). Khi nói với người ngoài công ty, gọi đồng nghiệp, cấp trên bằng tên không kèm さん và dùng khiêm nhường: 田中はただ今席を外しております.","examples":[{"ja":"初{はじ}めまして。グエンと申{もう}します。","vi":"Xin chào, tôi tên là Nguyễn."},{"ja":"明日{あした}の午後{ごご}、お宅{たく}に伺{うかが}ってもよろしいでしょうか。","vi":"Chiều mai tôi đến thăm nhà anh được không ạ?"},{"ja":"先日{せんじつ}、社長{しゃちょう}の奥様{おくさま}にお目{め}にかかりました。","vi":"Hôm trước tôi đã được gặp phu nhân giám đốc."}]},{"pattern":"お + Vます + します / ご + N + します","meaning":"Tôi (xin) làm V (cho người trên) — khiêm nhường chung","form":"お + V bỏ ます + します (お持ちします, お送りします); ご + N + します (ご案内します, ご連絡します). Khiêm nhường hơn: お〜いたします","notes":"Chỉ dùng khi hành động của mình có liên quan, hướng tới người được kính trọng. Không dùng cho việc chỉ liên quan bản thân (không nói お食べします). Không dùng với gốc một âm tiết (見る, いる).","examples":[{"ja":"重{おも}そうですね。荷物{にもつ}をお持{も}ちしましょうか。","vi":"Trông nặng quá, để tôi xách hành lý giúp nhé?"},{"ja":"駅{えき}まで車{くるま}でお送{おく}りします。","vi":"Tôi xin đưa anh ra ga bằng ô tô."},{"ja":"会議室{かいぎしつ}へご案内{あんない}いたします。","vi":"Tôi xin dẫn quý khách đến phòng họp."}]},{"pattern":"丁寧語：ございます / でございます","meaning":"Lịch sự ngữ: ございます = あります, でございます = です","form":"N + が + ございます (thay あります); N・Aな + でございます (thay です); いいですか → よろしいでしょうか","notes":"Không nâng người nghe hay hạ mình mà làm cả câu trang trọng hơn, thường dùng trong dịch vụ, cửa hàng, khách sạn.","examples":[{"ja":"お手洗{てあら}いはあちらでございます。","vi":"Nhà vệ sinh ở phía đằng kia ạ."},{"ja":"こちらに新{あたら}しいカタログがございます。","vi":"Ở đây có catalogue mới ạ."},{"ja":"お電話{でんわ}ありがとうございます。ABC旅行{りょこう}でございます。","vi":"Cảm ơn quý khách đã gọi. Công ty du lịch ABC xin nghe."}]}],"vocab":[{"w":"参る","r":"まいる","m":"đi, đến (khiêm nhường)","t":"v","g":1,"trap":1,"cls":1,"mw":"参ります","mr":"まいります","k":["tới","xin đến","xin đi"]},{"w":"おる","r":"おる","m":"ở, có mặt (khiêm nhường)","t":"v","g":1,"cls":1,"mw":"おります","mr":"おります","k":["có ở","đang ở","có nhà"]},{"w":"いただく","r":"いただく","m":"ăn, uống, nhận (khiêm nhường)","t":"v","g":1,"cls":1,"mw":"いただきます","mr":"いただきます","k":["được cho","xin","dùng bữa"]},{"w":"申す","r":"もうす","m":"nói, tên là (khiêm nhường)","t":"v","g":1,"cls":1,"mw":"申します","mr":"もうします","k":["thưa","tên tôi là","xin thưa"]},{"w":"いたす","r":"いたす","m":"làm (khiêm nhường)","t":"v","g":1,"cls":1,"mw":"いたします","mr":"いたします","k":["thực hiện","xin làm","xin phép làm"]},{"w":"拝見する","r":"はいけんする","m":"xem (khiêm nhường)","t":"v","g":3,"cls":1,"mw":"拝見します","mr":"はいけんします","k":["nhìn","xem qua","đọc","xin xem"]},{"w":"存じる","r":"ぞんじる","m":"biết (khiêm nhường)","t":"v","g":2,"cls":1,"mw":"存じます","mr":"ぞんじます","k":["hiểu","biết rõ","được biết","quen biết"]},{"w":"伺う","r":"うかがう","m":"hỏi, nghe, đến thăm (khiêm nhường)","t":"v","g":1,"cls":1,"mw":"伺います","mr":"うかがいます","k":["ghé thăm","hỏi","nghe"]},{"w":"お目にかかる","r":"おめにかかる","m":"gặp (khiêm nhường)","t":"v","g":1,"cls":1,"mw":"お目にかかります","mr":"おめにかかります","k":["gặp gỡ","được gặp","diện kiến","hân hạnh gặp"]},{"w":"ございます","r":"ございます","m":"có (lịch sự của あります)","t":"e","k":["là","xin thưa","có ạ","thưa có"]},{"w":"～でございます","r":"～でございます","m":"là ～ (lịch sự của ～です)","t":"e","k":["xin thưa","chính là","đây là"]},{"w":"私","r":"わたくし","m":"tôi (khiêm nhường, trang trọng)","t":"n","cls":1,"k":["bản thân","mình","ta","em"]},{"w":"ガイド","r":"ガイド","m":"hướng dẫn viên","t":"n","cls":1,"k":["người hướng dẫn","hướng dẫn","dẫn đường","sách hướng dẫn"]},{"w":"お宅","r":"おたく","m":"nhà (của người khác, tôn kính)","t":"n","cls":1,"k":["nhà anh","nhà chị","quý gia"]},{"w":"郊外","r":"こうがい","m":"ngoại ô","t":"n","k":["vùng ven","ngoại thành","vùng ngoại ô"]},{"w":"アルバム","r":"アルバム","m":"album ảnh","t":"n","k":["cuốn album","tập ảnh","quyển ảnh"]},{"w":"再来週","r":"さらいしゅう","m":"tuần sau nữ       <span class="rr jp">${o.v.r!==o.v.w?esc(o.v.r):""}${o.v.mw?`<span>${esc(o.v.mw)}</span>`:""}<em>${esc(toRoma(o.v.r.replace(/[［\[].*?[］\]]/g,"")))}</em></span>
      <span class="rm">${esc(o.v.m)}</span><span class="rl">${o.ls.length?"Bài "+o.ls.join(", "):""}${o.ls.length&&o.n5?"<br>":""}${o.n5?`<span class="n5l">N5 · Bài ${o.n5.join(", ")}</span>`:""}</span></button>`).join("")}</div>${vs.length>80?`<p class="foot">Hiện 80 kết quả đầu, gõ cụ thể hơn để thu hẹp.</p>`:""}</section>`:""}
  ${gr.length?`<section class="block"><h3>Ngữ pháp</h3><div class="rlist">${gr.map(o=>`<button class="rrow" data-go="${o.l}"><span class="rw jp">${esc(o.g.pattern)}</span><span class="rr"></span><span class="rm">${esc(o.g.meaning)}</span><span class="rl">Bài ${o.l}</span></button>`).join("")}</div></section>`:""}
  ${!vs.length&&!gr.length?`<p class="empty">Không tìm thấy. Thử gõ ít chữ hơn, bỏ dấu, hoặc gõ romaji (ví dụ: "taberu").</p>`:""}`;
}
function placeRes(){
  const box=$("#sres");if(box.hidden)return;
  const r=$("#q").getBoundingClientRect(), narrow=window.innerWidth<860;
  const top=Math.max(8,r.bottom+6);
  box.style.top=top+"px";
  if(narrow){box.style.left="8px";box.style.width=(window.innerWidth-16)+"px";}
  else{box.style.left=r.left+"px";box.style.width=Math.min(920,window.innerWidth-r.left-24)+"px";}
  box.style.maxHeight=(window.innerHeight-top-12)+"px";
}
function openRes(){const box=$("#sres");box.hidden=false;placeRes();}
function closeRes(){$("#sres").hidden=true;}
window.addEventListener("resize",placeRes);window.addEventListener("scroll",placeRes,{passive:true});
function go(n){
  closeRes();
  cur=n;answered={};store.set("last",n);
  try{history.replaceState(null,"","#b"+n);}catch(e){}
  renderNav();renderLesson();window.scrollTo({top:0});
  const vm=vocabMatches(L.find(x=>x.lesson===n),query.trim());
  if(vm.length){vm.forEach(o=>{const c=document.querySelector(`.vc[data-vi="${o.i}"]`);if(c)c.classList.add("match");});
    const f=document.querySelector(`.vc[data-vi="${vm[0].i}"]`);if(f)setTimeout(()=>f.scrollIntoView({block:"center"}),50);}
}
function applyToggles(){
  $("#main").classList.toggle("nofuri",!furi);
  $("#main").classList.toggle("hidemean",hideMean);
  $("#tFuri").setAttribute("aria-pressed",furi);
  $("#tMean").setAttribute("aria-pressed",hideMean);
}
document.querySelector(".modes").addEventListener("click",e=>{const b=e.target.closest(".mode");if(b)setMode(b.dataset.mode);});
$("#sheet").addEventListener("click",e=>{if(e.target.closest("[data-close]"))closeSheet();});
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(!$("#sheet").hidden)closeSheet();else closeRes();});
document.addEventListener("pointerdown",e=>{
  if($("#sres").hidden)return;
  if(e.target.closest("#sres")||e.target.closest("#q")||e.target.closest("#sheet"))return;
  closeRes();
});
$("#q").addEventListener("focus",()=>{const q=query.trim();if(mode==="lesson"&&searchable(q))renderResults(q);});
$("#nav").addEventListener("click",e=>{const b=e.target.closest("button[data-l]");if(b){if(mode!=="lesson")setMode("lesson");go(+b.dataset.l);}});
$("#sel").addEventListener("change",e=>go(+e.target.value));
$("#q").addEventListener("input",e=>{query=e.target.value;const q=query.trim();if(mode==="kanji"){renderKanji();return;}if(mode==="verbs"){renderNav();renderVerbs();return;}renderNav();if(searchable(q))renderResults(q);else closeRes();});
$("#tFuri").addEventListener("click",()=>{furi=!furi;store.set("furi",furi);applyToggles();});
$("#tMean").addEventListener("click",()=>{hideMean=!hideMean;applyToggles();});
const mainClick=e=>{
  if(e.target.closest("#sresClose")){closeRes();return;}
  const o=e.target.closest(".opts button");if(o){onAnswer(+o.closest(".qi").dataset.q,+o.dataset.o);return;}
  if(e.target.closest("#redo")){answered={};renderLesson();document.getElementById("s-q").scrollIntoView();return;}
  const kjb=e.target.closest("[data-kj]");if(kjb){if(kjb.closest(".khide")&&!kjb.classList.contains("show")){kjb.classList.add("show");return;}openKanji(kjb.dataset.kj);return;}
  const kfb=e.target.closest("[data-kf]");if(kfb){kf.lv=kfb.dataset.kf;renderKanji();return;}
  if(e.target.closest("#kquiz")){kquiz=!kquiz;renderKanji();return;}
  if(e.target.closest("#allkanji")){closeRes();setMode("kanji");return;}
  const fb=e.target.closest("[data-vf]");if(fb){vf[fb.dataset.vf]=fb.dataset.v;renderVerbs();return;}
  if(e.target.closest("#vquiz")){vquiz=!vquiz;renderVerbs();return;}
  if(e.target.closest("#allverbs")){closeRes();setMode("verbs");return;}
  const fcv=e.target.closest(".vhide .fc");if(fcv){fcv.classList.toggle("show");return;}
  if(e.target.closest("#clearq")){$("#q").value="";query="";renderNav();renderLesson();return;}
  const vkb=e.target.closest("[data-vk]");if(vkb){const ve=VKEY.get(vkb.dataset.vk);if(ve)openSheet(ve);return;}
  const g=e.target.closest("[data-go]");if(g&&g.dataset.go){go(+g.dataset.go);return;}
  const v=e.target.closest(".vc");
  if(v&&hideMean){v.classList.toggle("show");return;}
  if(v){const x=L.find(x=>x.lesson===cur),it=x&&x.vocab[+v.dataset.vi];
    if(it&&it.t==="v"){const e=VKEY.get(it.w.split("・")[0]+"|"+it.r.split("・")[0]);if(e)openSheet(e);}}
};
$("#main").addEventListener("click",mainClick);
$("#sresBody").addEventListener("click",mainClick);
if(location.hash==="#dongtu")mode="verbs";
if(location.hash==="#kanji")mode="kanji";
const h=(location.hash.match(/^#b(\d+)$/)||[])[1];
const start=h&&L.some(x=>x.lesson==h)?+h:store.get("last",L[0].lesson);
cur=L.some(x=>x.lesson===start)?start:L[0].lesson;
setMode(mode);
</script>
