<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Ôn tập N4 Minna no Nihongo bài 26–50: ngữ pháp, từ vựng, kanji, bảng chia động từ, luyện tập, tra cứu từ vựng N5.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Sổ tay ôn tập N4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --ink:#1B2230; --muted:#5E6878; --line:#DDE2EA; --soft:#EDF0F5;
  --accent:#2B4C7E; --accent-soft:#E3EAF5; --on-accent:#FFFFFF;
  --ok:#23735F; --okbg:#DDF0EA; --bad:#A8432A; --badbg:#F7E4DE;
  --warn:#8A5A00; --warnbg:#FFF2D6;
  --g1:#2B4C7E; --g1bg:#E3EAF5; --g2:#23735F; --g2bg:#DDF0EA; --g3:#A8432A; --g3bg:#F7E4DE;
  --jp:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --vi:"Be Vietnam Pro",system-ui,sans-serif;
  --disp:"Shippori Mincho","Hiragino Mincho ProN",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#12161D; --surface:#1A1F28; --ink:#E6EAF0; --muted:#98A2B3; --line:#2C3441; --soft:#222834;
  --accent:#8FB0E3; --accent-soft:#223149; --on-accent:#12161D;
  --ok:#6FC7AE; --okbg:#1B3A32; --bad:#EE9A83; --badbg:#3D2520; --warn:#F0C36A; --warnbg:#3A2F17;
  --g1:#8FB0E3; --g1bg:#223149; --g2:#6FC7AE; --g2bg:#1B3A32; --g3:#EE9A83; --g3bg:#3D2520;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#12161D; --surface:#1A1F28; --ink:#E6EAF0; --muted:#98A2B3; --line:#2C3441; --soft:#222834;
  --accent:#8FB0E3; --accent-soft:#223149; --on-accent:#12161D;
  --ok:#6FC7AE; --okbg:#1B3A32; --bad:#EE9A83; --badbg:#3D2520; --warn:#F0C36A; --warnbg:#3A2F17;
  --g1:#8FB0E3; --g1bg:#223149; --g2:#6FC7AE; --g2bg:#1B3A32; --g3:#EE9A83; --g3bg:#3D2520;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--vi);padding-inline:16px;padding-block:20px 48px}
.jp{font-family:var(--jp)}
button{font-family:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:270px minmax(0,1fr);gap:28px;align-items:start}

/* sidebar */
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 24px)}
.brand h1{font:800 24px/1.15 var(--disp);margin:0}
.brand h1 span{color:var(--accent)}
.brand p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.brand a{color:var(--accent);font-weight:600;text-decoration:none}
.brand a:hover{text-decoration:underline}
.search input{width:100%;font:14px var(--vi);padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.toggles{display:flex;gap:6px;flex-wrap:wrap}
.tg{font:500 12.5px var(--vi);padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.tg[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
nav.lessons{overflow-y:auto;display:flex;flex-direction:column;gap:2px;padding-right:4px;min-height:0}
nav.lessons button{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:baseline;text-align:left;border:0;background:none;color:var(--ink);padding:7px 8px;border-radius:7px;cursor:pointer}
nav.lessons button:hover{background:var(--soft)}
nav.lessons button[aria-current="true"]{background:var(--accent-soft)}
nav.lessons .n{font:700 14px var(--disp);color:var(--accent);font-variant-numeric:tabular-nums}
nav.lessons .t{font-size:13px;line-height:1.35;color:var(--ink)}
nav.lessons .hit{display:block;white-space:pre-line;font:12px var(--jp);color:var(--muted);margin-top:2px}
nav.lessons .sc{font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
nav.lessons .sc.full{color:var(--ok)}
.mselect{display:none}

/* main */
main{min-width:0;display:flex;flex-direction:column;gap:22px}
.lhead{display:flex;flex-direction:column;gap:6px}
.lhead .eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lhead h2{margin:0;font:800 clamp(24px,3.4vw,32px)/1.2 var(--disp);text-wrap:balance}
.lhead h2 b{color:var(--accent);margin-right:10px}
.lhead p{margin:0;color:var(--muted);max-width:70ch}
.jump{display:flex;gap:6px;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:8px;z-index:3;border-bottom:1px solid var(--line)}
.jump a{font-size:13px;font-weight:500;color:var(--ink);text-decoration:none;padding:5px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.jump a:hover{border-color:var(--accent);color:var(--accent)}
section.block{display:flex;flex-direction:column;gap:12px;scroll-margin-top:60px}
section.block>h3{margin:0;font:700 13px var(--vi);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:10px}
section.block>h3::after{content:"";flex:1;height:1px;background:var(--line)}

.gp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.gp .pat{font:700 19px/1.35 var(--jp);color:var(--accent)}
.gp .mean{font-weight:600}
.gp .form{font:14px/1.5 var(--jp);background:var(--soft);padding:6px 10px;border-radius:6px;overflow-wrap:anywhere}
.gp .form::before{content:"Cách ghép · ";font-family:var(--vi);font-size:12px;font-weight:600;color:var(--muted)}
.gp .notes{font-size:14px;color:var(--muted)}
.ex{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.ex li{display:flex;flex-direction:column;gap:1px;padding-left:12px;border-left:2px solid var(--line)}
.ex .ja{font:17px/2 var(--jp)}
.ex .vi{font-size:14px;color:var(--muted)}
ruby rt{font-size:.55em;color:var(--muted);font-family:var(--jp)}
.nofuri ruby rt{visibility:hidden}

.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.vgroup{display:flex;flex-direction:column;gap:8px}
.vgroup h4{margin:4px 0 0;font:600 14px var(--vi);color:var(--ink)}
.vgroup h4 .vlegend{font-style:normal;font-weight:400;font-size:12px;color:var(--muted);margin-left:10px;font-family:var(--jp)}
.vgroup h4 span{font-weight:500;color:var(--muted);font-size:12.5px;margin-left:4px}
.vc .vg{display:inline-block;vertical-align:middle;margin-left:8px;font:700 11px/1 var(--vi);letter-spacing:.03em;padding:3px 7px;border-radius:999px}
.vg.g1{color:var(--g1);background:var(--g1bg)} .vg.g2{color:var(--g2);background:var(--g2bg)} .vg.g3{color:var(--g3);background:var(--g3bg)}
.vc.match{outline:2px solid var(--accent);outline-offset:1px;background:var(--accent-soft)}
.rlist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.rrow{display:grid;grid-template-columns:230px 150px minmax(0,1fr) 120px;gap:12px;align-items:baseline;text-align:left;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);cursor:pointer;font:inherit}
.rrow:last-child{border-bottom:0}
.rrow:hover{background:var(--soft)}
.rrow .rw{font-size:18px;font-weight:700}
.rrow .rw .vg{margin-left:8px;vertical-align:middle;font:700 11px/1 var(--vi);padding:3px 7px;border-radius:999px;display:inline-block}
.rrow .rr{font-size:13.5px;color:var(--muted);display:flex;flex-direction:column}
.rrow .lop{margin-left:6px;vertical-align:middle;display:inline-block;font:700 10.5px/1 var(--vi);color:var(--warn);background:var(--warnbg);padding:3px 6px;border-radius:4px}
.near{display:inline-block;vertical-align:middle;margin-left:6px;font:600 10.5px/1 var(--vi);color:var(--muted);border:1px dashed var(--line);padding:2px 6px;border-radius:4px}
.n5l{color:var(--muted);font-weight:600}
.rrow[data-none]{cursor:default}
.rrow .rr em{font-style:normal;font-family:var(--vi);font-size:12px}
.rrow .rm{font-size:14px}
.rrow .rl{font-size:12px;font-weight:600;color:var(--accent);text-align:right}
.foot,.empty{color:var(--muted);font-size:13px}
@media (max-width:640px){.rrow{grid-template-columns:1fr auto;gap:2px 10px}.rrow .rr{grid-column:1}.rrow .rm{grid-column:1/-1}.rrow .rl{grid-row:1;grid-column:2}}
.vc{position:relative}
.vc .mf{font-size:12.5px;color:var(--muted)}
.vc .lop{display:inline-block;vertical-align:middle;margin-left:6px;font:700 10.5px/1 var(--vi);letter-spacing:.04em;color:var(--warn);background:var(--warnbg);padding:3px 6px;border-radius:4px}
.vc{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;display:flex;flex-direction:column;gap:1px}
.vc .w{font:700 18px/1.3 var(--jp)}
.vc .r{font:13px var(--jp);color:var(--muted)}
.vc .m{font-size:13.5px}
.hidemean .vc{cursor:pointer}
.hidemean .vc .m{color:transparent;background:repeating-linear-gradient(135deg,var(--soft) 0 6px,transparent 6px 12px);border-radius:3px}
.hidemean .vc.show .m{color:var(--ink);background:none}

.cmp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.cmp h4{margin:0;font:700 16px var(--jp)}
.cmp .pts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.cmp .pt{background:var(--soft);border-radius:7px;padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.cmp .pt b{font:700 15px var(--jp);color:var(--accent)}
.cmp .pt span{font-size:14px}
.cmp .tip{font-size:13.5px;color:var(--warn);background:var(--warnbg);padding:7px 10px;border-radius:6px}
.cmp .tip::before{content:"Mẹo nhớ · ";font-weight:700}

.quiz{display:flex;flex-direction:column;gap:12px}
.qi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.qi .qn{font-size:12px;font-weight:600;color:var(--muted)}
.qi .q{font:17px/2 var(--jp)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.opts button{font:16px var(--jp);text-align:left;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.opts button:hover:not(:disabled){border-color:var(--accent)}
.opts button:disabled{cursor:default}
.opts button.right{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:700}
.opts button.wrong{background:var(--badbg);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.qi .exp{font-size:14px;padding:8px 11px;border-radius:7px;background:var(--soft)}
.qi .exp b.okt{color:var(--ok)} .qi .exp b.badt{color:var(--bad)}
.qbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qbar .score{font-weight:600;font-variant-numeric:tabular-nums}
.btn{font:600 13.5px var(--vi);padding:8px 14px;border-radius:8px;border:1px solid var(--accent);background:var(--surface);color:var(--accent);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:8px;border-top:1px solid var(--line)}
.pager .btn{max-width:48%;text-align:left}
.pager .btn:disabled{visibility:hidden}

@media (max-width:860px){
  .app{grid-template-columns:1fr;gap:16px}
  aside{position:static;max-height:none}
  nav.lessons{display:none}
  .mselect{display:block}
  .mselect select{width:100%;font:15px var(--vi);padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}

.modes{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--soft);border-radius:9px;padding:3px;gap:3px}
.mode{font:600 13.5px var(--vi);padding:7px 8px;border:0;border-radius:7px;background:none;color:var(--muted);cursor:pointer}
.mode[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.mselect.off{display:none!important}
nav.lessons[hidden]{display:none!important}
.vc.isverb{cursor:pointer}
.vc.isverb:hover{border-color:var(--accent)}
.vc.isverb .w::after{content:"Chia ▸";font:600 11px var(--vi);color:var(--accent);margin-left:8px;vertical-align:middle;opacity:.75}
.vfilters{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg .lab{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-right:2px}
.seg button{font:500 13px var(--vi);padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.vlist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.vrow{display:grid;grid-template-columns:minmax(170px,220px) 1fr;gap:14px;padding:12px 14px;border-bottom:1px solid var(--line)}
.vrow:last-child{border-bottom:0}
.vinfo{display:flex;flex-direction:column;gap:3px;min-width:0}
.vtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vtop .k{font-size:19px;font-weight:700}
.vtop .vg{font:700 11px/1 var(--vi);padding:3px 7px;border-radius:999px}
.vr{font-size:13px;color:var(--muted)}
.vm{font-size:13.5px}
.vtags{display:flex;gap:4px;flex-wrap:wrap}
.vtags .lop{font:700 10.5px/1 var(--vi);color:var(--warn);background:var(--warnbg);padding:3px 6px;border-radius:4px;align-self:center}
.pill{display:inline-flex;align-items:center;font:600 11px/1 var(--vi);padding:4px 7px;border-radius:999px}
.pl{color:var(--muted);background:var(--soft)}
.note{display:block;font-size:12px;line-height:1.35;color:var(--warn);background:var(--warnbg);padding:3px 6px;border-radius:5px}
.vforms{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.fc{display:flex;flex-direction:column;gap:1px;padding:5px 8px;border-radius:6px;background:var(--bg);min-width:0}
.fc .fl{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc .fv{font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.fc.na .fv{color:var(--muted)}
.vhide .fc{cursor:pointer}
.vhide .fc .fv{color:transparent;background:repeating-linear-gradient(135deg,var(--soft) 0 6px,transparent 6px 12px);border-radius:3px;user-select:none}
.vhide .fc.show .fv{color:var(--ink);background:none}
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet[hidden]{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(10,14,20,.45)}
.sheet-panel{position:relative;width:min(760px,100%);max-height:calc(100% - 32px);overflow:auto;background:var(--surface);border-radius:12px;padding:8px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.sheet-panel .vrow{border:0}
.sheet-x{position:absolute;top:8px;right:8px;border:0;background:var(--soft);color:var(--ink);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:14px;z-index:1}
@media (max-width:640px){.vrow{grid-template-columns:1fr;gap:8px}.vforms{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}.sheet{align-items:flex-end;padding:0}.sheet-panel{border-radius:14px 14px 0 0;max-height:85%;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}}

.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.kc{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);cursor:pointer;font:inherit}
.kc:hover{border-color:var(--accent)}
.kch{font-size:38px;line-height:1.15;font-weight:500}
.khv{font:700 13px var(--vi);letter-spacing:.04em;color:var(--accent)}
.khv.big{font-size:20px}
.km{font-size:13px}
.krd{font-size:12px;color:var(--muted)}
.kbadges{display:flex;gap:4px;margin-top:2px}
.knew{font:700 10.5px/1 var(--vi);color:var(--ok);background:var(--okbg);padding:4px 6px;border-radius:999px}
.khide .kc:not(.show) .khv,.khide .kc:not(.show) .km,.khide .kc:not(.show) .krd{color:transparent;background:repeating-linear-gradient(135deg,var(--soft) 0 6px,transparent 6px 12px);border-radius:3px}
details.kmore summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14px;margin:6px 0}
details.kmore[open] summary{margin-bottom:10px}
.kdetail{display:flex;gap:18px;align-items:flex-start;padding:8px 6px;flex-wrap:wrap}
.kbig{font-size:88px;line-height:1;padding:6px 14px;background:var(--soft);border-radius:12px}
.kinfo{display:flex;flex-direction:column;gap:4px;min-width:200px;flex:1}
.kinfo dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:6px 0 0;font-size:14px}
.kinfo dt{color:var(--muted)}
.kinfo dd{margin:0}
.kexh{margin:12px 6px 6px;font-size:14px}
.kex{display:flex;flex-direction:column;padding:0 6px 6px}
.kexr{display:grid;grid-template-columns:minmax(90px,auto) minmax(90px,auto) 1fr auto;gap:10px;padding:6px 0;border-top:1px solid var(--line);align-items:baseline}
.kexr .kw{font-weight:700;font-size:16px}
.kexr .kr{color:var(--muted);font-size:13px}
.kexr .km2{font-size:13.5px}
.kexr .kl{font-size:12px;color:var(--muted);white-space:nowrap}
@media (max-width:640px){.kexr{grid-template-columns:1fr auto}.kexr .km2{grid-column:1/-1}.kgrid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}}

.sres{position:fixed;z-index:15;background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 44px rgba(10,14,20,.22);overflow:auto;overscroll-behavior:contain}
.sres-body{padding:12px 14px 16px;display:flex;flex-direction:column;gap:14px}
.sres .shead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;position:sticky;top:-12px;background:var(--bg);padding:12px 0 8px;margin-top:-12px;z-index:2;border-bottom:1px solid var(--line)}
.sres .shead b{font-size:17px;margin-right:8px}
.sres .shead span{font-size:13px;color:var(--muted)}
.sres-x{border:0;background:var(--soft);color:var(--ink);width:30px;height:30px;border-radius:50%;cursor:pointer;flex:none}
.sres section.block{gap:8px}
.sres .rrow{grid-template-columns:200px 140px minmax(0,1fr) 110px}
@media (max-width:640px){.sres .rrow{grid-template-columns:1fr auto}}
</style>

</head>
<body>
<div class="app" id="app">
<aside>
  <div class="brand">
    <h1>Sổ tay ôn tập <span class="jp">N4</span></h1>
    <p>Minna no Nihongo bài 26–50 · tra cứu cả từ vựng N5</p>
  </div>
  <div class="modes" role="tablist"><button class="mode" data-mode="lesson" aria-pressed="true">Bài học</button><button class="mode" data-mode="verbs" aria-pressed="false">Động từ</button><button class="mode" data-mode="kanji" aria-pressed="false">Kanji</button></div>

<script>
const L=[{"lesson":26,"title":"Giải thích lý do · Nhờ vả lịch sự · Xin lời khuyên","summary":"Dùng 〜んです để hỏi hoặc giải thích lý do, hoàn cảnh; mở lời nhờ vả lịch sự bằng 〜んですが、〜ていただけませんか và xin chỉ dẫn bằng 疑問詞 + Vたらいいですか.","grammar":[{"pattern":"普通形 + んです","meaning":"Hỏi / giải thích lý do, hoàn cảnh; nhấn mạnh sự quan tâm của người nói","form":"V・Aい thể thường + んです; Aな・N: bỏ だ, thêm な + んです (静かなんです, 学生なんです)","notes":"Dùng khi thấy điều gì đó và muốn biết thêm (どうしたんですか), hoặc khi giải thích lý do. Không lạm dụng cho câu thông báo đơn thuần, nghe sẽ nặng nề. Văn nói thân mật dùng 〜んだ / 〜の.","examples":[{"ja":"元気{げんき}がないですね。どうしたんですか。","vi":"Trông bạn không khỏe. Có chuyện gì vậy?"},{"ja":"どうして昨日{きのう}休{やす}んだんですか。…頭{あたま}が痛{いた}かったんです。","vi":"Sao hôm qua bạn nghỉ? … Vì tôi bị đau đầu."},{"ja":"すてきな靴{くつ}ですね。どこで買{か}ったんですか。","vi":"Đôi giày đẹp quá. Bạn mua ở đâu vậy?"}]},{"pattern":"〜んですが、〜ていただけませんか","meaning":"Nêu hoàn cảnh trước rồi nhờ vả một cách lịch sự","form":"普通形 + んですが、V て + いただけませんか","notes":"が ở đây là lời mở đầu, không mang nghĩa 'nhưng'. Phần sau có thể lược bỏ khi người nghe đã hiểu ý (ちょっと分からないんですが…). いただけませんか lịch sự hơn くださいませんか.","examples":[{"ja":"日本語{にほんご}でメールを書{か}いたんですが、ちょっと見{み}ていただけませんか。","vi":"Tôi đã viết email bằng tiếng Nhật, anh xem giúp tôi một chút được không ạ?"},{"ja":"駅{えき}への道{みち}が分{わ}からないんですが、地図{ちず}を書{か}いていただけませんか。","vi":"Tôi không biết đường ra ga, anh vẽ bản đồ giúp tôi được không ạ?"}]},{"pattern":"疑問詞 + V たら いいですか","meaning":"Xin lời khuyên, chỉ dẫn: nên làm (gì / ở đâu / thế nào...) thì được","form":"どこで / 何を / だれに / どうやって... + V thể た + ら + いいですか","notes":"Thường đi sau 〜んですが: 〜んですが、どうしたらいいですか. Câu trả lời hay dùng 〜たらいいですよ hoặc 〜てください.","examples":[{"ja":"どこでチケットを買{か}ったらいいですか。","vi":"Tôi nên mua vé ở đâu?"},{"ja":"パソコンが動{うご}かないんですが、だれに相談{そうだん}したらいいですか。","vi":"Máy tính không chạy, tôi nên hỏi ai?"},{"ja":"この漢字{かんじ}はどうやって覚{おぼ}えたらいいですか。","vi":"Chữ Hán này nên nhớ thế nào thì tốt?"}]},{"pattern":"N（tân ngữ）は 〜","meaning":"Đưa tân ngữ lên đầu câu làm chủ đề","form":"N を → N は (đặt đầu câu)","notes":"Khi tân ngữ là chủ đề câu chuyện, を được thay bằng は và đưa lên đầu. Không dùng を và は cùng lúc (×ゴミをは).","examples":[{"ja":"燃{も}えないゴミはどこに出{だ}したらいいですか。","vi":"Rác không cháy thì nên đổ ở đâu?"},{"ja":"この荷物{にもつ}は、どこに置{お}いたらいいですか。","vi":"Hành lý này nên để ở đâu ạ?"}]}],"vocab":[{"w":"見る","r":"みる","m":"xem, nhìn (kiểm tra)","t":"v","g":2,"cls":1,"mw":"見ます","mr":"みます","k":["coi","ngó","trông","xem xét","nhìn ngắm"]},{"w":"診る","r":"みる","m":"khám (bệnh)","t":"v","g":2,"mw":"診ます","mr":"みます","k":["khám bệnh","thăm khám","chẩn đoán","xem bệnh"]},{"w":"捜す・探す","r":"さがす","m":"tìm, tìm kiếm","t":"v","g":1,"cls":1,"mw":"捜します・探します","mr":"さがします","k":["kiếm","lục tìm","tìm tòi","truy tìm"]},{"w":"遅れる","r":"おくれる","m":"trễ, muộn (時間に～: trễ giờ)","t":"v","g":2,"cls":1,"mw":"遅れます","mr":"おくれます","k":["chậm","chậm trễ","đến muộn","lỡ giờ"]},{"w":"間に合う","r":"まにあう","m":"kịp (会議に～: kịp giờ họp)","t":"v","g":1,"cls":1,"mw":"間に合います","mr":"まにあいます","k":["đúng giờ","kịp lúc","đủ thời gian","còn kịp"]},{"w":"やる","r":"やる","m":"làm (cách nói thân mật của する) (宿題を～: làm bài tập)","t":"v","g":1,"cls":1,"mw":"やります","mr":"やります","k":["tiến hành","làm việc","thực hiện","chơi"]},{"w":"拾う","r":"ひろう","m":"nhặt (ごみを～: nhặt rác)","t":"v","g":1,"cls":1,"mw":"拾います","mr":"ひろいます","k":["lượm","nhặt lên","nhặt được"]},{"w":"連絡する","r":"れんらくする","m":"liên lạc","t":"v","g":3,"cls":1,"mw":"連絡します","mr":"れんらくします","k":["gọi điện","báo tin","liên hệ","thông báo"]},{"w":"気分がいい","r":"きぶんがいい","m":"thấy dễ chịu, khỏe khoắn","t":"e","k":["dễ chịu","sảng khoái","thoải mái","tâm trạng tốt"]},{"w":"気分が悪い","r":"きぶんがわるい","m":"thấy khó chịu, không khỏe","t":"e","k":["mệt","buồn nôn","người khó chịu","tâm trạng xấu"]},{"w":"運動会","r":"うんどうかい","m":"hội thi thể thao","t":"n","cls":1,"k":["đại hội thể thao","ngày hội thể thao","hội thao"]},{"w":"盆踊り","r":"ぼんおどり","m":"múa Bon (lễ hội mùa hè)","t":"n","k":["múa Obon","lễ hội Obon","múa lễ hội"]},{"w":"フリーマーケット","r":"フリーマーケット","m":"chợ đồ cũ","t":"n","cls":1,"k":["chợ trời","chợ đồ second hand","chợ đồ si"]},{"w":"場所","r":"ばしょ","m":"địa điểm","t":"n","cls":1,"k":["chỗ","nơi","vị trí","nơi chốn"]},{"w":"ボランティア","r":"ボランティア","m":"tình nguyện viên, hoạt động tình nguyện","t":"n","cls":1,"k":["tình nguyện","thiện nguyện","công tác xã hội","người tình nguyện","làm từ thiện"]},{"w":"財布","r":"さいふ","m":"ví","t":"n","cls":1,"k":["bóp","ví tiền","bóp tiền"]},{"w":"ごみ","r":"ごみ","m":"rác","t":"n","cls":1,"k":["rác thải","đồ bỏ đi","chất thải"]},{"w":"国会議事堂","r":"こっかいぎじどう","m":"tòa nhà Quốc hội","t":"n","k":["Quốc hội","nghị viện","tòa nhà nghị viện","nhà Quốc hội","trụ sở Quốc hội","nghị viện Nhật"]},{"w":"平日","r":"へいじつ","m":"ngày thường (trong tuần)","t":"n","cls":1,"k":["ngày làm việc","ngày trong tuần","thứ hai đến thứ sáu"]},{"w":"～弁","r":"～べん","m":"tiếng địa phương ～ (大阪弁: giọng Osaka)","t":"x","cls":1,"k":["giọng địa phương","phương ngữ","thổ ngữ"]},{"w":"今度","r":"こんど","m":"lần tới; lần này","t":"n","cls":1,"k":["lần sau","lần tới đây","dịp tới","kỳ này"]},{"w":"ずいぶん","r":"ずいぶん","m":"khá là, tương đối","t":"x","cls":1,"k":["khá","rất","lắm","quá"]},{"w":"直接","r":"ちょくせつ","m":"trực tiếp","t":"x","cls":1,"k":["thẳng","trực diện","tận tay"]},{"w":"いつでも","r":"いつでも","m":"bất cứ lúc nào","t":"x","cls":1,"k":["lúc nào cũng được","khi nào cũng được","mọi lúc"]},{"w":"どこでも","r":"どこでも","m":"bất cứ đâu","t":"x","cls":1,"k":["đâu cũng được","ở đâu cũng được","mọi nơi"]},{"w":"だれでも","r":"だれでも","m":"bất cứ ai","t":"x","cls":1,"k":["ai cũng được","mọi người","bất kỳ ai"]},{"w":"なんでも","r":"なんでも","m":"bất cứ cái gì","t":"x","cls":1,"k":["gì cũng được","cái gì cũng","mọi thứ"]},{"w":"こんな～","r":"こんな～","m":"～ như thế này","t":"x","cls":1,"k":["như vầy","thế này","như này","kiểu này"]},{"w":"そんな～","r":"そんな～","m":"～ như thế đó","t":"x","cls":1,"k":["như vậy","thế đó","như thế","kiểu đó","như vậy đó"]},{"w":"あんな～","r":"あんな～","m":"～ như thế kia","t":"x","cls":1,"k":["như vậy kia","thế kia","như kia","kiểu kia"]},{"w":"片付く","r":"かたづく","m":"(đồ đạc) được dọn gọn (tự)","t":"v","g":1,"mw":"片付きます","mr":"かたづきます","k":["gọn gàng","ngăn nắp","xong xuôi","dọn xong"]},{"w":"出す","r":"だす","m":"đổ, bỏ ra (ごみを～: đổ rác)","t":"v","g":1,"mw":"出します","mr":"だします","k":["vứt","lấy ra","đưa ra"]},{"w":"燃えるごみ","r":"もえるごみ","m":"rác cháy được","t":"n","k":["rác đốt được","rác dễ cháy","rác hữu cơ"]},{"w":"置き場","r":"おきば","m":"chỗ để","t":"n","k":["nơi để","chỗ đặt","bãi để","kho"]},{"w":"横","r":"よこ","m":"bên cạnh","t":"n","cls":1,"k":["cạnh","bên","ngang","chiều ngang","kế bên","sát bên"]},{"w":"瓶","r":"びん","m":"chai, lọ (thủy tinh)","t":"n","k":["chai thủy tinh","bình","chai lọ","cái chai"]},{"w":"缶","r":"かん","m":"lon, hộp kim loại","t":"n","k":["hộp thiếc","lon nước","đồ hộp"]},{"w":"ガス","r":"ガス","m":"ga, khí đốt","t":"n","k":["khí ga","gas","bình ga"]},{"w":"～会社","r":"～がいしゃ","m":"công ty ～","t":"x","k":["hãng","doanh nghiệp","công ti"]},{"w":"宇宙","r":"うちゅう","m":"vũ trụ","t":"n","k":["không gian","ngoài vũ trụ","vũ trụ bao la"]},{"w":"～様","r":"～さま","m":"ngài ～, quý ～ (kính ngữ của ～さん)","t":"x","k":["quý khách","quý ông","kính gửi"]},{"w":"宇宙船","r":"うちゅうせん","m":"tàu vũ trụ","t":"n","k":["phi thuyền","tàu không gian","phi thuyền vũ trụ"]},{"w":"怖い","r":"こわい","m":"sợ, đáng sợ","t":"a","k":["sợ hãi","kinh khủng","ghê"]},{"w":"違う","r":"ちがう","m":"khác, sai","t":"v","g":1,"mw":"違います","mr":"ちがいます","k":["khác nhau","không đúng","nhầm","không phải"]},{"w":"宇宙飛行士","r":"うちゅうひこうし","m":"nhà du hành vũ trụ","t":"n","k":["phi hành gia","du hành gia","phi công vũ trụ"]},{"w":"燃える","r":"もえる","m":"cháy (tự)","t":"v","cls":1,"add":1,"g":2,"mw":"燃えます","mr":"もえます","k":["bốc cháy","bị cháy","cháy rực"]},{"w":"気分","r":"きぶん","m":"tâm trạng, cảm giác (trong người)","t":"n","cls":1,"add":1,"k":["tinh thần","cảm xúc","tâm tình"]},{"w":"売り場","r":"うりば","m":"quầy bán hàng","t":"n","cls":1,"add":1,"k":["quầy hàng","gian hàng","khu bán hàng"]}],"compare":[{"title":"〜んです vs 〜です / 〜ます","points":[{"label":"〜んです","text":"Có sắc thái giải thích hoặc muốn biết lý do, hoàn cảnh đằng sau. Ví dụ: どうして遅れたんですか (Sao lại đến muộn thế?)."},{"label":"〜です / 〜ます","text":"Chỉ nêu hoặc hỏi sự thật một cách trung tính. Ví dụ: 何時に来ましたか (Bạn đến lúc mấy giờ?)."}],"tip":"Có 'vì sao / sao vậy' ẩn trong câu thì nghĩ đến 〜んです."}],"quiz":[{"q":"A：どうしたんですか。B：財布{さいふ}を＿＿んです。","options":["なくします","なくして","なくした","なくしました"],"answer":2,"explain":"Trước んです dùng thể thường: なくした + んです. なくしました là thể lịch sự nên không gắn trực tiếp với んです."},{"q":"漢字{かんじ}の読{よ}み方{かた}が分{わ}からない＿＿、教{おし}えていただけませんか。","options":["のに","んですが","でも","ても"],"answer":1,"explain":"〜んですが dùng để nêu hoàn cảnh trước khi nhờ vả. のに mang ý trách móc, trái ý muốn, không hợp với lời nhờ."},{"q":"駅{えき}までどうやって＿＿いいですか。","options":["いって","いきます","いったら","いこう"],"answer":2,"explain":"Mẫu xin chỉ dẫn là 疑問詞 + Vたら + いいですか → いったらいいですか. Các dạng khác không nối được với いいですか."},{"q":"このアパートは駅{えき}から遠{とお}いですが、とても静{しず}か＿＿んです。","options":["だ","な","の","に"],"answer":1,"explain":"Tính từ な (và danh từ) đổi だ thành な trước んです: 静かなんです. ×静かだんです là sai."},{"q":"A：どうして何{なに}も食{た}べない＿＿か。B：おなかが痛{いた}いんです。","options":["なんです","だんです","のだ","んです"],"answer":3,"explain":"Động từ thể thường + んですか: 食べないんですか. なんです chỉ dùng sau Aな / N; だんです luôn sai."}]},{"lesson":27,"title":"Khả năng · Nhìn thấy, nghe thấy · Chỉ có","summary":"Học động từ khả năng (có thể làm gì), phân biệt 見えます・聞こえます với 見られます・聞けます, できます nghĩa 'được xây xong / làm xong' và 〜しか〜ない (chỉ có).","grammar":[{"pattern":"可能動詞（V có thể）","meaning":"Có thể / không thể làm gì (năng lực hoặc điều kiện cho phép)","form":"Nhóm I: đuôi う → hàng え + る (書く→書ける, 泳ぐ→泳げる); Nhóm II: る → られる (食べる→食べられる); Nhóm III: する→できる, 来る→来られる","notes":"Động từ khả năng chia như động từ nhóm II. Tân ngữ thường đổi を thành が (漢字を読む → 漢字が読める). Các trợ từ khác (に, へ, で...) giữ nguyên.","examples":[{"ja":"わたしは漢字{かんじ}が少{すこ}し読{よ}めます。","vi":"Tôi đọc được một ít chữ Hán."},{"ja":"明日{あした}は八時{はちじ}に来{こ}られますか。","vi":"Ngày mai 8 giờ bạn đến được không?"},{"ja":"弟{おとうと}はまだ泳{およ}げません。","vi":"Em trai tôi vẫn chưa biết bơi."}]},{"pattern":"見えます・聞こえます","meaning":"Nhìn thấy / nghe thấy một cách tự nhiên (không cần cố ý)","form":"N が 見えます / N が 聞こえます","notes":"Hình ảnh, âm thanh tự lọt vào mắt, tai. Khác với 見られます・聞けます là 'có điều kiện, có cơ hội để xem/nghe' do chủ thể chủ động.","examples":[{"ja":"わたしの部屋{へや}から海{うみ}が見{み}えます。","vi":"Từ phòng tôi có thể nhìn thấy biển."},{"ja":"隣{となり}の部屋{へや}からピアノの音{おと}が聞{き}こえます。","vi":"Nghe thấy tiếng piano từ phòng bên cạnh."},{"ja":"このアプリで昔{むかし}の映画{えいが}が無料{むりょう}で見{み}られます。","vi":"Với ứng dụng này có thể xem phim cũ miễn phí."}]},{"pattern":"N が できます","meaning":"(Công trình) được xây xong, mở ra; (đồ vật) làm xong","form":"N が できます / できました","notes":"できます ngoài nghĩa 'có thể' còn nghĩa 'hình thành, hoàn thành'. Chủ thể đi với が, không dùng を.","examples":[{"ja":"駅{えき}の前{まえ}に新{あたら}しいスーパーができました。","vi":"Trước ga mới có một siêu thị mới."},{"ja":"すみません、コピーは何時{なんじ}にできますか。","vi":"Xin lỗi, bản photo mấy giờ thì xong ạ?"}]},{"pattern":"N しか 〜ない","meaning":"Chỉ có... (nhấn mạnh sự ít ỏi, không đủ)","form":"N（+ trợ từ）+ しか + V phủ định","notes":"Động từ luôn ở thể phủ định. しか thay cho が, を; các trợ từ khác giữ lại (東京にしか...). Khác với だけ ở sắc thái 'tiếc là ít'.","examples":[{"ja":"財布{さいふ}に千円{せんえん}しかありません。","vi":"Trong ví chỉ còn có 1000 yên."},{"ja":"今朝{けさ}はコーヒーしか飲{の}みませんでした。","vi":"Sáng nay tôi chỉ uống mỗi cà phê."}]},{"pattern":"N は（đối chiếu）/ N も + V khả năng","meaning":"So sánh cái làm được và không làm được; liệt kê cái cùng làm được","form":"N1 は 〜ますが、N2 は 〜ません / N1 も N2 も 〜ます","notes":"は thay cho が khi muốn đối chiếu hai đối tượng. も thay cho が khi nói 'cũng'.","examples":[{"ja":"ひらがなは書{か}けますが、漢字{かんじ}は書{か}けません。","vi":"Hiragana thì viết được, nhưng chữ Hán thì không."},{"ja":"姉{あね}は英語{えいご}も中国語{ちゅうごくご}も話{はな}せます。","vi":"Chị tôi nói được cả tiếng Anh lẫn tiếng Trung."}]}],"vocab":[{"w":"飼う","r":"かう","m":"nuôi (động vật)","t":"v","g":1,"cls":1,"mw":"飼います","mr":"かいます","k":["nuôi thú","chăn nuôi","nuôi chó mèo"]},{"w":"建てる","r":"たてる","m":"xây (nhà)","t":"v","g":2,"cls":1,"mw":"建てます","mr":"たてます","k":["xây dựng","dựng","xây nhà"]},{"w":"走る","r":"はしる","m":"chạy (trên đường)","t":"v","g":1,"trap":1,"cls":1,"mw":"走ります","mr":"はしります","k":["chạy bộ","chạy nhanh","chạy xe"]},{"w":"取る","r":"とる","m":"lấy (休みを～: xin nghỉ)","t":"v","g":1,"mw":"取ります","mr":"とります","k":["cầm","nhận","đoạt"]},{"w":"見える","r":"みえる","m":"nhìn thấy được, (núi) hiện ra","t":"v","g":2,"cls":1,"mw":"見えます","mr":"みえます","k":["thấy","trông thấy","có thể thấy","thấy rõ"]},{"w":"聞こえる","r":"きこえる","m":"nghe thấy được","t":"v","g":2,"cls":1,"mw":"聞こえます","mr":"きこえます","k":["nghe được","có thể nghe","nghe rõ"]},{"w":"できる","r":"できる","m":"có thể; được xây xong, hoàn thành","t":"v","g":2,"cls":1,"mw":"できます","mr":"できます","k":["được","làm được","biết","xây xong","xong","được làm"]},{"w":"開く","r":"ひらく","m":"mở (教室を～: mở lớp học)","t":"v","g":1,"cls":1,"mw":"開きます","mr":"ひらきます","k":["mở lớp","tổ chức","khai trương","mở ra"]},{"w":"ペット","r":"ペット","m":"thú cưng","t":"n","cls":1,"k":["vật nuôi","thú nuôi","con vật nuôi"]},{"w":"鳥","r":"とり","m":"chim","t":"n","cls":1,"k":["con chim","chim chóc","loài chim"]},{"w":"声","r":"こえ","m":"giọng, tiếng (người, chim)","t":"n","cls":1,"k":["tiếng nói","giọng nói","tiếng kêu","tiếng hót"]},{"w":"波","r":"なみ","m":"sóng","t":"n","cls":1,"k":["con sóng","sóng biển","làn sóng"]},{"w":"花火","r":"はなび","m":"pháo hoa","t":"n","cls":1,"k":["bắn pháo hoa","pháo bông","pháo","lễ hội pháo hoa"]},{"w":"景色","r":"けしき","m":"phong cảnh","t":"n","k":["cảnh","cảnh vật","cảnh đẹp","quang cảnh"]},{"w":"昼間","r":"ひるま","m":"ban ngày","t":"n","k":["buổi trưa","ban trưa","giữa ngày"]},{"w":"昔","r":"むかし","m":"ngày xưa","t":"n","k":["xưa","ngày trước","hồi xưa","thời xưa"]},{"w":"道具","r":"どうぐ","m":"dụng cụ","t":"n","cls":1,"k":["đồ dùng","công cụ","vật dụng"]},{"w":"自動販売機","r":"じどうはんばいき","m":"máy bán hàng tự động","t":"n","k":["máy bán nước","máy bán đồ","máy tự động"]},{"w":"通信販売","r":"つうしんはんばい","m":"mua bán qua mạng / bưu điện","t":"n","k":["mua hàng online","bán hàng qua bưu điện","mua sắm trực tuyến"]},{"w":"クリーニング","r":"クリーニング","m":"giặt khô, tiệm giặt là","t":"n","cls":1,"k":["giặt ủi","tiệm giặt","giặt sấy","giặt hấp"]},{"w":"マンション","r":"マンション","m":"chung cư cao cấp","t":"n","cls":1,"k":["căn hộ","chung cư","nhà chung cư","căn hộ cao cấp"]},{"w":"台所","r":"だいどころ","m":"nhà bếp","t":"n","k":["bếp","phòng bếp","gian bếp","bếp núc"]},{"w":"～後","r":"～ご","m":"sau ～ (một thời gian)","t":"x","k":["sau khi","sau đó","kể từ"]},{"w":"～しか","r":"～しか","m":"chỉ (đi với thể phủ định)","t":"x","k":["chỉ có","không quá","chỉ mỗi"]},{"w":"～教室","r":"～きょうしつ","m":"lớp học ～ (料理教室)","t":"x","k":["lớp","lớp dạy","trung tâm","khóa học"]},{"w":"パーティールーム","r":"パーティールーム","m":"phòng tiệc","t":"n","k":["phòng tổ chức tiệc","sảnh tiệc","phòng party"]},{"w":"関西空港","r":"かんさいくうこう","m":"sân bay Kansai (ở Osaka)","t":"n","k":["sân bay Osaka","sân bay KIX"]},{"w":"秋葉原","r":"あきはばら","m":"Akihabara (khu điện tử ở Tokyo)","t":"n","k":["khu điện tử","Akiba","phố điện tử","khu otaku"]},{"w":"伊豆","r":"いず","m":"Izu (bán đảo ở tỉnh Shizuoka)","t":"n","k":["bán đảo Izu","Izu Shizuoka"]},{"w":"日曜大工","r":"にちようだいく","m":"tự làm đồ mộc (vào ngày nghỉ)","t":"n","k":["làm mộc","tự làm đồ","đồ thủ công","DIY"]},{"w":"本棚","r":"ほんだな","m":"giá sách","t":"n","k":["kệ sách","tủ sách","giá để sách"]},{"w":"いつか","r":"いつか","m":"một lúc nào đó","t":"x","cls":1,"k":["một ngày nào đó","lúc nào đó","có ngày","mai này"]},{"w":"夢","r":"ゆめ","m":"giấc mơ, ước mơ","t":"n","k":["mơ","mộng","mơ ước","nằm mơ"]},{"w":"家","r":"いえ","m":"nhà, ngôi nhà","t":"n","k":["căn nhà","nhà cửa","gia đình","nhà ở"]},{"w":"すばらしい","r":"すばらしい","m":"tuyệt vời","t":"a","cls":1,"k":["tuyệt","tuyệt diệu","xuất sắc","tuyệt hảo"]},{"w":"子どもたち","r":"こどもたち","m":"bọn trẻ, các em nhỏ","t":"n","k":["trẻ em","lũ trẻ","các cháu","trẻ con"]},{"w":"大好き","r":"だいすき","m":"rất thích","t":"a","k":["thích lắm","rất yêu","mê","cực thích"]},{"w":"漫画","r":"まんが","m":"truyện tranh","t":"n","k":["manga","truyện","truyện tranh Nhật","comic"]},{"w":"主人公","r":"しゅじんこう","m":"nhân vật chính","t":"n","k":["vai chính","nhân vật","nhân vật trung tâm","main"]},{"w":"形","r":"かたち","m":"hình dạng","t":"n","k":["hình","hình dáng","dáng","hình thù"]},{"w":"ロボット","r":"ロボット","m":"người máy, rô-bốt","t":"n","k":["robot","máy móc","người máy tự động"]},{"w":"不思議","r":"ふしぎ","m":"kỳ lạ, thần kỳ","t":"a","k":["lạ","bí ẩn","kỳ diệu","khó hiểu"]},{"w":"ポケット","r":"ポケット","m":"túi (áo, quần)","t":"n","k":["túi quần","túi áo","cái túi"]},{"w":"例えば","r":"たとえば","m":"ví dụ","t":"x","k":["chẳng hạn","thí dụ","ví như"]},{"w":"付ける","r":"つける","m":"gắn, đính vào","t":"v","g":2,"mw":"付けます","mr":"つけます","k":["đính","dán","lắp","đeo","gắn thêm"]},{"w":"自由に","r":"じゆうに","m":"một cách tự do","t":"x","k":["tự do","thoải mái","tùy thích","tùy ý"]},{"w":"空","r":"そら","m":"bầu trời","t":"n","k":["trời","không trung","trời xanh"]},{"w":"飛ぶ","r":"とぶ","m":"bay","t":"v","g":1,"mw":"飛びます","mr":"とびます","k":["bay lượn","bay lên","bay đi"]},{"w":"自分","r":"じぶん","m":"bản thân, tự mình","t":"n","k":["mình","chính mình","tự bản thân","tôi"]},{"w":"将来","r":"しょうらい","m":"tương lai","t":"n","k":["sau này","mai sau","tương lai sau này"]},{"w":"ドラえもん","r":"ドラえもん","m":"Doraemon (nhân vật truyện tranh)","t":"n","k":["Đô-rê-mon","Doremon","mèo máy"]},{"w":"家具","r":"かぐ","m":"đồ nội thất","t":"n","cls":1,"add":1,"k":["nội thất","bàn ghế","đồ gỗ","giường tủ"]},{"w":"キッチン","r":"キッチン","m":"nhà bếp","t":"n","cls":1,"add":1,"k":["bếp","phòng bếp","gian bếp","bếp núc"]},{"w":"心配","r":"しんぱい","m":"lo lắng","t":"a","cls":1,"add":1,"k":["lo","bận tâm","lo âu","băn khoăn"]},{"w":"～しか～ない","r":"～しか～ない","m":"chỉ ~ (đi với phủ định)","t":"x","cls":1,"add":1,"k":["chỉ có","ngoài ra không","chỉ mỗi"]},{"w":"他の","r":"ほかの","m":"khác (cái khác)","t":"x","cls":1,"add":1,"k":["người khác","cái kia","khác nữa"]},{"w":"はっきり","r":"はっきり","m":"rõ ràng","t":"x","cls":1,"add":1,"k":["rõ","dứt khoát","minh bạch","rõ rệt"]}],"compare":[{"title":"見えます vs 見られます","points":[{"label":"見えます","text":"Tự nhiên lọt vào tầm mắt, không phụ thuộc ý muốn. Chủ ngữ là cảnh vật. Ví dụ: 窓から山が見えます (Từ cửa sổ thấy núi)."},{"label":"見られます","text":"Người xem có điều kiện, cơ hội để xem nếu muốn. Ví dụ: 駅の前の映画館で新しい映画が見られます (Ở rạp trước ga có thể xem phim mới)."}],"tip":"Mở mắt là thấy → 見えます; muốn xem và có chỗ/cách để xem → 見られます. 聞こえます / 聞けます cũng vậy."}],"quiz":[{"q":"わたしは日本語{にほんご}の新聞{しんぶん}が少{すこ}し＿＿。","options":["よめます","よまれます","よみます","よめれます"],"answer":0,"explain":"読む (nhóm I) → 読める. Trợ từ が đi với động từ khả năng; よみます cần を nên không hợp với が."},{"q":"隣{となり}の部屋{へや}から子{こ}どもの声{こえ}が＿＿。","options":["きけます","ききます","きこえます","きかれます"],"answer":2,"explain":"Âm thanh tự lọt vào tai → 聞こえます. 聞けます là 'có điều kiện để nghe' do chủ động, không hợp ở đây."},{"q":"来週{らいしゅう}の会議{かいぎ}に＿＿か。","options":["きられます","こられます","くられます","きれます"],"answer":1,"explain":"来る (nhóm III) → 来られる (こられる). Các dạng còn lại không tồn tại."},{"q":"冷蔵庫{れいぞうこ}には卵{たまご}が二{ふた}つ＿＿ありません。","options":["しか","だけ","まで","ばかり"],"answer":0,"explain":"Động từ phủ định ありません → dùng しか (chỉ có). だけ đi với khẳng định (二つだけあります); まで, ばかり không hợp với nghĩa 'chỉ có'."},{"q":"駅{えき}の近{ちか}くに大{おお}きい病院{びょういん}が＿＿。","options":["つくりました","できられました","できりました","できました"],"answer":3,"explain":"N が できました: (công trình) được xây xong. つくりました là ngoại động từ, cần を và chủ thể người làm."}]},{"lesson":28,"title":"Vừa... vừa · Thói quen · Liệt kê lý do","summary":"Học cách nói làm hai việc cùng lúc (〜ながら), diễn tả thói quen lặp lại (〜ています) và liệt kê nhiều lý do (〜し、〜し), cùng các từ nối それに・それで.","grammar":[{"pattern":"V1ます ながら V2","meaning":"Vừa làm V1 vừa làm V2 (cùng một chủ thể)","form":"V thể ます bỏ ます + ながら + V2","notes":"Hành động chính là V2, V1 là hành động phụ đi kèm. Cũng dùng cho hai việc diễn ra song song trong một thời gian dài (働きながら勉強する).","examples":[{"ja":"音楽{おんがく}を聞{き}きながら勉強{べんきょう}します。","vi":"Tôi vừa nghe nhạc vừa học."},{"ja":"兄{あに}は働{はたら}きながら大学{だいがく}に通{かよ}っています。","vi":"Anh tôi vừa đi làm vừa học đại học."}]},{"pattern":"V ています（thói quen）","meaning":"Diễn tả hành động lặp đi lặp lại như thói quen, nghề nghiệp","form":"V て + います; quá khứ: V て + いました","notes":"Hay đi với 毎朝, いつも, 週に二回... Dạng いました dùng cho thói quen trong quá khứ.","examples":[{"ja":"毎朝{まいあさ}公園{こうえん}を走{はし}っています。","vi":"Sáng nào tôi cũng chạy bộ ở công viên."},{"ja":"週末{しゅうまつ}はいつも図書館{としょかん}で勉強{べんきょう}しています。","vi":"Cuối tuần lúc nào tôi cũng học ở thư viện."},{"ja":"学生{がくせい}のとき、自転車{じてんしゃ}で学校{がっこう}に通{かよ}っていました。","vi":"Hồi còn đi học, tôi đi xe đạp đến trường."}]},{"pattern":"普通形 し、普通形 し、〜","meaning":"Liệt kê nhiều lý do / đặc điểm (không những... mà còn...)","form":"V・Aい thể thường + し; Aな・N + だ + し","notes":"Ngụ ý còn lý do khác nữa. Thường kết hợp với も (雨も降っているし). Có thể nêu một lý do với し để nói nhẹ nhàng. Câu lịch sự có thể dùng thể ます trước し.","examples":[{"ja":"この店{みせ}は安{やす}いし、おいしいし、よく来{き}ます。","vi":"Quán này vừa rẻ vừa ngon nên tôi hay đến."},{"ja":"雨{あめ}も降{ふ}っているし、もう遅{おそ}いし、タクシーで帰{かえ}りましょう。","vi":"Trời mưa, lại muộn rồi, mình về bằng taxi đi."},{"ja":"彼女{かのじょ}は親切{しんせつ}だし、頭{あたま}もいいし、みんなに人気{にんき}があります。","vi":"Cô ấy tốt bụng, lại thông minh nên được mọi người yêu mến."}]},{"pattern":"それに","meaning":"Hơn nữa, thêm vào đó (bổ sung thông tin cùng chiều)","form":"Câu 1。それに、Câu 2。","notes":"Thêm một ý cùng hướng (thường cùng tốt hoặc cùng xấu). Hay dùng trong hội thoại.","examples":[{"ja":"この部屋{へや}は明{あか}るいです。それに、駅{えき}から近{ちか}いです。","vi":"Căn phòng này sáng sủa. Hơn nữa lại gần ga."},{"ja":"今日{きょう}は疲{つか}れました。それに、少{すこ}し熱{ねつ}もあります。","vi":"Hôm nay tôi mệt. Thêm nữa còn hơi sốt."}]},{"pattern":"それで","meaning":"Vì vậy, do đó (kết quả của câu trước)","form":"Câu 1（lý do）。それで、Câu 2（kết quả）。","notes":"Câu sau là kết quả tự nhiên, sự thật đã xảy ra. Không dùng để mời, ra lệnh, nhờ vả ở câu sau. Cũng dùng để giục người nói tiếp: それで？","examples":[{"ja":"昨日{きのう}は熱{ねつ}がありました。それで、会社{かいしゃ}を休{やす}みました。","vi":"Hôm qua tôi bị sốt. Vì vậy tôi đã nghỉ làm."},{"ja":"この町{まち}は景色{けしき}がきれいです。それで、観光客{かんこうきゃく}が多{おお}いんです。","vi":"Thị trấn này cảnh đẹp. Vì thế có nhiều khách du lịch."}]}],"vocab":[{"w":"売れる","r":"うれる","m":"bán chạy, (hàng) được bán","t":"v","g":2,"cls":1,"mw":"売れます","mr":"うれます","k":["bán được","đắt hàng","bán đắt"]},{"w":"踊る","r":"おどる","m":"nhảy, múa","t":"v","g":1,"cls":1,"mw":"踊ります","mr":"おどります","k":["nhảy múa","khiêu vũ","nhảy đầm"]},{"w":"かむ","r":"かむ","m":"nhai, cắn","t":"v","g":1,"cls":1,"mw":"かみます","mr":"かみます","k":["gặm","cắn xé","ngậm nhai"]},{"w":"選ぶ","r":"えらぶ","m":"chọn","t":"v","g":1,"cls":1,"mw":"選びます","mr":"えらびます","k":["lựa chọn","lựa","tuyển chọn"]},{"w":"通う","r":"かよう","m":"đi lại (đều đặn), đi học","t":"v","g":1,"cls":1,"mw":"通います","mr":"かよいます","k":["đi làm","đi đi về về","lui tới"]},{"w":"メモする","r":"メモする","m":"ghi chép","t":"v","g":3,"cls":1,"mw":"メモします","mr":"メモします","k":["ghi lại","ghi chú","ghi nhớ"]},{"w":"まじめ","r":"まじめ","m":"nghiêm túc, chăm chỉ","t":"a","cls":1,"k":["nghiêm chỉnh","đứng đắn","cần cù"]},{"w":"熱心","r":"ねっしん","m":"nhiệt tình, hăng say","t":"a","cls":1,"k":["hăng hái","tận tâm","say mê","chăm chỉ"]},{"w":"偉い","r":"えらい","m":"giỏi, đáng nể; có địa vị","t":"a","cls":1,"k":["giỏi giang","tài giỏi","đáng khâm phục","vĩ đại"]},{"w":"ちょうどいい","r":"ちょうどいい","m":"vừa đúng, vừa vặn","t":"a","cls":1,"k":["vừa phải","vừa khéo","vừa đủ"]},{"w":"優しい","r":"やさしい","m":"hiền, dịu dàng","t":"a","k":["tốt bụng","hiền lành","tử tế"]},{"w":"習慣","r":"しゅうかん","m":"thói quen, tập quán","t":"n","k":["phong tục","tập tục","nếp sống"]},{"w":"経験","r":"けいけん","m":"kinh nghiệm","t":"n","cls":1,"k":["trải nghiệm","từng trải","kinh qua"]},{"w":"力","r":"ちから","m":"sức lực, năng lực","t":"n","cls":1,"k":["sức","sức mạnh","khả năng","sức khỏe"]},{"w":"人気","r":"にんき","m":"sự được ưa chuộng","t":"n","cls":1,"k":["nổi tiếng","được yêu thích","hot","phổ biến"]},{"w":"形","r":"かたち","m":"hình dạng","t":"n","cls":1,"k":["hình","hình dáng","dáng","hình thù"]},{"w":"色","r":"いろ","m":"màu sắc","t":"n","cls":1,"k":["màu","sắc màu","gam màu"]},{"w":"味","r":"あじ","m":"vị","t":"n","cls":1,"k":["hương vị","mùi vị","vị giác"]},{ ","text":"Thêm ý cùng chiều: 'hơn nữa'. Ví dụ: 広いです。それに、安いです."},{"label":"それで","text":"Nêu kết quả: 'vì vậy'. Ví dụ: 寝坊しました。それで、遅れました."}],"tip":"それに = cộng thêm (+); それで = dẫn tới (→)."}],"quiz":[{"q":"テレビを＿＿ご飯{はん}を食{た}べます。","options":["みるながら","みてながら","みながら","みたながら"],"answer":2,"explain":"ながら gắn vào thể ます bỏ ます: 見ます → 見ながら. Không gắn vào thể từ điển hay thể て."},{"q":"この町{まち}は静{しず}か＿＿、緑{みどり}も多{おお}いし、住{す}みやすいです。","options":["だし","なし","し","でし"],"answer":0,"explain":"Tính từ な + だ + し: 静かだし. Không dùng な trước し, cũng không gắn し trực tiếp vào gốc tính từ."},{"q":"道{みち}が込{こ}んでいました。＿＿、約束{やくそく}の時間{じかん}に遅{おく}れました。","options":["それに","ところで","でも","それで"],"answer":3,"explain":"Câu sau là kết quả của câu trước (kẹt xe → đến muộn) nên dùng それで. それに chỉ thêm ý cùng chiều, không nêu kết quả."},{"q":"わたしは毎晩{まいばん}寝{ね}る前{まえ}に日記{にっき}を＿＿。","options":["つけています","つけてあります","つけながら","つけたり"],"answer":0,"explain":"毎晩 chỉ thói quen lặp lại → Vています. てあります chỉ trạng thái do ai đó làm; ながら cần động từ chính phía sau; たり phải đi thành cặp 〜たり〜たりします."},{"q":"このレストランは料理{りょうり}がおいしいです。＿＿、値段{ねだん}も安{やす}いです。","options":["それで","それに","だから","でも"],"answer":1,"explain":"Thêm một điểm tốt nữa (ngon + rẻ) → それに. それで / だから nêu kết quả, nhưng 'rẻ' không phải kết quả của 'ngon'."}]},{"lesson":29,"title":"Trạng thái · Lỡ làm, làm xong · Tự động từ và tha động từ","summary":"Diễn tả trạng thái hiện tại của đồ vật bằng tự động từ + ています, nói việc đã làm xong hoặc lỡ làm (đáng tiếc) bằng 〜てしまいました, và phân biệt các cặp tự động từ / tha động từ.","grammar":[{"pattern":"自動詞 + ています（trạng thái）","meaning":"Diễn tả trạng thái kết quả đang còn lại trước mắt","form":"N が + tự động từ thể て + います","notes":"Người nói chỉ mô tả cái mình thấy, không quan tâm ai làm. Thường dùng が; khi làm chủ đề thì dùng は. Hay gặp với 開く, 閉まる, 付く, 消える, 壊れる, 割れる, 汚れる...","examples":[{"ja":"あれ、窓{まど}が開{あ}いていますね。","vi":"Ơ, cửa sổ đang mở kìa."},{"ja":"この時計{とけい}は壊{こわ}れていますよ。","vi":"Cái đồng hồ này hỏng rồi đấy."},{"ja":"会議室{かいぎしつ}の電気{でんき}が消{き}えています。","vi":"Đèn phòng họp đang tắt."}]},{"pattern":"V てしまいました","meaning":"(1) Đã làm xong hoàn toàn; (2) lỡ làm, đáng tiếc, hối hận","form":"V て + しまいました; văn nói: 〜ちゃった / 〜じゃった","notes":"Nghĩa (1) hay đi với もう, 全部. Nghĩa (2) thể hiện cảm xúc tiếc nuối, bối rối của người nói trước sự việc ngoài ý muốn.","examples":[{"ja":"宿題{しゅくだい}はもう全部{ぜんぶ}やってしまいました。","vi":"Bài tập thì tôi đã làm xong hết rồi."},{"ja":"電車{でんしゃ}に傘{かさ}を忘{わす}れてしまいました。","vi":"Tôi lỡ để quên ô trên tàu mất rồi."},{"ja":"友達{ともだち}に借{か}りた本{ほん}を汚{よご}してしまいました。","vi":"Tôi lỡ làm bẩn cuốn sách mượn của bạn."}]},{"pattern":"V てしまいます","meaning":"Sẽ làm xong (hết) việc gì trong tương lai","form":"V て + しまいます / しまいましょう / しまってください","notes":"Nhấn mạnh làm cho xong hẳn, thường kèm mốc thời gian (〜までに, 今日中に).","examples":[{"ja":"この本{ほん}は今日中{きょうじゅう}に読{よ}んでしまいます。","vi":"Cuốn sách này tôi sẽ đọc xong trong hôm nay."},{"ja":"昼{ひる}までにレポートを書{か}いてしまいましょう。","vi":"Hãy viết xong báo cáo trước buổi trưa nhé."}]},{"pattern":"自動詞・他動詞（cặp tự động từ / tha động từ）","meaning":"Tự động từ: sự vật tự thay đổi (が); tha động từ: người tác động lên vật (を)","form":"N が 開く / 人 が N を 開ける; N が 閉まる / N を 閉める; N が 付く / N を 付ける; N が 消える / N を 消す; N が 割れる / N を 割る","notes":"Học theo cặp. Tự động từ không có tân ngữ を. Khi mô tả trạng thái, dùng tự động từ + ています.","examples":[{"ja":"風{かぜ}でドアが閉{し}まりました。","vi":"Cửa đóng lại vì gió."},{"ja":"あ、コップが割{わ}れていますね。…すみません、わたしが割{わ}ってしまいました。","vi":"A, cái cốc bị vỡ rồi. … Xin lỗi, tôi lỡ làm vỡ."}]}],"vocab":[{"w":"開く","r":"あく","m":"(cửa) mở (tự) (ドアが～)","t":"v","g":1,"cls":1,"mw":"開きます","mr":"あきます","k":["mở cửa","mở ra","được mở"]},{"w":"閉まる","r":"しまる","m":"(cửa) đóng (tự)","t":"v","g":1,"cls":1,"mw":"閉まります","mr":"しまります","k":["đóng cửa","đóng lại","bị đóng"]},{"w":"つく","r":"つく","m":"(đèn) sáng, bật (tự) (電気が～)","t":"v","g":1,"cls":1,"mw":"つきます","mr":"つきます","k":["đèn sáng","bật lên","được bật"]},{"w":"消える","r":"きえる","m":"(đèn) tắt (tự)","t":"v","g":2,"cls":1,"mw":"消えます","mr":"きえます","k":["biến mất","mất","đèn tắt"]},{"w":"込む","r":"こむ","m":"(đường, tàu) đông","t":"v","g":1,"mw":"込みます","mr":"こみます","k":["đông đúc","chật","kẹt xe","chen chúc"]},{"w":"すく","r":"すく","m":"(đường, tàu) vắng","t":"v","g":1,"mw":"すきます","mr":"すきます","k":["trống","thưa","thưa thớt"]},{"w":"壊れる","r":"こわれる","m":"(ghế, máy) hỏng","t":"v","g":2,"cls":1,"mw":"壊れます","mr":"こわれます","k":["hư","bị hỏng","hư hỏng"]},{"w":"割れる","r":"われる","m":"(cốc) vỡ","t":"v","g":2,"cls":1,"mw":"割れます","mr":"われます","k":["bể","nứt","bị vỡ"]},{"w":"折れる","r":"おれる","m":"(cành cây) gãy","t":"v","g":2,"cls":1,"mw":"折れます","mr":"おれます","k":["bị gãy","gãy gập","gãy đôi"]},{"w":"破れる","r":"やぶれる","m":"(giấy) rách","t":"v","g":2,"cls":1,"mw":"破れます","mr":"やぶれます","k":["bị rách","thủng","sờn rách"]},{"w":"汚れる","r":"よごれる","m":"(quần áo) bẩn","t":"v","g":2,"cls":1,"mw":"汚れます","mr":"よごれます","k":["dơ","lấm bẩn","bị bẩn"]},{"w":"付く","r":"つく","m":"được gắn, đính (ポケットが～: có túi)","t":"v","g":1,"mw":"付きます","mr":"つきます","k":["có","gắn","dính","có gắn","kèm theo"]},{"w":"外れる","r":"はずれる","m":"(cúc áo) tuột, bung ra","t":"v","g":2,"cls":1,"mw":"外れます","mr":"はずれます","k":["bung","rời ra","sút","bị tuột"]},{"w":"止まる","r":"とまる","m":"(xe) dừng, đỗ (tự)","t":"v","g":1,"cls":1,"mw":"止まります","mr":"とまります","k":["ngừng","đứng lại","dừng lại"]},{"w":"間違える","r":"まちがえる","m":"nhầm, sai","t":"v","g":2,"cls":1,"mw":"間違えます","mr":"まちがえます","k":["nhầm lẫn","làm sai","lộn"]},{"w":"落とす","r":"おとす","m":"đánh rơi","t":"v","g":1,"cls":1,"mw":"落とします","mr":"おとします","k":["làm rơi","đánh mất","rơi","mất"]},{"w":"掛かる","r":"かかる","m":"được khóa (かぎが～: cửa được khóa)","t":"v","g":1,"cls":1,"mw":"掛かります","mr":"かかります","k":["khóa","bị khóa","khóa cửa","đã khóa"]},{"w":"ふく","r":"ふく","m":"lau","t":"v","g":1,"cls":1,"mw":"ふきます","mr":"ふきます","k":["lau chùi","chùi","lau sạch"]},{"w":"取り替える","r":"とりかえる","m":"thay, đổi","t":"v","g":2,"cls":1,"mw":"取り替えます","mr":"とりかえます","k":["thay thế","thay mới","đổi lại"]},{"w":"片付ける","r":"かたづける","m":"dọn dẹp","t":"v","g":2,"cls":1,"mw":"片付けます","mr":"かたづけます","k":["dọn","thu dọ không nhớ","quên rồi","không nhớ ra","chẳng nhớ"]},{"w":"網棚","r":"あみだな","m":"giá để hành lý (trên tàu)","t":"n","cls":1,"k":["giá hành lý","kệ hành lý","giá để đồ"]},{"w":"確か","r":"たしか","m":"nếu tôi nhớ không nhầm, hình như","t":"x","k":["chắc là","nếu không nhầm","hình như là"]},{"w":"［ああ、］よかった","r":"［ああ、］よかった","m":"May quá / Tốt quá","t":"e","k":["may mà","thật may","thật tốt"]},{"w":"地震","r":"じしん","m":"động đất","t":"n","k":["địa chấn","rung chấn","trận động đất"]},{"w":"壁","r":"かべ","m":"tường","t":"n","k":["bức tường","vách","vách tường"]},{"w":"針","r":"はり","m":"kim (đồng hồ)","t":"n","k":["cây kim","kim khâu","kim giờ"]},{"w":"指す","r":"さす","m":"chỉ (kim đồng hồ chỉ)","t":"v","g":1,"mw":"指します","mr":"さします","k":["trỏ","chỉ vào","chỉ về"]},{"w":"駅前","r":"えきまえ","m":"trước nhà ga","t":"n","k":["trước ga","gần ga","khu trước ga"]},{"w":"倒れる","r":"たおれる","m":"(tòa nhà) đổ, ngã","t":"v","g":2,"cls":1,"mw":"倒れます","mr":"たおれます","k":["sập","té","ngã xuống"]},{"w":"西","r":"にし","m":"phía tây","t":"n","k":["tây","hướng tây","miền tây"]},{"w":"～の方","r":"～のほう","m":"về phía ～","t":"x","k":["hướng về","phía","hướng","phía bên"]},{"w":"燃える","r":"もえる","m":"cháy","t":"v","g":2,"mw":"燃えます","mr":"もえます","k":["bốc cháy","bị cháy","cháy rực"]},{"w":"かたづく","r":"かたづく","m":"được dọn dẹp gọn gàng (tự) (部屋が～: phòng gọn gàng)","t":"v","cls":1,"add":1,"g":1,"mw":"かたづきます","mr":"かたづきます","k":["dọn xong","gọn gàng","ngăn nắp","xong xuôi"]},{"w":"開ける","r":"あける","m":"mở (tha) (ドアを～: mở cửa)","t":"v","cls":1,"add":1,"g":2,"mw":"開けます","mr":"あけます","k":["mở ra","mở cửa ra","mở nắp"]},{"w":"つける","r":"つける","m":"bật (tha) (電気を～: bật đèn)","t":"v","cls":1,"add":1,"g":2,"mw":"つけます","mr":"つけます","k":["bật lên","mở đèn","mở"]},{"w":"折る","r":"おる","m":"bẻ gãy, gấp (tha) (えだを～: bẻ cành)","t":"v","cls":1,"add":1,"g":1,"mw":"折ります","mr":"おります","k":["bẻ","gập","gãy","gấp giấy"]},{"w":"割る","r":"わる","m":"làm vỡ (tha) (コップを～: làm vỡ cốc)","t":"v","cls":1,"add":1,"g":1,"mw":"割ります","mr":"わります","k":["đập vỡ","làm bể","bẻ ra"]},{"w":"破る","r":"やぶる","m":"xé, làm rách (tha) (紙を～: xé giấy)","t":"v","cls":1,"add":1,"g":1,"mw":"破ります","mr":"やぶります","k":["xé rách","xé toạc","phá vỡ"]},{"w":"壊す","r":"こわす","m":"làm hỏng (tha) (パソコンを～: làm hỏng máy tính)","t":"v","cls":1,"add":1,"g":1,"mw":"壊します","mr":"こわします","k":["phá","làm hư","phá hỏng"]},{"w":"汚す","r":"よごす","m":"làm bẩn (tha) (シャツを～: làm bẩn áo)","t":"v","cls":1,"add":1,"g":1,"mw":"汚します","mr":"よごします","k":["làm dơ","bôi bẩn","vấy bẩn"]},{"w":"倒す","r":"たおす","m":"làm đổ, quật ngã (tha) (木を～: làm đổ cây)","t":"v","cls":1,"add":1,"g":1,"mw":"倒します","mr":"たおします","k":["làm ngã","đánh đổ","lật đổ","đốn ngã"]},{"w":"外す","r":"はずす","m":"tháo, cởi (tha) (ボタンを～: cởi cúc)","t":"v","cls":1,"add":1,"g":1,"mw":"外します","mr":"はずします","k":["tháo ra","bỏ ra","gỡ"]},{"w":"閉める","r":"しめる","m":"đóng (tha) (ドアを～: đóng cửa)","t":"v","cls":1,"add":1,"g":2,"mw":"閉めます","mr":"しめます","k":["đóng lại","khép","đóng cửa lại"]},{"w":"かける","r":"かける","m":"khóa (tha) (かぎを～: khóa cửa)","t":"v","cls":1,"add":1,"g":2,"mw":"かけます","mr":"かけます","k":["khóa lại","cài khóa","khóa chặt"]},{"w":"止める","r":"とめる","m":"dừng, đỗ (tha) (車を～: đỗ xe)","t":"v","cls":1,"add":1,"g":2,"mw":"止めます","mr":"とめます","k":["dừng lại","đậu xe","ngừng"]},{"w":"落ちる","r":"おちる","m":"rơi (tự) (さいふが～: ví bị rơi)","t":"v","cls":1,"add":1,"g":2,"mw":"落ちます","mr":"おちます","k":["rơi xuống","ngã","bị rơi","trượt"]},{"w":"消す","r":"けす","m":"tắt (tha) (電気を～: tắt đèn)","t":"v","cls":1,"add":1,"g":1,"mw":"消します","mr":"けします","k":["tắt đi","xóa","dập tắt"]},{"w":"グラス","r":"グラス","m":"ly, cốc thủy tinh","t":"n","cls":1,"add":1,"k":["cốc","ly rượu","ly thủy tinh","cốc uống nước"]}],"compare":[{"title":"N が 開いています vs N を 開けています","points":[{"label":"自動詞 + ています","text":"Trạng thái kết quả: cửa đang ở trạng thái mở. Ví dụ: ドアが開いています."},{"label":"他動詞 + ています","text":"Hành động đang diễn ra: ai đó đang mở. Ví dụ: 田中さんがドアを開けています (Anh Tanaka đang mở cửa)."}],"tip":"が + tự động từ ています = nhìn thấy trạng thái; を + tha động từ ています = nhìn thấy người đang làm."},{"title":"〜ました vs 〜てしまいました","points":[{"label":"〜ました","text":"Chỉ nêu sự việc trung tính. Ví dụ: 傘を忘れました."},{"label":"〜てしまいました","text":"Thêm cảm xúc tiếc nuối, hoặc nhấn mạnh 'xong hẳn'. Ví dụ: 傘を忘れてしまいました (lỡ quên mất rồi)."}],"tip":"Muốn nói 'mất rồi, lỡ rồi, xong hết rồi' → thêm てしまいました."}],"quiz":[{"q":"寒{さむ}いですね。あ、窓{まど}が＿＿います。","options":["あけて","あいて","あけって","あきて"],"answer":1,"explain":"Có が và mô tả trạng thái → tự động từ 開く: 開いています. 開けて là tha động từ, phải đi với を."},{"q":"電車{でんしゃ}の中{なか}に財布{さいふ}を忘{わす}れて＿＿。","options":["おきました","ありました","しまいました","みました"],"answer":2,"explain":"Sự việc đáng tiếc ngoài ý muốn → てしまいました. ておきました là cố ý chuẩn bị, không hợp với việc để quên."},{"q":"このコップ、＿＿いますよ。","options":["われて","わって","われって","わりて"],"answer":0,"explain":"Mô tả trạng thái cái cốc → tự động từ 割れる: 割れています. 割って (割る) là tha động từ, nghĩa là ai đó đang đập vỡ."},{"q":"明日{あした}は休{やす}みだから、今日中{きょうじゅう}に仕事{しごと}を＿＿しまいます。","options":["やる","やり","やった","やって"],"answer":3,"explain":"しまいます đi sau thể て: やってしまいます (sẽ làm xong). Các dạng khác không nối được với しまいます."},{"q":"強{つよ}い風{かぜ}で木{き}の枝{えだ}が＿＿います。","options":["おって","おれて","おれって","おりて"],"answer":1,"explain":"Chủ ngữ が + trạng thái → tự động từ 折れる: 折れています. 折って (折る) là tha động từ, cần を."}]},{"lesson":30,"title":"Trạng thái có chủ ý · Làm sẵn · Vẫn còn","summary":"Diễn tả trạng thái là kết quả của hành động có chủ ý (〜てあります), làm sẵn để chuẩn bị hoặc để nguyên (〜ておきます), nói 'vẫn còn đang' (まだ〜ています) và nêu ví dụ bằng 〜とか.","grammar":[{"pattern":"他動詞 + てあります","meaning":"Trạng thái còn lại do ai đó đã cố ý làm (thường để chuẩn bị)","form":"N が + tha động từ thể て + あります; N1 に N2 が 〜てあります","notes":"Tân ngữ を đổi thành が. Người nói ngụ ý có người đã làm việc đó với mục đích. Chỉ dùng tha động từ (×開いてあります).","examples":[{"ja":"机{つくえ}の上{うえ}にメモが置{お}いてあります。","vi":"Trên bàn có để sẵn một tờ ghi chú."},{"ja":"カレンダーに会議{かいぎ}の日{ひ}が書{か}いてあります。","vi":"Trên lịch có ghi ngày họp."},{"ja":"冷蔵庫{れいぞうこ}にジュースが冷{ひ}やしてありますよ。","vi":"Trong tủ lạnh có nước ép đã ướp lạnh sẵn đấy."}]},{"pattern":"V ておきます（chuẩn bị）","meaning":"Làm sẵn trước để chuẩn bị cho việc sau","form":"V て + おきます; văn nói: 〜とく (しておく → しとく)","notes":"Hay đi với 〜前に, 〜までに. Nhấn mạnh hành động có mục đích chuẩn bị.","examples":[{"ja":"旅行{りょこう}の前{まえ}にホテルを予約{よやく}しておきます。","vi":"Trước chuyến đi tôi sẽ đặt khách sạn sẵn."},{"ja":"会議{かいぎ}までに資料{しりょう}を読{よ}んでおいてください。","vi":"Hãy đọc trước tài liệu trước buổi họp."}]},{"pattern":"V ておきます（dọn dẹp / để nguyên）","meaning":"(1) Làm xong để trả về như cũ; (2) để nguyên trạng thái như vậy","form":"V て + おきます / おいてください","notes":"Nghĩa (2) thường gặp trong câu trả lời: そのままにしておいてください, 開けておいてください.","examples":[{"ja":"使{つか}ったはさみは元{もと}の所{ところ}に戻{もど}しておいてください。","vi":"Kéo dùng xong thì hãy để lại chỗ cũ."},{"ja":"A：エアコンを消{け}しましょうか。B：暑{あつ}いですから、つけておいてください。","vi":"A: Tôi tắt điều hòa nhé? B: Nóng lắm, cứ để bật đi."}]},{"pattern":"まだ + V ています","meaning":"Vẫn còn đang (hành động / trạng thái chưa kết thúc)","form":"まだ + V て + います","notes":"Đối lập với もう〜ました. Trả lời phủ định cho câu hỏi もう〜ましたか cũng dùng まだ〜ていません.","examples":[{"ja":"雨{あめ}はまだ降{ふ}っています。","vi":"Trời vẫn còn đang mưa."},{"ja":"十時{じゅうじ}ですが、子{こ}どもはまだ寝{ね}ています。","vi":"10 giờ rồi mà con vẫn còn ngủ."}]},{"pattern":"N とか N（とか）","meaning":"Nào là..., như là... (nêu ví dụ, văn nói)","form":"N1 とか N2 とか; cũng gắn sau V thể từ điển","notes":"Giống や nhưng thân mật hơn, dùng nhiều trong hội thoại. Có thể đặt とか sau cả mục cuối.","examples":[{"ja":"休{やす}みの日{ひ}は、掃除{そうじ}とか洗濯{せんたく}とかをします。","vi":"Ngày nghỉ tôi làm những việc như dọn dẹp, giặt giũ."},{"ja":"果物{くだもの}とか野菜{やさい}とか、体{からだ}にいい物{もの}を食{た}べてください。","vi":"Hãy ăn những thứ tốt cho cơ thể như hoa quả, rau."}]}],"vocab":[{"w":"はる","r":"はる","m":"dán","t":"v","g":1,"cls":1,"mw":"はります","mr":"はります","k":["dán lên","dính","dán tường"]},{"w":"掛ける","r":"かける","m":"treo","t":"v","g":2,"cls":1,"mw":"掛けます","mr":"かけます","k":["treo lên","móc","móc lên"]},{"w":"飾る","r":"かざる","m":"trang trí","t":"v","g":1,"cls":1,"mw":"飾ります","mr":"かざります","k":["bày trí","trưng bày","bày biện"]},{"w":"並べる","r":"ならべる","m":"xếp, bày (đồ) thành hàng","t":"v","g":2,"cls":1,"mw":"並べます","mr":"ならべます","k":["xếp hàng","sắp xếp","bày ra"]},{"w":"植える","r":"うえる","m":"trồng (cây)","t":"v","g":2,"cls":1,"mw":"植えます","mr":"うえます","k":["trồng cây","gieo trồng","trồng hoa"]},{"w":"戻す","r":"もどす","m":"trả lại chỗ cũ","t":"v","g":1,"cls":1,"mw":"戻します","mr":"もどします","k":["trả về","để lại chỗ cũ","đặt lại"]},{"w":"まとめる","r":"まとめる","m":"gom lại, tổng hợp","t":"v","g":2,"cls":1,"mw":"まとめます","mr":"まとめます","k":["gom","tập hợp","tóm tắt","gộp"]},{"w":"片付ける","r":"かたづける","m":"dọn dẹp","t":"v","g":2,"mw":"片付けます","mr":"かたづけます","k":["dọn","thu dọn","sắp xếp","dọn nhà"]},{"w":"しまう","r":"しまう","m":"cất đi","t":"v","g":1,"cls":1,"mw":"しまいます","mr":"しまいます","k":["cất","cất giữ","thu dọn","cất vào"]},{"w":"決める","r":"きめる","m":"quyết định","t":"v","g":2,"cls":1,"mw":"決めます","mr":"きめます","k":["chọn","định","chốt"]},{"w":"知らせる","r":"しらせる","m":"thông báo, báo cho biết","t":"v","g":2,"mw":"知らせます","mr":"しらせます","k":["báo","báo tin","cho biết","cho hay"]},{"w":"相談する","r":"そうだんする","m":"bàn bạc, hỏi ý kiến","t":"v","g":3,"mw":"相談します","mr":"そうだんします","k":["thảo luận","tư vấn","hỏi ý","trao đổi"]},{"w":"予習する","r":"よしゅうする","m":"chuẩn bị bài trước","t":"v","g":3,"cls":1,"mw":"予習します","mr":"よしゅうします","k":["soạn bài","học trước","chuẩn bị bài","xem bài trước"]},{"w":"復習する","r":"ふくしゅうする","m":"ôn bài","t":"v","g":3,"cls":1,"mw":"復習します","mr":"ふくしゅうします","k":["ôn tập","ôn lại","học lại"]},{"w":"そのままにする","r":"そのままにする","m":"để nguyên như thế","t":"v","g":3,"cls":1,"mw":"そのままにします","mr":"そのままにします","k":["để nguyên","để vậy","giữ nguyên","để yên"]},{"w":"お子さん","r":"おこさん","m":"con (của người khác)","t":"n","k":["con cái","cháu","đứa trẻ"]},{"w":"授業","r":"じゅぎょう","m":"giờ học","t":"n","cls":1,"k":["tiết học","buổi học","lớp học"]},{"w":"講義","r":"こうぎ","m":"bài giảng","t":"n","cls":1,"k":["giảng dạy","bài học","giờ giảng"]},{"w":"ミーティング","r":"ミーティング","m":"cuộc họp","t":"n","cls":1,"k":["họp","buổi họp","meeting"]},{"w":"予定","r":"よてい","m":"dự định, kế hoạch","t":"n","cls":1,"k":["lịch trình","dự kiến","lịch"]},{"w":"お知らせ","r":"おしらせ","m":"thông báo","t":"n","cls":1,"k":["báo tin","tin tức","thông tin"]},{"w":"案内書","r":"あんないしょ","m":"sách hướng dẫn","t":"n","k":["tài liệu hướng dẫn","tờ hướng dẫn","cẩm nang"]},{"w":"カレンダー","r":"カレンダー","m":"lịch","t":"n","cls":1,"k":["tờ lịch","lịch treo tường","lịch bàn"]},{"w":"ポスター","r":"ポスター","m":"áp phích","t":"n","cls":1,"k":["tranh dán","poster","tranh quảng cáo"]},{"w":"ごみ箱","r":"ごみばこ","m":"thùng rác","t":"n","cls":1,"k":["sọt rác","giỏ rác","thùng đựng rác"]},{"w":"人形","r":"にんぎょう","m":"búp bê","t":"n","cls":1,"k":["con rối","đồ chơi","búp bê vải"]},{"w":"花瓶","r":"かびん","m":"bình hoa","t":"n","cls":1,"k":["lọ hoa","bình cắm hoa","lọ cắm hoa"]},{"w":"鏡","r":"かがみ","m":"gương","t":"n","cls":1,"k":["kính soi","gương soi","kiếng"]},{"w":"引き出し","r":"ひきだし","m":"ngăn kéo","t":"n","cls":1,"k":["hộc tủ","ngăn bàn","hộc bàn"]},{"w":"玄関","r":"げんかん","m":"lối vào, sảnh","t":"n","cls":1,"k":["cửa vào","lối vào nhà","tiền sảnh"]},{"w":"廊下","r":"ろうか","m":"hành lang","t":"n","cls":1,"k":["lối đi","hành lang nhà","lối đi trong nhà"]},{"w":"壁","r":"かべ","m":"tường","t":"n","cls":1,"k":["bức tường","vách","vách tường"]},{"w":"池","r":"いけ","m":"ao","t":"n","cls":1,"k":["hồ","hồ nước","ao hồ"]},{"w":"交番","r":"こうばん","m":"đồn cảnh sát (nhỏ)","t":"n","k":["đồn công an","bốt cảnh sát","chốt cảnh sát"]},{"w":"元の所","r":"もとのところ","m":"chỗ cũ","t":"n","cls":1,"k":["vị trí cũ","chỗ ban đầu","nơi cũ"]},{"w":"周り","r":"まわり","m":"xung quanh","t":"n","cls":1,"k":["chung quanh","vòng quanh","lân cận"]},{"w":"真ん中","r":"まんなか","m":"chính giữa","t":"n","cls":1,"k":["giữa","ở giữa","trung tâm"]},{"w":"隅","r":"すみ","m":"góc","t":"n","cls":1,"k":["góc phòng","xó","góc khuất"]},{"w":"まだ","r":"まだ","m":"vẫn còn","t":"x","cls":1,"k":["vẫn","chưa","còn","vẫn chưa","còn nữa"]},{"w":"～ほど","r":"～ほど","m":"khoảng ～","t":"x","k":["chừng","độ","cỡ"]},{"w":"予定表","r":"よていひょう","m":"bảng kế hoạch, lịch trình","t":"n","cls":1,"k":["thời gian biểu","kế hoạch","lịch làm việc","bảng lịch"]},{"w":"ご苦労さま","r":"ごくろうさま","m":"Anh/chị đã vất vả rồi (nói với người dưới)","t":"e","k":["vất vả rồi","cảm ơn đã vất vả","cực khổ rồi","cảm ơn anh"]},{"w":"希望","r":"きぼう","m":"nguyện vọng, mong muốn","t":"n","k":["hy vọng","yêu cầu","ước muốn"]},{"w":"何かご希望がありますか","r":"なにかごきぼうがありますか","m":"Anh/chị có nguyện vọng gì không?","t":"e","k":["có mong muốn gì không","muốn gì không","có yêu cầu gì không"]},{"w":"ミュージカル","r":"ミュージカル","m":"nhạc kịch","t":"n","k":["ca kịch","musical","kịch hát"]},{"w":"それはいいですね","r":"それはいいですね","m":"Thế thì hay quá nhỉ","t":"e","k":["hay quá","tốt quá","được đấy","nghe hay đấy"]},{"w":"丸い","r":"まるい","m":"tròn","t":"a","k":["hình tròn","tròn trịa","tròn xoe"]},{"w":"月","r":"つき","m":"mặt trăng","t":"n","k":["trăng","ông trăng","vầng trăng"]},{"w":"地球","r":"ちきゅう","m":"Trái Đất","t":"n","k":["địa cầu","quả đất","hành tinh"]},{"w":"うれしい","r":"うれしい","m":"vui mừng","t":"a","k":["vui","mừng","hạnh phúc","sung sướng"]},{"w":"嫌","r":"いや","m":"ghét, khó chịu","t":"a","k":["không thích","không muốn","chán ghét"]},{"w":"すると","r":"すると","m":"thế là, ngay sau đó","t":"x","k":["liền","thì","lập tức"]},{"w":"目が覚める","r":"めがさめる","m":"tỉnh giấc, thức dậy","t":"v","g":2,"mw":"目が覚めます","mr":"めがさめます","k":["tỉnh dậy","tỉnh ngủ","dậy"]},{"w":"ガイドブック","r":"ガイドブック","m":"sách hướng dẫn du lịch","t":"n","cls":1,"add":1,"k":["sách du lịch","cẩm nang du lịch","hướng dẫn du lịch","guidebook"]}],"compare":[{"title":"〜ています（自動詞）vs 〜てあります（他動詞）","points":[{"label":"自動詞 + ています","text":"Chỉ mô tả trạng thái nhìn thấy, không quan tâm ai làm hay vì sao. Ví dụ: 窓が開いています (Cửa sổ đang mở — có thể do gió)."},{"label":"他動詞 + てあります","text":"Trạng thái do có người cố ý làm, thường với mục đích. Ví dụ: 窓が開けてあります (Cửa sổ đã được mở sẵn — ai đó mở để thông gió)."}],"tip":"Cùng là 'đang mở': chỉ mô tả → 開いています; nhấn ý 'có người đã mở sẵn' → 開けてあります."},{"title":"〜てあります vs 〜ておきます","points":[{"label":"〜てあります","text":"Nhìn vào trạng thái đã có sẵn, chủ ngữ là vật (が). Ví dụ: ビールが冷やしてあります."},{"label":"〜ておきます","text":"Nói về hành động chuẩn bị của người làm, tân ngữ を. Ví dụ: ビールを冷やしておきます."}],"tip":"てあります = kết quả (vật が); ておきます = hành động chuẩn bị (người làm, を)."}],"quiz":[{"q":"壁{かべ}にカレンダーが＿＿あります。","options":["かかって","かけ","かかり","かけて"],"answer":3,"explain":"てあります chỉ đi với tha động từ: 掛ける → 掛けてあります. 掛かって là tự động từ, đi với います (掛かっています)."},{"q":"明日{あした}お客{きゃく}さんが来{く}るので、今晩{こんばん}ビールを冷{ひ}やして＿＿。","options":["あります","おきます","なります","います"],"answer":1,"explain":"Làm sẵn để chuẩn bị cho ngày mai → ておきます. てあります mô tả trạng thái đã có, không dùng với を và 今晩 (dự định); ています không diễn tả việc chuẩn bị cho tương lai."},{"q":"「電気{でんき}を消{け}しましょうか。」「いいえ、まだ使{つか}いますから、＿＿おいてください。」","options":["つけて","ついて","けして","つけ"],"answer":0,"explain":"Để nguyên trạng thái bật → tha động từ つける + ておいてください. ついて là tự động từ, không dùng với ておく."},{"q":"「もう雨{あめ}はやみましたか。」「いいえ、＿＿降{ふ}っています。」","options":["もう","すぐ","まで","まだ"],"answer":3,"explain":"Vẫn còn đang mưa → まだ + Vています. もう là 'đã rồi', mâu thuẫn với いいえ; すぐ, まで không đi được với nghĩa này."},{"q":"部屋{へや}が暑{あつ}いので、窓{まど}が開{あ}けて＿＿。閉{し}めないでください。","options":["あります","います","みます","しまいます"],"answer":0,"explain":"が + tha động từ 開ける + trạng thái do có người cố ý làm → 開けてあります. ×窓が開けています (tha động từ ています phải đi với を và chỉ hành động đang làm)."}]},{"lesson":31,"title":"Thể ý chí · Dự định, kế hoạch","summary":"Học thể ý chí (意向形) để rủ rê thân mật và nói ý định của mình, cùng các cách nói dự định, kế hoạch (つもり, 予定) và việc 'vẫn chưa làm'.","grammar":[{"pattern":"意向形 (thể ý chí)","meaning":"Thể thường của 〜ましょう: rủ rê thân mật, hoặc tự nhủ 'mình sẽ ~'","form":"Nhóm I: đổi đuôi -u → -ou (行く→行こう, 飲む→飲もう, 待つ→待とう); Nhóm II: bỏ る + よう (食べる→食べよう, 見る→見よう); Nhóm III: する→しよう, 来る→こよう","notes":"Dùng với bạn bè, người thân thay cho 〜ましょう. Khi nói một mình, nó thể hiện quyết tâm của người nói. Chú ý nhóm I: 帰る→帰ろう, không phải 帰よう.","examples":[{"ja":"疲{つか}れたね。ちょっと休{やす}もう。","vi":"Mệt rồi nhỉ. Nghỉ một chút đi."},{"ja":"もう遅{おそ}いから、一緒{いっしょ}に帰{かえ}ろうよ。","vi":"Muộn rồi, cùng về đi."},{"ja":"明日{あした}から毎朝{まいあさ}6時{じ}に起{お}きよう。","vi":"Từ mai mình sẽ dậy lúc 6 giờ mỗi sáng."}]},{"pattern":"V意向形 + と思っています","meaning":"Định ~, đang có ý định ~ (ý định đã có từ trước và vẫn giữ)","form":"V thể ý chí + と思っています / と思います","notes":"と思っています: ý định đã nghĩ từ trước, kéo dài đến hiện tại; cũng dùng để nói ý định của người thứ ba. と思います: ý định nảy ra ngay lúc nói, chỉ dùng cho bản thân.","examples":[{"ja":"来年{らいねん}、日本{にほん}へ留学{りゅうがく}しようと思{おも}っています。","vi":"Tôi đang định sang Nhật du học vào năm sau."},{"ja":"週末{しゅうまつ}は家{いえ}でゆっくり映画{えいが}を見{み}ようと思{おも}っています。","vi":"Cuối tuần tôi định ở nhà thong thả xem phim."},{"ja":"兄{あに}は会社{かいしゃ}をやめて、店{みせ}を始{はじ}めようと思{おも}っています。","vi":"Anh tôi đang định nghỉ việc để mở cửa hàng."}]},{"pattern":"Vる / Vない + つもりです","meaning":"Định (sẽ) ~ / định không ~ (ý định rõ ràng, chắc chắn hơn)","form":"V thể từ điển + つもりです; V thể ない + つもりです","notes":"Thể hiện ý định đã quyết khá chắc. Không dùng つもり cho sự vật hay lịch trình khách quan. Khi nói với cấp trên, つもり có thể nghe hơi cứng, nên dùng 〜と思っています mềm hơn.","examples":[{"ja":"夏休{なつやす}みに国{くに}へ帰{かえ}るつもりです。","vi":"Kỳ nghỉ hè tôi định về nước."},{"ja":"体{からだ}に悪{わる}いから、もうたばこは吸{す}わないつもりです。","vi":"Vì có hại cho sức khỏe nên tôi định sẽ không hút thuốc nữa."},{"ja":"将来{しょうらい}、大学院{だいがくいん}で経済{けいざい}を勉強{べんきょう}するつもりです。","vi":"Sau này tôi định học kinh tế ở cao học."}]},{"pattern":"Vる / Nの + 予定です","meaning":"Theo kế hoạch/lịch trình thì ~","form":"V thể từ điển + 予定です; N + の + 予定です","notes":"Nói về lịch trình đã được sắp xếp, mang tính khách quan, không phụ thuộc vào ý muốn cá nhân. Dùng được cho cả sự vật (tàu, máy bay, cuộc họp).","examples":[{"ja":"会議{かいぎ}は3時{じ}に終{お}わる予定{よてい}です。","vi":"Cuộc họp dự kiến kết thúc lúc 3 giờ."},{"ja":"来週{らいしゅう}は大阪{おおさか}へ出張{しゅっちょう}の予定{よてい}です。","vi":"Tuần sau tôi có lịch đi công tác Osaka."},{"ja":"新{あたら}しいビルは来年{らいねん}の春{はる}に完成{かんせい}する予定{よてい}です。","vi":"Tòa nhà mới dự kiến hoàn thành vào mùa xuân năm sau."}]},{"pattern":"まだ Vていません","meaning":"Vẫn chưa ~ (việc lẽ ra đã/sẽ làm nhưng tới giờ chưa làm)","form":"まだ + V thể て + いません","notes":"Câu trả lời phủ định cho 'もう〜ましたか'. Không trả lời bằng 〜ませんでした, vì ませんでした nghĩa là 'đã không làm' (chuyện đã khép lại).","examples":[{"ja":"A：もう昼{ひる}ご飯{はん}を食{た}べましたか。B：いいえ、まだ食{た}べていません。","vi":"A: Ăn trưa chưa? B: Chưa, tôi vẫn chưa ăn."},{"ja":"レポートはまだ書{か}いていません。今晩{こんばん}書{か}くつもりです。","vi":"Bài báo cáo tôi vẫn chưa viết. Tôi định viết tối nay."},{"ja":"旅行{りょこう}の予定{よてい}はまだ決{き}めていません。","vi":"Lịch du lịch thì tôi vẫn chưa quyết."}]}],"vocab":[{"w":"始まる","r":"はじまる","m":"bắt đầu (tự)","t":"v","g":1,"mw":"始まります","mr":"はじまります","k":["khởi đầu","mở đầu","khai mạc"]},{"w":"続ける","r":"つづける","m":"tiếp tục (làm gì)","t":"v","g":2,"cls":1,"mw":"続けます","mr":"つづけます","k":["duy trì","tiếp","làm tiếp"]},{"w":"見つける","r":"みつける","m":"tìm ra, tìm thấy","t":"v","g":2,"cls":1,"mw":"見つけます","mr":"みつけます","k":["phát hiện","tìm được","kiếm được"]},{"w":"受ける","r":"うける","m":"dự (thi), tham gia (試験を～: dự thi)","t":"v","g":2,"cls":1,"mw":"受けます","mr":"うけます","k":["nhận","tham dự","đi thi"]},{"w":"入学する","r":"にゅうがくする","m":"nhập học","t":"v","g":3,"mw":"入学します","mr":"にゅうがくします","k":["vào trường","vào học","nhập trường"]},{"w":"卒業する","r":"そつぎょうする","m":"tốt nghiệp","t":"v","g":3,"mw":"卒業します","mr":"そつぎょうします","k":["ra trường","học xong","tốt nghiệp xong"]},{"w":"休憩する","r":"きゅうけいする","m":"nghỉ giải lao","t":"v","g":3,"cls":1,"mw":"休憩します","mr":"きゅうけいします","k":["nghỉ ngơi","giải lao","nghỉ"]},{"w":"連休","r":"れんきゅう","m":"kỳ nghỉ dài (nhiều ngày liền)","t":"n","cls":1,"k":["nghỉ lễ","nghỉ dài ngày","kỳ nghỉ lễ"]},{"w":"作文","r":"さくぶん","m":"bài văn","t":"n","cls":1,"k":["tập làm văn","bài viết","viết văn"]},{"w":"展覧会","r":"てんらんかい","m":"triển lãm","t":"n","cls":1,"k":["trưng bày","hội chợ","buổi triển lãm"]},{"w":"結婚式","r":"けっこんしき","m":"lễ cưới","t":"n","cls":1,"k":["đám cưới","tiệc cưới","hôn lễ"]},{"w":"［お］葬式","r":"［お］そうしき","m":"đám tang","t":"n","cls":1,"k":["tang lễ","đám ma","lễ tang"]},{"w":"式","r":"しき","m":"buổi lễ","t":"n","k":["lễ","nghi lễ","nghi thức"]},{"w":"本社","r":"ほんしゃ","m":"trụ sở chính","t":"n","cls":1,"k":["trụ sở","công ty mẹ","văn phòng chính"]},{"w":"支店","r":"してん","m":"chi nhánh","t":"n","cls":1,"k":["văn phòng chi nhánh","chi nhánh công ty","cửa hàng chi nhánh"]},{"w":"教会","r":"きょうかい","m":"nhà thờ","t":"n","cls":1,"k":["giáo đường","nhà thờ Công giáo","thánh đường"]},{"w":"大学院","r":"だいがくいん","m":"cao học","t":"n","cls":1,"k":["sau đại học","thạc sĩ","tiến sĩ"]},{"w":"動物園","r":"どうぶつえん","m":"sở thú","t":"n","cls":1,"k":["vườn thú","thảo cầm viên","vườn bách thú"]},{"w":"温泉","r":"おんせん","m":"suối nước nóng","t":"n","cls":1,"k":["tắm suối nóng","onsen","tắm khoáng nóng"]},{"w":"お客さん","r":"おきゃくさん","m":"khách, khách hàng","t":"n","k":["quý khách","khách mời","người khách"]},{"w":"だれか","r":"だれか","m":"ai đó","t":"x","k":["có ai","người nào đó","ai"]},{"w":"～の方","r":"～のほう","m":"phía ~, hướng ~","t":"x","k":["hướng về","phía","hướng","phía bên"]},{"w":"ずっと","r":"ずっと","m":"suốt, mãi","t":"x","cls":1,"k":["liên tục","luôn luôn","hoài"]},{"w":"残る","r":"のこる","m":"ở lại, còn lại","t":"v","g":1,"mw":"残ります","mr":"のこります","k":["sót lại","thừa","còn"]},{"w":"月に","r":"つきに","m":"mỗi tháng (月に2回: tháng 2 lần)","t":"x","k":["một tháng","hàng tháng","mỗi tháng một"]},{"w":"普通の","r":"ふつうの","m":"bình thường, thông thường","t":"a","k":["phổ thông","thường","bình thường thôi"]},{"w":"インターネット","r":"インターネット","m":"internet","t":"n","k":["mạng","mạng internet","lên mạng"]},{"w":"村","r":"むら","m":"làng","t":"n","k":["thôn","làng quê","nông thôn"]},{"w":"映画館","r":"えいがかん","m":"rạp chiếu phim","t":"n","k":["rạp phim","rạp chiếu bóng","rạp"]},{"w":"嫌","r":"いや","m":"ghét, không thích, khó chịu","t":"a","k":["không thích","không muốn","chán ghét"]},{"w":"空","r":"そら","m":"bầu trời","t":"n","k":["trời","không trung","trời xanh"]},{"w":"閉じる","r":"とじる","m":"nhắm (mắt), đóng lại","t":"v","g":2,"mw":"閉じます","mr":"とじます","k":["nhắm mắt","khép","gập lại"]},{"w":"都会","r":"とかい","m":"thành phố, đô thị","t":"n","k":["thành thị","phố thị","thành phố lớn"]},{"w":"子どもたち","r":"こどもたち","m":"bọn trẻ, các em nhỏ","t":"n","k":["trẻ em","lũ trẻ","các cháu","trẻ con"]},{"w":"自由に","r":"じゆうに","m":"một cách tự do","t":"x","k":["tự do","thoải mái","tùy thích","tùy ý"]},{"w":"世界中","r":"せかいじゅう","m":"khắp thế giới","t":"n","k":["toàn thế giới","cả thế giới","toàn cầu"]},{"w":"集まる","r":"あつまる","m":"tập trung, tụ họp (tự)","t":"v","g":1,"mw":"集まります","mr":"あつまります","k":["tụ tập","gom lại","quây quần"]},{"w":"美しい","r":"うつくしい","m":"đẹp","t":"a","k":["xinh đẹp","tươi đẹp","đẹp đẽ"]},{"w":"自然","r":"しぜん","m":"thiên nhiên","t":"n","k":["tự nhiên","tạo hóa","môi trường"]},{"w":"すばらしさ","r":"すばらしさ","m":"sự tuyệt vời","t":"n","k":["điều tuyệt vời","vẻ đẹp","sự tuyệt diệu"]},{"w":"気が付く","r":"きがつく","m":"nhận ra","t":"v","g":1,"mw":"気が付きます","mr":"きがつきます","k":["phát hiện","để ý","nhận thấy"]},{"w":"取る","r":"とる","m":"lấy (休みを～: xin nghỉ phép)","t":"v","cls":1,"add":1,"g":1,"mw":"取ります","mr":"とります","k":["cầm","nhận","đoạt"]},{"w":"申し込む","r":"もうしこむ","m":"đăng ký","t":"v","cls":1,"add":1,"g":1,"mw":"申し込みます","mr":"もうしこみます","k":["đăng kí","nộp đơn","ghi danh"]},{"w":"発表","r":"はっぴょう","m":"phát biểu, thuyết trình; công bố","t":"n","cls":1,"add":1,"k":["trình bày","thông báo","báo cáo"]}],"compare":[{"title":"意向形+と思っています vs つもりです vs 予定です","points":[{"label":"〜ようと思っています","text":"Ý định đang ấp ủ, còn mềm, có thể thay đổi. Nghe lịch sự, tự nhiên: 車を買おうと思っています。"},{"label":"〜つもりです","text":"Ý định đã quyết khá chắc của người nói: 来年結婚するつもりです。 Không dùng cho sự vật."},{"label":"〜予定です","text":"Lịch trình khách quan, đã sắp xếp, dùng được cho cả sự vật: 電車は9時に着く予定です。"}],"tip":"Ý định trong đầu → と思っています / つもり; đã ghi vào lịch → 予定."}],"quiz":[{"q":"来年{らいねん}、新{あたら}しい車{くるま}を＿＿と思{おも}っています。","options":["買いよう","買えば","買おう","買って"],"answer":2,"explain":"Diễn đạt ý định dùng thể ý chí + と思っています. 買う nhóm I → 買おう. 買いよう là chia sai (nhầm với cách chia nhóm II)."},{"q":"今晩{こんばん}は疲{つか}れたので、どこへも＿＿つもりです。","options":["出かけよう","出かけない","出かけて","出かけた"],"answer":1,"explain":"どこへも đi với phủ định, nên dùng Vない + つもりです: định không đi đâu cả. 出かけよう không đi với つもり."},{"q":"A：宿題{しゅくだい}はもう終{お}わりましたか。B：いいえ、まだ＿＿。","options":["終わりました","終わっています","終わっていません","終わろう"],"answer":2,"explain":"Trả lời phủ định cho もう〜ましたか là まだ〜ていません (vẫn chưa xong). 終わっています là 'đã xong', mâu thuẫn với いいえ."},{"q":"飛行機{ひこうき}は10時{じ}に東京{とうきょう}に着{つ}く＿＿です。","options":["つもり","ため","まで","予定"],"answer":3,"explain":"Lịch trình khách quan của máy bay dùng 予定です. つもり chỉ ý định của con người nên không dùng cho máy bay."},{"q":"明日{あした}もここに＿＿と思{おも}っています。","options":["こよう","きよう","くろう","こおう"],"answer":0,"explain":"Thể ý chí của 来る (nhóm III) là こよう. きよう là lỗi hay gặp do nhầm với thể ます (きます)."}]},{"lesson":32,"title":"Lời khuyên · Dự đoán","summary":"Học cách khuyên ai đó nên/không nên làm gì (ほうがいい) và cách dự đoán với các mức độ chắc chắn khác nhau (でしょう, かもしれません, きっと/たぶん/もしかしたら).","grammar":[{"pattern":"Vた / Vない + ほうがいいです","meaning":"Nên ~ / không nên ~ (lời khuyên)","form":"V thể た + ほうがいいです; V thể ない + ほうがいいです","notes":"Khuyên nên làm thì dùng thể た dù nói về hiện tại/tương lai. Mang sắc thái khuyên khá mạnh, nên cẩn thận khi nói với cấp trên. Phủ định dùng Vないほうがいい, không dùng Vなかったほうがいい.","examples":[{"ja":"健康{けんこう}のために、毎日{まいにち}少{すこ}し運動{うんどう}したほうがいいですよ。","vi":"Vì sức khỏe, mỗi ngày nên vận động một chút."},{"ja":"熱{ねつ}があるときは、お風呂{ふろ}に入{はい}らないほうがいいです。","vi":"Khi bị sốt thì không nên tắm bồn."},{"ja":"寝{ね}る前{まえ}に、スマホを見{み}ないほうがいいですよ。","vi":"Trước khi ngủ không nên xem điện thoại đâu."}]},{"pattern":"普通形 + でしょう","meaning":"Chắc là ~, có lẽ ~ (dự đoán khá chắc chắn)","form":"V・Aい thể thường + でしょう; Aな・N (bỏ だ) + でしょう","notes":"Hay dùng trong dự báo thời tiết, tin tức. Lên giọng cuối câu (〜でしょう？) thì thành câu xác nhận 'đúng không?'. Không nói 'Nだでしょう'.","examples":[{"ja":"明日{あした}は全国的{ぜんこくてき}に雨{あめ}が降{ふ}るでしょう。","vi":"Ngày mai có lẽ trời sẽ mưa trên cả nước."},{"ja":"山{やま}の上{うえ}はもっと寒{さむ}いでしょう。","vi":"Trên núi chắc còn lạnh hơn."},{"ja":"道{みち}が込{こ}んでいるから、田中{たなか}さんはたぶん遅{おく}れるでしょう。","vi":"Đường đang đông nên chắc anh Tanaka sẽ đến muộn."}]},{"pattern":"普通形 + かもしれません","meaning":"Có thể ~, không chừng ~ (khả năng xảy ra, độ chắc thấp)","form":"V・Aい thể thường + かもしれません; Aな・N (bỏ だ) + かもしれません","notes":"Độ chắc chắn khoảng một nửa hoặc thấp hơn. Thể thường thân mật: かもしれない / かも. Không nói 'Nだかもしれません'.","examples":[{"ja":"午後{ごご}から雪{ゆき}が降{ふ}るかもしれません。","vi":"Từ chiều có thể sẽ có tuyết."},{"ja":"財布{さいふ}が見{み}つかりません。車{くるま}の中{なか}かもしれません。","vi":"Không thấy ví đâu. Có thể nó ở trong xe."},{"ja":"相手{あいて}のチームは強{つよ}いから、負{ま}けるかもしれません。","vi":"Đội đối thủ mạnh nên có thể chúng ta sẽ thua."}]},{"pattern":"きっと・たぶん・もしかしたら","meaning":"Trạng từ chỉ mức độ chắc chắn: chắc chắn / có lẽ / biết đâu","form":"きっと〜でしょう; たぶん〜でしょう; もしかしたら〜かもしれません","notes":"きっと: rất chắc; たぶん: khá chắc; もしかしたら: chỉ là khả năng. Thường đi cặp: きっと/たぶん + でしょう, もしかしたら + かもしれません.","examples":[{"ja":"毎日{まいにち}練習{れんしゅう}しているから、きっと合格{ごうかく}するでしょう。","vi":"Ngày nào cũng luyện tập nên chắc chắn sẽ đậu."},{"ja":"これくらいの熱{ねつ}なら、たぶん大丈夫{だいじょうぶ}でしょう。","vi":"Sốt cỡ này thì có lẽ không sao đâu."},{"ja":"電話{でんわ}に出{で}ませんね。もしかしたら、今日{きょう}は休{やす}みかもしれません。","vi":"Không nghe máy nhỉ. Biết đâu hôm nay anh ấy nghỉ."}]}],"vocab":[{"w":"運動する","r":"うんどうする","m":"vận động, tập thể dục","t":"v","g":3,"cls":1,"mw":"運動します","mr":"うんどうします","k":["tập luyện","thể thao","chơi thể thao"]},{"w":"成功する","r":"せいこうする","m":"thành công","t":"v","g":3,"cls":1,"mw":"成功します","mr":"せいこうします","k":["thành đạt","thắng lợi","thành"]},{"w":"失敗する","r":"しっぱいする","m":"thất bại (試験に～: trượt kỳ thi)","t":"v","g":3,"cls":1,"mw":"失敗します","mr":"しっぱいします","k":["trượt","hỏng","không thành","thi trượt"]},{"w":"合格する","r":"ごうかくする","m":"đỗ, đậu (試験に～: đỗ kỳ thi)","t":"v","g":3,"cls":1,"mw":"合格します","mr":"ごうかくします","k":["thi đỗ","thi đậu","trúng tuyển"]},{"w":"戻る","r":"もどる","m":"quay lại, trở về","t":"v","g":1,"mw":"戻ります","mr":"もどります","k":["trở lại","về","quay về","về lại"]},{"w":"やむ","r":"やむ","m":"tạnh, ngừng (雨が～: mưa tạnh)","t":"v","g":1,"cls":1,"mw":"やみます","mr":"やみます","k":["dứt","hết mưa","dừng"]},{"w":"晴れる","r":"はれる","m":"(trời) nắng, quang đãng","t":"v","g":2,"cls":1,"mw":"晴れます","mr":"はれます","k":["trời quang","trời đẹp","tạnh ráo"]},{"w":"曇る","r":"くもる","m":"(trời) nhiều mây, âm u","t":"v","g":1,"cls":1,"mw":"曇ります","mr":"くもります","k":["trời u ám","trời mây","râm"]},{"w":"吹く","r":"ふく","m":"thổi (風が～: gió thổi)","t":"v","g":1,"mw":"吹きます","mr":"ふきます","k":["thổi bay","gió","gió lộng"]},{"w":"治る・直る","r":"なおる","m":"khỏi (bệnh) (治る); được sửa xong (直る)","t":"v","g":1,"mw":"治ります・直ります","mr":"なおります","k":["khỏi bệnh","lành","sửa xong","hết bệnh"]},{"w":"続く","r":"つづく","m":"kéo dài, tiếp diễn (tự)","t":"v","g":1,"cls":1,"mw":"続きます","mr":"つづきます","k":["liên tục","tiếp tục","kéo theo"]},{"w":"冷やす","r":"ひやす","m":"làm mát, làm lạnh, chườm lạnh","t":"v","g":1,"cls":1,"mw":"冷やします","mr":"ひやします","k":["ướp lạnh","chườm","làm nguội","ướp đá"]},{"w":"心配","r":"しんぱい","m":"lo lắng","t":"a","k":["lo","bận tâm","lo âu","băn khoăn"]},{"w":"十分","r":"じゅうぶん","m":"đủ, đầy đủ","t":"a","cls":1,"k":["dư","dư dả","thừa sức"]},{"w":"おかしい","r":"おかしい","m":"lạ, bất thường; buồn cười","t":"a","cls":1,"k":["kỳ lạ","kỳ quặc","khác thường","hài hước","mắc cười","không bình thường"]},{"w":"うるさい","r":"うるさい","m":"ồn ào","t":"a","cls":1,"k":["ầm ĩ","om sòm","phiền phức","lắm điều","nhức tai"]},{"w":"やけど","r":"やけど","m":"vết bỏng (～をする: bị bỏng)","t":"n","cls":1,"k":["phỏng","bỏng nước","bỏng lửa"]},{"w":"けが","r":"けが","m":"vết thương (～をする: bị thương)","t":"n","cls":1,"k":["thương tích","chấn thương","vết đứt","bị đau"]},{"w":"せき","r":"せき","m":"ho (～が出る: bị ho)","t":"n","cls":1,"k":["cơn ho","ho khan","ho nhiều"]},{"w":"インフルエンザ","r":"インフルエンザ","m":"cúm","t":"n","cls":1,"k":["bệnh cúm","cảm cúm","cúm mùa","virus cúm","bị cúm"]},{"w":"空","r":"そら","m":"bầu trời","t":"n","cls":1,"k":["trời","không trung","trời xanh"]},{"w":"太陽","r":"たいよう","m":"mặt trời","t":"n","cls":1,"k":["ông mặt trời","ánh nắng","mặt
