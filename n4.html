ồi","vậy thì gay"]},{"w":"オリンピック","r":"オリンピック","m":"Thế vận hội Olympic","t":"n","k":["đại hội thể thao","thế vận hội mùa hè","Olympics"]},{"w":"元気","r":"げんき","m":"sức khỏe, sự khỏe khoắn (～がありません: không khỏe, uể oải)","t":"n","k":["khỏe mạnh","năng động","hăng hái","mệt mỏi"]},{"w":"胃","r":"い","m":"dạ dày","t":"n","cls":1,"k":["bao tử","đau dạ dày","bụng"]},{"w":"働きすぎ","r":"はたらきすぎ","m":"làm việc quá sức","t":"n","k":["làm quá nhiều","kiệt sức","làm việc quá độ"]},{"w":"ストレス","r":"ストレス","m":"căng thẳng, stress","t":"n","cls":1,"k":["áp lực","mệt mỏi","căng thẳng tinh thần"]},{"w":"無理をする","r":"むりをする","m":"làm quá sức","t":"v","g":3,"cls":1,"mw":"無理をします","mr":"むりをします","k":["cố quá","gắng sức","cố gắng quá mức"]},{"w":"ゆっくりする","r":"ゆっくりする","m":"nghỉ ngơi thong thả","t":"v","g":3,"mw":"ゆっくりします","mr":"ゆっくりします","k":["thư giãn","từ từ","thoải mái"]},{"w":"星占い","r":"ほしうらない","m":"bói sao, chiêm tinh","t":"n","k":["tử vi","cung hoàng đạo","xem bói","bói toán"]},{"w":"牡牛座","r":"おうしざ","m":"cung Kim Ngưu","t":"n","k":["chòm Kim Ngưu","cung hoàng đạo","Taurus","sinh tháng 5"]},{"w":"困る","r":"こまる","m":"khó xử, gặp rắc rối","t":"v","g":1,"mw":"困ります","mr":"こまります","k":["bối rối","lúng túng","gặp khó khăn","khốn đốn"]},{"w":"宝くじ","r":"たからくじ","m":"xổ số","t":"n","k":["vé số","lô tô","sổ xố"]},{"w":"当たる","r":"あたる","m":"trúng (宝くじが～: trúng xổ số)","t":"v","g":1,"mw":"当たります","mr":"あたります","k":["trúng thưởng","trúng số","trúng giải","đúng"]},{"w":"健康","r":"けんこう","m":"sức khỏe","t":"n","k":["khỏe mạnh","thể chất","sức khoẻ","lành mạnh"]},{"w":"恋愛","r":"れんあい","m":"tình yêu, yêu đương","t":"n","k":["tình cảm","hẹn hò","chuyện tình"]},{"w":"恋人","r":"こいびと","m":"người yêu","t":"n","k":["bạn trai","bạn gái","người thương","người tình"]},{"w":"［お］金持ち","r":"［お］かねもち","m":"người giàu","t":"n","k":["giàu có","đại gia","nhà giàu"]},{"w":"ひく","r":"ひく","m":"bị (cảm) (かぜを～: bị cảm)","t":"v","cls":1,"add":1,"g":1,"mw":"ひきます","mr":"ひきます","k":["cảm lạnh","mắc bệnh","nhiễm lạnh"]},{"w":"込む","r":"こむ","m":"đông, tắc (道が～: đường đông)","t":"v","cls":1,"add":1,"g":1,"mw":"込みます","mr":"こみます","k":["đông đúc","chật","kẹt xe","chen chúc"]},{"w":"すく","r":"すく","m":"vắng (道が～: đường vắng)","t":"v","cls":1,"add":1,"g":1,"mw":"すきます","mr":"すきます","k":["trống","thưa","thưa thớt"]},{"w":"出る","r":"でる","m":"tham gia (試合に～: thi đấu, ra sân)","t":"v","cls":1,"add":1,"g":2,"mw":"出ます","mr":"でます","k":["dự thi","tham dự","thi đấu cho","góp mặt","dự giải"]},{"w":"先生","r":"せんせい","m":"thầy/cô giáo; bác sĩ","t":"n","cls":1,"add":1,"k":["giáo viên","thầy giáo","giảng viên"]},{"w":"国際","r":"こくさい","m":"quốc tế","t":"n","cls":1,"add":1,"k":["toàn cầu","thế giới","giữa các nước","liên quốc gia"]},{"w":"たしかに","r":"たしかに","m":"quả thật, đúng là","t":"x","cls":1,"add":1,"k":["đúng vậy","chắc chắn","đúng thật","quả là"]}],"compare":[{"title":"でしょう vs かもしれません","points":[{"label":"〜でしょう","text":"Dự đoán có căn cứ, độ chắc cao (khoảng 70–80%). Hay đi với きっと, たぶん: 明日はたぶん晴れるでしょう。"},{"label":"〜かもしれません","text":"Chỉ nêu một khả năng, độ chắc thấp (khoảng 50% trở xuống). Hay đi với もしかしたら: もしかしたら雨が降るかもしれません。"}],"tip":"Nghiêng về 'chắc vậy' → でしょう; chỉ 'biết đâu đấy' → かもしれません."},{"title":"Vたほうがいい vs Vるほうがいい","points":[{"label":"Vたほうがいい","text":"Lời khuyên cụ thể cho một tình huống trước mắt, sắc thái mạnh: 顔色が悪いですよ。早く帰ったほうがいいです。"},{"label":"Vるほうがいい","text":"Nhận xét chung, so sánh hai lựa chọn, nhẹ hơn: 野菜は毎日食べるほうがいい。"}],"tip":"Khuyên một người cụ thể ngay lúc đó → dùng thể た."}],"quiz":[{"q":"風邪{かぜ}を引{ひ}いているなら、今日{きょう}は早{はや}く＿＿ほうがいいですよ。","options":["寝ない","寝よう","寝た","寝て"],"answer":2,"explain":"Khuyên nên làm: Vた + ほうがいいです → 寝たほうがいい (nên ngủ sớm). 寝ないほうがいい ngược nghĩa với ngữ cảnh đang bị cảm."},{"q":"明日{あした}は試験{しけん}だから、お酒{さけ}をたくさん＿＿ほうがいいです。","options":["飲まなかった","飲まない","飲んで","飲もう"],"answer":1,"explain":"Khuyên không nên: Vない + ほうがいい. Không dùng thể quá khứ phủ định 飲まなかった trong mẫu này."},{"q":"空{そら}が暗{くら}くなってきましたね。午後{ごご}はたぶん雨{あめ}＿＿。","options":["だでしょう","なでしょう","のでしょう","でしょう"],"answer":3,"explain":"Danh từ nối trực tiếp với でしょう (bỏ だ): 雨でしょう. だでしょう là lỗi phổ biến."},{"q":"もしかしたら、明日{あした}の会議{かいぎ}は＿＿かもしれません。","options":["中止だ","中止","中止な","中止の"],"answer":1,"explain":"N + かもしれません, không có だ: 中止かもしれません. 中止だかもしれません sai vì giữ だ."},{"q":"彼{かれ}は毎日{まいにち}5時間{じかん}練習{れんしゅう}しているから、＿＿優勝{ゆうしょう}するでしょう。","options":["まだ","もしかしたら","もう","きっと"],"answer":3,"explain":"Có căn cứ mạnh (luyện tập mỗi ngày) và kết bằng でしょう → dùng きっと (chắc chắn). もしかしたら đi với かもしれません, không hợp với でしょう ở đây."}]},{"lesson":33,"title":"Mệnh lệnh · Cấm chỉ · Truyền đạt lời nhắn","summary":"Học thể mệnh lệnh và thể cấm chỉ (dùng trên biển báo, khi cổ vũ thể thao, lời nói nam giới), cách hỏi cách đọc/ý nghĩa của chữ và cách truyền đạt lại lời người khác.","grammar":[{"pattern":"命令形 (thể mệnh lệnh)","meaning":"Hãy ~! (ra lệnh trực tiếp, mạnh)","form":"Nhóm I: -u → -e (行く→行け, 急ぐ→急げ, 止まる→止まれ); Nhóm II: bỏ る + ろ (食べる→食べろ, 起きる→起きろ); Nhóm III: する→しろ, 来る→こい","notes":"Rất mạnh, chủ yếu nam giới dùng với người dưới/bạn thân, trong tình huống khẩn cấp, khi cổ vũ thể thao (頑張れ!), hoặc trên biển báo giao thông (止まれ). Với người khác nên dùng 〜てください hoặc 〜なさい (cha mẹ nói với con).","examples":[{"ja":"もう8時{じ}だよ。早{はや}く起{お}きろ。","vi":"8 giờ rồi đấy. Dậy mau!"},{"ja":"あと少{すこ}しだ！頑張{がんば}れ！","vi":"Chỉ còn chút nữa thôi! Cố lên!"},{"ja":"道路{どうろ}に「止{と}まれ」と書{か}いてあります。","vi":"Trên đường có viết chữ 'Dừng lại'."}]},{"pattern":"禁止形 Vるな","meaning":"Không được ~! / Cấm ~!","form":"V thể từ điển + な (行くな, 食べるな, するな, 来るな)","notes":"Dùng trên biển báo, trong tình huống nguy hiểm, khi cổ vũ (負けるな!), hoặc lời nói nam giới thân mật. Lịch sự hơn thì dùng 〜ないでください.","examples":[{"ja":"危{あぶ}ないから、ここで泳{およ}ぐな。","vi":"Nguy hiểm, không được bơi ở đây!"},{"ja":"熱{あつ}いから、触{さわ}るな。","vi":"Nóng đấy, đừng có chạm vào!"},{"ja":"負{ま}けるな！最後{さいご}まで走{はし}れ！","vi":"Đừng thua! Chạy đến cùng đi!"}]},{"pattern":"XはYと読みます / XにはYと書いてあります","meaning":"X đọc là Y / Ở X có viết là Y","form":"N は「〜」と読みます; N に(は)「〜」と書いてあります","notes":"Dùng để hỏi hoặc giải thích cách đọc chữ, nội dung biển báo, giấy tờ. Câu hỏi: これは何と読みますか / 何と書いてありますか.","examples":[{"ja":"この漢字{かんじ}は「いりぐち」と読{よ}みます。","vi":"Chữ Hán này đọc là 'iriguchi'."},{"ja":"あの看板{かんばん}には「駐車禁止{ちゅうしゃきんし}」と書{か}いてあります。","vi":"Trên tấm biển kia có ghi 'Cấm đỗ xe'."},{"ja":"すみません、この紙{かみ}には何{なん}と書{か}いてありますか。","vi":"Xin lỗi, tờ giấy này viết gì vậy?"}]},{"pattern":"XはYという意味です","meaning":"X có nghĩa là Y","form":"N は + 普通形/「〜」 + という意味です; Câu hỏi: どういう意味ですか","notes":"Dùng để hỏi/giải thích ý nghĩa của từ, ký hiệu, biển báo. Phần Y thường là câu ở thể thường.","examples":[{"ja":"「立入禁止{たちいりきんし}」は入{はい}ってはいけないという意味{いみ}です。","vi":"'Tachiiri kinshi' nghĩa là không được vào."},{"ja":"このマークはどういう意味{いみ}ですか。","vi":"Ký hiệu này có nghĩa là gì?"},{"ja":"「使用中{しようちゅう}」は今{いま}だれかが使{つか}っているという意味{いみ}です。","vi":"'Shiyouchuu' nghĩa là bây giờ có người đang dùng."}]},{"pattern":"「〜」/ 普通形 + と言っていました","meaning":"(Ai đó) đã nói là ~ (truyền đạt lại lời người khác)","form":"N は「lời nguyên văn」と言っていました; N は + 普通形 + と言っていました","notes":"Dùng khi chuyển lời của người thứ ba cho người nghe. Khác với と言いました (chỉ kể lại sự việc đã nói): と言っていました nhấn mạnh nội dung lời nhắn vẫn còn ý nghĩa.","examples":[{"ja":"田中{たなか}さんは「明日{あした}は休{やす}みます」と言{い}っていました。","vi":"Anh Tanaka đã nói là 'Mai tôi nghỉ'."},{"ja":"部長{ぶちょう}は会議{かいぎ}に少{すこ}し遅{おく}れると言{い}っていました。","vi":"Trưởng phòng nói là sẽ đến họp muộn một chút."},{"ja":"先生{せんせい}は来週{らいしゅう}テストがあると言{い}っていましたよ。","vi":"Thầy đã nói là tuần sau có bài kiểm tra đấy."}]},{"pattern":"普通形 + と伝えていただけませんか","meaning":"Có thể nhắn giúp (ai đó) là ~ được không?","form":"N に + 普通形 + と伝えていただけませんか (Aな・N: + だと)","notes":"Cách nhờ chuyển lời lịch sự. Với danh từ và tính từ đuôi な phải có だ trước と: 休みだと, 無理だと.","examples":[{"ja":"すみませんが、山田{やまだ}さんに会議{かいぎ}は3時{じ}からだと伝{つた}えていただけませんか。","vi":"Xin lỗi, có thể nhắn với anh Yamada là cuộc họp bắt đầu từ 3 giờ được không?"},{"ja":"先生{せんせい}に、熱{ねつ}があるので明日{あした}は休{やす}むと伝{つた}えていただけませんか。","vi":"Có thể nhắn với thầy là tôi bị sốt nên mai xin nghỉ được không?"}]}],"vocab":[{"w":"逃げる","r":"にげる","m":"chạy trốn, bỏ chạy","t":"v","g":2,"cls":1,"mw":"逃げます","mr":"にげます","k":["bỏ trốn","tẩu thoát","chạy mất"]},{"w":"騒ぐ","r":"さわぐ","m":"làm ồn, ồn ào","t":"v","g":1,"cls":1,"mw":"騒ぎます","mr":"さわぎます","k":["ầm ĩ","quậy","om sòm","náo loạn","làm loạn"]},{"w":"あきらめる","r":"あきらめる","m":"từ bỏ","t":"v","g":2,"cls":1,"mw":"あきらめます","mr":"あきらめます","k":["bỏ cuộc","đầu hàng","buông bỏ"]},{"w":"投げる","r":"なげる","m":"ném","t":"v","g":2,"cls":1,"mw":"投げます","mr":"なげます","k":["quăng","liệng","vứt","ném bóng"]},{"w":"守る","r":"まもる","m":"giữ, tuân thủ, bảo vệ","t":"v","g":1,"cls":1,"mw":"守ります","mr":"まもります","k":["giữ gìn","tuân theo","chấp hành","giữ lời hứa"]},{"w":"上げる","r":"あげる","m":"nâng lên, tăng lên (tha)","t":"v","g":2,"mw":"上げます","mr":"あげます","k":["giơ lên","đưa lên","nâng cao"]},{"w":"下げる","r":"さげる","m":"hạ xuống, giảm xuống (tha)","t":"v","g":2,"mw":"下げます","mr":"さげます","k":["cúi xuống","hạ thấp","hạ giá","giảm bớt","kéo xuống"]},{"w":"伝える","r":"つたえる","m":"truyền đạt, nhắn lại","t":"v","g":2,"cls":1,"mw":"伝えます","mr":"つたえます","k":["chuyển lời","báo","truyền lại","thông báo"]},{"w":"注意する","r":"ちゅういする","m":"chú ý, cẩn thận","t":"v","g":3,"cls":1,"mw":"注意します","mr":"ちゅういします","k":["cẩn trọng","để ý","nhắc nhở","lưu ý","coi chừng"]},{"w":"外す","r":"はずす","m":"rời, tháo ra (席を～: rời chỗ ngồi)","t":"v","g":1,"cls":1,"mw":"外します","mr":"はずします","k":["tháo ra","bỏ ra","gỡ"]},{"w":"だめ","r":"だめ","m":"không được, hỏng","t":"a","cls":1,"k":["vô dụng","không ổn","hư","không thể","cấm"]},{"w":"席","r":"せき","m":"chỗ ngồi","t":"n","k":["ghế","ghế ngồi","chỗ trống"]},{"w":"ファイト","r":"ファイト","m":"Cố lên! (cổ vũ)","t":"x","k":["cố gắng","chiến đấu","tiến lên","quyết tâm"]},{"w":"マーク","r":"マーク","m":"dấu, ký hiệu","t":"n","cls":1,"k":["biểu tượng","dấu hiệu","nhãn hiệu","đánh dấu"]},{"w":"ボール","r":"ボール","m":"quả bóng","t":"n","cls":1,"k":["trái bóng","banh","quả banh"]},{"w":"洗濯機","r":"せんたくき","m":"máy giặt","t":"n","k":["máy giặt quần áo","giặt đồ","giặt quần áo","máy giặt đồ"]},{"w":"～機","r":"～き","m":"máy ~","t":"x","k":["máy móc","thiết bị","cỗ máy","máy bay"]},{"w":"規則","r":"きそく","m":"quy tắc","t":"n","cls":1,"k":["luật lệ","nội quy","quy định","điều lệ"]},{"w":"使用禁止","r":"しようきんし","m":"cấm sử dụng","t":"n","cls":1,"k":["không được dùng","cấm dùng","không sử dụng","hỏng"]},{"w":"立入禁止","r":"たちいりきんし","m":"cấm vào","t":"n","cls":1,"k":["không phận sự","khu vực cấm","không được vào"]},{"w":"入口","r":"いりぐち","m":"lối vào","t":"n","cls":1,"k":["cửa vào","cổng vào","lối đi vào"]},{"w":"出口","r":"でぐち","m":"lối ra","t":"n","cls":1,"k":["cửa ra","cổng ra","lối đi ra"]},{"w":"非常口","r":"ひじょうぐち","m":"lối thoát hiểm","t":"n","cls":1,"k":["cửa thoát hiểm","cửa khẩn cấp","lối thoát nạn"]},{"w":"無料","r":"むりょう","m":"miễn phí","t":"n","cls":1,"k":["không mất tiền","free","không tính phí"]},{"w":"本日休業","r":"ほんじつきゅうぎょう","m":"hôm nay nghỉ (đóng cửa)","t":"n","k":["nghỉ bán","tạm nghỉ","nghỉ hôm nay"]},{"w":"営業中","r":"えいぎょうちゅう","m":"đang mở cửa (kinh doanh)","t":"n","k":["đang bán","đang hoạt động","open"]},{"w":"使用中","r":"しようちゅう","m":"đang sử dụng","t":"n","cls":1,"k":["có người","đang dùng","bận"]},{"w":"～中","r":"～ちゅう","m":"đang ~","t":"x","cls":1,"k":["trong lúc","trong khi","đang làm"]},{"w":"どういう～","r":"どういう～","m":"~ như thế nào, ~ gì","t":"x","k":["kiểu gì","loại gì","ra sao"]},{"w":"もう","r":"もう","m":"(không) còn ~ nữa","t":"x","cls":1,"k":["không còn","hết rồi","không nữa","chẳng còn"]},{"w":"あと～","r":"あと～","m":"còn ~ nữa","t":"x","cls":1,"k":["thêm","chỉ còn","còn lại"]},{"w":"駐車違反","r":"ちゅうしゃいはん","m":"đỗ xe trái phép","t":"n","k":["đậu xe sai","đỗ xe sai","vi phạm đỗ xe","đậu xe trái phép"]},{"w":"そりゃあ","r":"そりゃあ","m":"thế thì, cái đó thì (khẩu ngữ của それは)","t":"x","k":["đương nhiên","tất nhiên rồi","cái này thì","chuyện đó thì"]},{"w":"～以内","r":"～いない","m":"trong vòng ~","t":"x","k":["không quá","trong khoảng","tối đa"]},{"w":"警察","r":"けいさつ","m":"cảnh sát","t":"n","cls":1,"k":["công an","cảnh sát viên","đồn cảnh sát"]},{"w":"罰金","r":"ばっきん","m":"tiền phạt","t":"n","k":["phạt tiền","bị phạt","nộp いました","points":[{"label":"〜と言いました","text":"Kể lại sự việc 'đã nói' một câu nào đó: 彼は「すみません」と言いました。"},{"label":"〜と言っていました","text":"Chuyển lời nhắn của người thứ ba cho người nghe, nội dung vẫn còn giá trị: 林さんは今日来ないと言っていました。"}],"tip":"Chuyển lời nhắn cho ai đó → と言っていました."}],"quiz":[{"q":"試合{しあい}で、選手{せんしゅ}に向{む}かって大{おお}きい声{こえ}で：「＿＿！」","options":["頑張るな","頑張り","頑張れ","頑張れば"],"answer":2,"explain":"Cổ vũ thể thao dùng thể mệnh lệnh: 頑張る (nhóm I) → 頑張れ. 頑張るな là thể cấm chỉ, nghĩa ngược lại."},{"q":"危{あぶ}ないから、この川{かわ}で＿＿。","options":["泳げ","泳ぐな","泳ごう","泳げる"],"answer":1,"explain":"Vì nguy hiểm nên cấm bơi: V thể từ điển + な → 泳ぐな. 泳げ là mệnh lệnh 'bơi đi', trái với ngữ cảnh; 泳ごう (rủ bơi) và 泳げる (bơi được) cũng mâu thuẫn với 危ないから."},{"q":"おい、早{はや}くこっちへ＿＿！","options":["来ろ","来れ","来た","来い"],"answer":3,"explain":"Thể mệnh lệnh của 来る là 来い (こい), là dạng bất quy tắc. 来ろ là lỗi do áp dụng cách chia nhóm II."},{"q":"このマークは「ここでたばこを吸{す}ってはいけない」という＿＿です。","options":["読み","書き","意味","言い"],"answer":2,"explain":"Giải thích ý nghĩa của ký hiệu: 〜という意味です. Các lựa chọn còn lại không tạo thành mẫu đúng."},{"q":"すみませんが、ミラーさんに会議{かいぎ}は2時{じ}から＿＿伝{つた}えていただけませんか。","options":["ので","だと","から","まで"],"answer":1,"explain":"Nội dung truyền đạt là câu thể thường kết thúc bằng danh từ nên cần だ + と: 2時からだと伝えて. Thiếu と thì không nối được với 伝える."}]},{"lesson":34,"title":"Làm theo đúng như · Sau khi · Cách thức hành động","summary":"Học cách nói làm đúng theo hướng dẫn (とおりに), sau khi làm gì (あとで), và cách diễn tả trạng thái kèm theo hoặc làm việc này thay vì việc kia (Vて / Vないで).","grammar":[{"pattern":"Vた / Vる / Nの + とおりに","meaning":"Làm đúng như ~, theo đúng ~","form":"V thể た + とおりに (đã nghe/thấy rồi làm theo); V thể từ điển + とおりに (sắp làm, hãy làm theo); N + の + とおりに (hoặc N + どおりに)","notes":"Thường đi với động từ như 言う, 書く, 見る, 説明する. Vるとおりに dùng khi người nói sắp làm mẫu: 今から私がするとおりにしてください.","examples":[{"ja":"私{わたし}が言{い}ったとおりに、書{か}いてください。","vi":"Hãy viết đúng như tôi đã nói."},{"ja":"説明書{せつめいしょ}のとおりに組{く}み立{た}てたら、うまくできました。","vi":"Lắp theo đúng sách hướng dẫn thì đã làm được ngon lành."},{"ja":"今{いま}から私{わたし}がやるとおりに、紙{かみ}を折{お}ってください。","vi":"Hãy gấp giấy theo đúng như tôi làm sau đây."}]},{"pattern":"Vた / Nの + あとで","meaning":"Sau khi ~","form":"V thể た + あとで; N + の + あとで","notes":"Nhấn mạnh thứ tự 'sau đó'. Khác Vてから (bài 16): てから nhấn mạnh làm A xong rồi mới làm B (A là điều kiện trước), còn あとで chỉ đơn giản 'vào lúc sau A'.","examples":[{"ja":"仕事{しごと}が終{お}わったあとで、飲{の}みに行{い}きませんか。","vi":"Sau khi xong việc, đi uống chút không?"},{"ja":"会議{かいぎ}のあとで、資料{しりょう}をメールで送{おく}ります。","vi":"Sau cuộc họp tôi sẽ gửi tài liệu qua email."},{"ja":"ご飯{はん}を食{た}べたあとで、薬{くすり}を飲{の}んでください。","vi":"Hãy uống thuốc sau khi ăn cơm."}]},{"pattern":"V1て / V1ないで + V2 (trạng thái kèm theo)","meaning":"Làm V2 trong trạng thái (có/không) V1","form":"V1 thể て + V2; V1 thể ない + で + V2","notes":"V1 chỉ cách thức, trạng thái khi làm V2 (mang ô, đeo kính, cho đường...). Chủ ngữ của V1 và V2 là một.","examples":[{"ja":"雨{あめ}が降{ふ}るかもしれないから、傘{かさ}を持{も}って出{で}かけます。","vi":"Có thể trời sẽ mưa nên tôi mang ô theo rồi ra ngoài."},{"ja":"父{ちち}は眼鏡{めがね}をかけて新聞{しんぶん}を読{よ}みます。","vi":"Bố tôi đeo kính đọc báo."},{"ja":"私{わたし}はいつも砂糖{さとう}を入{い}れないでコーヒーを飲{の}みます。","vi":"Tôi lúc nào cũng uống cà phê không đường."}]},{"pattern":"V1ないで + V2 (thay vì)","meaning":"Không làm V1 mà (thay vào đó) làm V2","form":"V1 thể ない + で + V2","notes":"Hai hành động là hai lựa chọn, chọn V2 thay cho V1. Không dùng 〜なくて trong trường hợp này (なくて ở bài 39 chỉ nguyên nhân).","examples":[{"ja":"日曜日{にちようび}はどこへも行{い}かないで、家{いえ}で休{やす}みました。","vi":"Chủ nhật tôi không đi đâu cả mà ở nhà nghỉ ngơi."},{"ja":"天気{てんき}がよかったので、バスに乗{の}らないで歩{ある}いて帰{かえ}りました。","vi":"Trời đẹp nên tôi không đi xe buýt mà đi bộ về."},{"ja":"エレベーターを使{つか}わないで、階段{かいだん}で上{のぼ}りましょう。","vi":"Đừng đi thang máy mà hãy leo cầu thang nhé."}]}],"vocab":[{"w":"磨く","r":"みがく","m":"đánh (răng), đánh bóng","t":"v","g":1,"cls":1,"mw":"磨きます","mr":"みがきます","k":["chải răng","đánh răng","làm bóng","chà","rèn luyện" nh phần","đồ nấu"]},{"w":"～分","r":"～ぶん","m":"phần (cho ~ người)","t":"x","k":["suất","khẩu phần","phần ăn"]},{"w":"鶏肉","r":"とりにく","m":"thịt gà","t":"n","k":["ức gà","thịt gà ta","đùi gà"]},{"w":"～グラム","r":"～グラム","m":"~ gam","t":"x","k":["gram","gờ ram","gờ-ram","đơn vị gam"]},{"w":"玉ねぎ","r":"たまねぎ","m":"hành tây","t":"n","k":["củ hành","hành củ","onion","hành củ tây"]},{"w":"４分の１","r":"よんぶんのいち","m":"một phần tư","t":"n","k":["1/4","một phần bốn","25%"]},{"w":"調味料","r":"ちょうみりょう","m":"gia vị","t":"n","k":["đồ gia vị","nêm nếm","gia vị nấu ăn"]},{"w":"なべ","r":"なべ","m":"cái nồi","t":"n","k":["xoong","chảo","nồi nấu"]},{"w":"火","r":"ひ","m":"lửa","t":"n","k":["ngọn lửa","bếp lửa","nhiệt"]},{"w":"火にかける","r":"ひにかける","m":"bắc lên bếp","t":"v","g":2,"mw":"火にかけます","mr":"ひにかけます","k":["đun","nấu","đặt lên lửa"]},{"w":"煮る","r":"にる","m":"nấu, ninh","t":"v","g":2,"mw":"煮ます","mr":"にます","k":["kho","hầm","luộc","nấu chín","om"]},{"w":"煮える","r":"にえる","m":"chín (tự)","t":"v","g":2,"mw":"煮えます","mr":"にえます","k":["nấu chín","được nấu chín","chín mềm"]},{"w":"どんぶり","r":"どんぶり","m":"bát tô (cơm)","t":"n","k":["bát cơm","cơm tô","donburi"]},{"w":"さす","r":"さす","m":"che, giương (かさを～: che ô)","t":"v","cls":1,"add":1,"g":1,"mw":"さします","mr":"さします","k":["giương ô","bung dù","che dù"]},{"w":"お客さん","r":"おきゃくさん","m":"khách","t":"n","cls":1,"add":1,"k":["quý khách","khách mời","người khách"]}],"compare":[{"title":"Vたあとで vs Vてから","points":[{"label":"Vたあとで","text":"Chỉ thời điểm 'sau khi A', A và B có thể cách nhau một khoảng: 授業が終わったあとで、友達と会います。"},{"label":"Vてから","text":"Nhấn mạnh phải làm A trước rồi mới làm B, A là bước chuẩn bị: 手を洗ってから、食べてください。"}],"tip":"Nhấn 'làm A trước đã' → てから; chỉ nói 'sau A' → あとで."},{"title":"V1ないでV2 vs V1なくて (bài 39)","points":[{"label":"〜ないで","text":"Trạng thái kèm theo hoặc 'thay vì': 朝ご飯を食べないで会社へ行きました。(không ăn sáng mà đi làm)"},{"label":"〜なくて","text":"Chỉ nguyên nhân dẫn đến cảm xúc/kết quả: 彼が来なくて、心配しました。(anh ấy không đến nên lo)"}],"tip":"Hai hành động của cùng một người → ないで; nguyên nhân → なくて."}],"quiz":[{"q":"この図{ず}の＿＿、紙{かみ}を折{お}ってください。","options":["あとで","ために","とおりに","ないで"],"answer":2,"explain":"Làm đúng theo hình vẽ: Nの + とおりに. 図のあとで (sau hình vẽ) không có nghĩa trong ngữ cảnh này."},{"q":"授業{じゅぎょう}の＿＿、図書館{としょかん}で勉強{べんきょう}します。","options":["とおりに","まえで","てから","あとで"],"answer":3,"explain":"N + の + あとで: sau giờ học. てから phải đi sau động từ thể て, không đi sau 'Nの'."},{"q":"昨日{きのう}はとても疲{つか}れていたので、歯{は}を＿＿寝{ね}てしまいました。","options":["磨かなくて","磨かないで","磨かなかった","磨かない"],"answer":1,"explain":"Ngủ trong trạng thái không đánh răng: V1ないで + V2. 磨かなくて chỉ nguyên nhân, không diễn tả trạng thái kèm theo."},{"q":"天気{てんき}がよかったので、バスに＿＿、歩{ある}いて帰{かえ}りました。","options":["乗って","乗らなくて","乗るとおりに","乗らないで"],"answer":3,"explain":"'Không đi xe buýt mà đi bộ' (thay vì): V1ないで + V2. 乗らなくて mang nghĩa nguyên nhân nên không phù hợp."},{"q":"この魚{さかな}は醤油{しょうゆ}を＿＿食{た}べてください。","options":["付けて","付けるので","付けるとおりに","付けよう"],"answer":0,"explain":"Cách thức khi ăn: chấm nước tương rồi ăn → V1て + V2. 付けるとおりに (đúng như chấm) không có nghĩa."}]},{"lesson":35,"title":"Thể điều kiện ば · Nなら · Càng ~ càng","summary":"Học thể điều kiện ば của động từ, tính từ, danh từ; cách dùng Nなら khi nhận chủ đề từ người nghe; hỏi xin chỉ dẫn (どうすればいいですか) và mẫu 'càng ~ càng ~'.","grammar":[{"pattern":"条件形 (thể điều kiện ば)","meaning":"Nếu ~ thì ~ (điều kiện cần để vế sau xảy ra)","form":"Nhóm I: -u → -eba (行く→行けば, 読む→読めば); Nhóm II: bỏ る + れば (食べる→食べれば); Nhóm III: する→すれば, 来る→くれば; Vない→Vなければ; Aい: bỏ い + ければ (安い→安ければ, いい→よければ); Aな・N: + なら(ば) (暇なら, 雨なら)","notes":"Khi vế trước là động từ hành động (có ý chí) và cùng chủ ngữ, vế sau thường không dùng ý chí, nhờ vả, rủ rê; khi đó dùng たら. Nếu vế trước là tính từ, ある, できる... thì vế sau dùng ý chí được: 安ければ買います.","examples":[{"ja":"このボタンを押{お}せば、窓{まど}が開{あ}きます。","vi":"Nếu bấm nút này thì cửa sổ sẽ mở."},{"ja":"天気{てんき}がよければ、ここから富士山{ふじさん}が見{み}えます。","vi":"Nếu trời đẹp thì từ đây có thể nhìn thấy núi Phú Sĩ."},{"ja":"急{いそ}がなければ、電車{でんしゃ}に間{ま}に合{あ}いませんよ。","vi":"Nếu không nhanh lên thì sẽ không kịp tàu đâu."}]},{"pattern":"N + なら","meaning":"Nếu là ~ thì / Nói về ~ thì (nhận chủ đề người nghe vừa nêu rồi đưa thông tin, lời khuyên)","form":"N + なら, 〜","notes":"Dùng khi người nghe vừa nhắc đến một chủ đề, người nói tiếp lời và đưa ra gợi ý, thông tin liên quan.","examples":[{"ja":"A：パソコンを買{か}いたいんですが。B：パソコンなら、駅前{えきまえ}の店{みせ}が安{やす}いですよ。","vi":"A: Tôi muốn mua máy tính. B: Máy tính thì cửa hàng trước ga rẻ đấy."},{"ja":"A：週末{しゅうまつ}、温泉{おんせん}に行{い}きたいです。B：温泉{おんせん}なら、箱根{はこね}がいいですよ。","vi":"A: Cuối tuần tôi muốn đi suối nước nóng. B: Suối nước nóng thì Hakone hay đấy."},{"ja":"A：田中{たなか}さんはいますか。B：田中{たなか}さんなら、さっき帰{かえ}りましたよ。","vi":"A: Anh Tanaka có đây không? B: Anh Tanaka thì vừa về lúc nãy rồi."}]},{"pattern":"疑問詞 + Vば いいですか","meaning":"Nên ~ (thế nào / ở đâu / lúc nào...) thì được? (xin chỉ dẫn, lời khuyên)","form":"疑問詞 (どう, どこ, 何, いつ...) + V thể ば + いいですか","notes":"Dùng khi không biết cách làm và muốn hỏi người khác. Trả lời thường bằng 〜ばいいです hoặc 〜てください.","examples":[{"ja":"パスワードを忘{わす}れてしまいました。どうすればいいですか。","vi":"Tôi lỡ quên mật khẩu rồi. Phải làm sao bây giờ?"},{"ja":"すみません、切符{きっぷ}はどこで買{か}えばいいですか。","vi":"Xin lỗi, mua vé ở đâu thì được ạ?"},{"ja":"明日{あした}は何時{なんじ}に来{く}ればいいですか。","vi":"Ngày mai tôi nên đến lúc mấy giờ?"}]},{"pattern":"〜ば 〜ほど","meaning":"Càng ~ càng ~","form":"Vば + Vる + ほど; Aければ + Aい + ほど; Aななら + Aな + ほど","notes":"Lặp lại cùng một từ hai lần: lần đầu ở thể ば, lần sau ở thể từ điển. Với tính từ đuôi な: 静かなら静かなほど.","examples":[{"ja":"日本語{にほんご}は練習{れんしゅう}すればするほど、上手{じょうず}になります。","vi":"Tiếng Nhật càng luyện càng giỏi."},{"ja":"魚{さかな}は新{あたら}しければ新{あたら}しいほどおいしいです。","vi":"Cá càng tươi càng ngon."},{"ja":"使{つか}い方{かた}は簡単{かんたん}なら簡単{かんたん}なほどいいです。","vi":"Cách sử dụng càng đơn giản càng tốt."}]}],"vocab":[{"w":"咲く","r":"さく","m":"(hoa) nở","t":"v","g":1,"cls":1,"mw":"咲きます","mr":"さきます","k":["nở hoa","hoa nở","đơm hoa"]},{"w":"変わる","r":"かわる","m":"thay đổi (tự)","t":"v","g":1,"cls":1,"mw":"変わります","mr":"かわります","k":["biến đổi","khác đi","đổi khác"]},{"w":"困る","r":"こまる","m":"khó xử, gặp rắc rối","t":"v","g":1,"cls":1,"mw":"困ります","mr":"こまります","k":["bối rối","lúng túng","gặp khó khăn","khốn đốn"]},{"w":"付ける","r":"つける","m":"đánh dấu (丸を～: khoanh tròn)","t":"v","g":2,"cls":1,"mw":"付けます","mr":"つけます","k":["đính","dán","lắp","đeo","gắn thêm"]},{"w":"拾う","r":"ひろう","m":"nhặt","t":"v","g":1,"mw":"拾います","mr":"ひろいます","k":["lượm","nhặt lên","nhặt được"]},{"w":"かかる","r":"かかる","m":"có (điện thoại) (電話が～: có điện thoại gọi đến)","t":"v","g":1,"mw":"かかります","mr":"かかります","k":["có cuộc gọi","điện thoại đến","cuộc gọi đến","điện thoại reo","có người gọi"]},{"w":"楽","r":"らく","m":"nhàn, thoải mái, dễ dàng","t":"a","k":["nhẹ nhàng","nhàn hạ","nhàn nhã","thong thả","đơn giản"]},{"w":"正しい","r":"ただしい","m":"đúng, chính xác","t":"a","cls":1,"k":["đúng đắn","chuẩn","chuẩn xác","hợp lý"]},{"w":"珍しい","r":"めずらしい","m":"hiếm, lạ","t":"a","k":["hiếm có","hiếm thấy","độc đáo"]},{"w":"方","r":"かた","m":"vị, người (kính ngữ)","t":"n","k":["ngài","quý vị","vị khách"]},{"w":"向こう","r":"むこう","m":"phía bên kia","t":"n","cls":1,"k":["đằng kia","phía đối diện","bên đó","nước ngoài"]},{"w":"島","r":"しま","m":"hòn đảo","t":"n","cls":1,"k":["quần đảo","hải đảo","cù lao"]},{"w":"村","r":"むら","m":"làng","t":"n","k":["thôn","làng quê","nông thôn"]},{"w":"港","r":"みなと","m":"cảng","t":"n","cls":1,"k":["bến cảng","hải cảng","bến tàu"]},{"w":"近所","r":"きんじょ","m":"hàng xóm, khu lân cận","t":"n","cls":1,"k":["láng giềng","xung quanh","gần nhà"]},{"w":"屋上","r":"おくじょう","m":"sân thượng","t":"n","cls":1,"k":["mái nhà","nóc nhà","trên sân thượng"]},{"w":"海外","r":"かいがい","m":"nước ngoài","t":"n","cls":1,"k":["ngoại quốc","quốc tế","hải ngoại"]},{"w":"山登り","r":"やまのぼり","m":"leo núi","t":"n","cls":1,"k":["đi núi","trekking","chinh phục núi"]},{"w":"ハイキング","r":"ハイキング","m":"đi bộ dã ngoại (hiking)","t":"n","k":["đi bộ đường dài","đi bộ đường núi","picnic"]},{"w":"機会","r":"きかい","m":"cơ hội","t":"n","cls":1,"k":["dịp","cơ hội tốt","thời cơ"]},{"w":"許可","r":"きょか","m":"sự cho phép","t":"n","cls":1,"k":["giấy phép","đồng ý","chấp thuận"]},{"w":"丸","r":"まる","m":"vòng tròn","t":"n","cls":1,"k":["hình tròn","khoanh tròn","dấu tròn"]},{"w":"操作","r":"そうさ","m":"thao tác, vận hành","t":"n","k":["điều khiển","sử dụng","vận hành máy","cách dùng"]},{"w":"方法","r":"ほうほう","m":"phương pháp, cách","t":"n","k":["cách làm","cách thức","phương thức","biện pháp"]},{"w":"設備","r":"せつび","m":"thiết bị, trang bị","t":"n","cls":1,"k":["trang thiết bị","cơ sở vật chất","tiện nghi"]},{"w":"カーテン","r":"カーテン","m":"rèm cửa","t":"n","cls":1,"k":["màn cửa","rèm che","màn"]},{"w":"ひも","r":"ひも","m":"sợi dây","t":"n","cls":1,"k":["dây buộc","dây thừng","dây giày"]},{"w":"ふた","r":"ふた","m":"cái nắp","t":"n","k":["nắp đậy","vung","nắp chai"]},{"w":"葉","r":"は","m":"lá cây","t":"n","cls":1,"k":["chiếc lá","lá xanh","tán lá"]},{"w":"曲","r":"きょく","m":"bản nhạc, ca khúc","t":"n","k":["bài hát","bài nhạc","giai điệu"]},{"w":"楽しみ","r":"たのしみ","m":"niềm vui, điều mong đợi","t":"n","k":["mong chờ","háo hức","trông đợi","thú vui"]},{"w":"もっと","r":"もっと","m":"hơn nữa","t":"x","cls":1,"k":["thêm nữa","nhiều hơn","thêm"]},{"w":"初めに","r":"はじめに","m":"trước tiên, đầu tiên","t":"x","k":["trước hết","lúc đầu","mở đầu"]},{"w":"これで終わります","r":"これでおわります","m":"Đến đây là kết thúc","t":"e","k":["xin hết","đến đây là hết","xong"]},{"w":"それなら","r":"それなら","m":"nếu thế thì","t":"x","k":["vậy thì","nếu vậy","vậy"]},{"w":"夜行バス","r":"やこうバス","m":"xe buýt đêm","t":"n","k":["xe khách đêm","xe đêm","xe buýt chạy đêm","xe giường nằm"]},{"w":"旅行社","r":"りょこうしゃ","m":"công ty du lịch","t":"n","k":["đại lý du lịch","hãng lữ hành","đại lý vé"]},{"w":"詳しい","r":"くわしい","m":"chi tiết, rành","t":"a","k":["tường tận","rành rọt","am hiểu","thông thạo"]},{"w":"スキー場","r":"スキーじょう","m":"khu trượt tuyết","t":"n","k":["sân trượt tuyết","ski","bãi trượt tuyết"]},{"w":"朱","r":"しゅ","m":"màu đỏ son","t":"n","k":["màu son","đỏ thắm","đỏ cam"]},{"w":"交わる","r":"まじわる","m":"giao du, kết giao","t":"v","g":1,"mw":"交わります","mr":"まじわります","k":["kết bạn","giao lưu","chơi với"]},{"w":"ことわざ","r":"ことわざ","m":"tục ngữ","t":"n","k":["thành ngữ","châm ngôn","câu nói xưa"]},{"w":"仲よくする","r":"なかよくする","m":"hòa thuận, thân thiết","t":"v","g":3,"mw":"仲よくします","mr":"なかよくします","k":["thân thiện","chơi thân","hòa hợp"]},{"w":"必要","r":"ひつよう","m":"cần thiết","t":"a","k":["thiết yếu","quan trọng","bắt buộc","cần có"]},{"w":"治る","r":"なおる","m":"khỏi (tự) (病気が～: khỏi bệnh)","t":"v","cls":1,"add":1,"g":1,"mw":"治ります","mr":"なおります","k":["lành bệnh","bình phục","hồi phục","khỏe lại"]},{"w":"直る","r":"なおる","m":"được sửa (tự) (故障が～: hết hỏng)","t":"v","cls":1,"add":1,"g":1,"mw":"直ります","mr":"なおります","k":["sửa xong","chạy lại","hoạt động lại"]},{"w":"クリックする","r":"クリックする","m":"nhấp chuột, click","t":"v","cls":1,"add":1,"g":3,"mw":"クリックします","mr":"クリックします","k":["bấm","nhấn","bấm chuột"]},{"w":"入力する","r":"にゅうりょくする","m":"nhập (dữ liệu)","t":"v","cls":1,"add":1,"g":3,"mw":"入力します","mr":"にゅうりょくします","k":["gõ","điền","nhập liệu","đánh máy"]},{"w":"歴史","r":"れきし","m":"lịch sử","t":"n","cls":1,"add":1,"k":["quá khứ","sử học","môn sử"]},{"w":"レバー","r":"レバー","m":"cần gạt","t":"n","cls":1,"add":1,"k":["tay gạt","cần số","tay cầm"]},{"w":"キー","r":"キー","m":"phím","t":"n","cls":1,"add":1,"k":["phím bấm","bàn phím","khóa xe","nút bấm"]},{"w":"炊飯器","r":"すいはんき","m":"nồi cơm điện","t":"n","cls":1,"add":1,"k":["nấu cơm","nồi điện","nồi nấu cơm"]},{"w":"昔","r":"むかし","m":"ngày xưa","t":"n","cls":1,"add":1,"k":["xưa","ngày trước","hồi xưa","thời xưa"]},{"w":"自動販売機","r":"じどうはんばいき","m":"máy bán hàng tự động","t":"n","cls":1,"add":1,"k":["máy bán nước","máy bán đồ","máy tự động"]}],"compare":[{"title":"ば vs たら vs と vs なら","points":[{"label":"〜と","text":"Kết quả tất yếu, tự nhiên hoặc máy móc, lần nào cũng vậy. Vế sau không dùng ý chí, nhờ vả: 春になると、桜が咲きます。"},{"label":"〜ば","text":"Nhấn mạnh điều kiện cần để có kết quả. Vế trước là động từ hành động thì vế sau hạn chế ý chí/nhờ vả: 練習すれば、できるようになります。"},{"label":"〜たら","text":"Dùng rộng nhất; vế sau dùng được ý chí, nhờ vả, rủ rê; còn có nghĩa 'sau khi ~ xong thì': 駅に着いたら、電話してください。"},{"label":"〜なら","text":"Tiếp nhận chủ đề/thông tin từ người nghe rồi đưa ý kiến, lời khuyên; hành động ở vế sau có thể xảy ra trước: 日本へ行くなら、JRパスを買ったほうがいいですよ。"}],"tip":"Phân vân thì dùng たら (an toàn nhất); nhận lời người khác để khuyên → なら."}],"quiz":[{"q":"8時{じ}までに＿＿、間{ま}に合{あ}いますよ。(来{く}る)","options":["くるば","きれば","くれば","こいば"],"answer":2,"explain":"Thể ば của 来る là 来れば (くれば). きれば là lỗi do nhầm với thể ます (きます)."},{"q":"天気{てんき}が＿＿、明日{あした}は海{うみ}へ行{い}きます。","options":["いければ","よければ","いいば","よいれば"],"answer":1,"explain":"いい là bất quy tắc, chia từ よい: よい→よければ. いければ là lỗi thường gặp."},{"q":"A：京都{きょうと}へ行{い}きたいんですが…。B：京都{きょうと}＿＿、秋{あき}がいちばんきれいですよ。","options":["ば","と","なら","たら"],"answer":2,"explain":"Tiếp nhận chủ đề người nghe vừa nêu rồi đưa lời khuyên: N + なら. Danh từ không nối trực tiếp với ば hay たら (phải là 京都だったら)."},{"q":"このコピー機{き}の使{つか}い方{かた}が分{わ}かりません。どう＿＿いいですか。","options":["しないで","すれ","するなら","すれば"],"answer":3,"explain":"Hỏi xin chỉ dẫn: どう + Vば + いいですか → どうすればいいですか. すれ là dạng chưa hoàn chỉnh, thiếu ば."},{"q":"日本語{にほんご}は勉強{べんきょう}＿＿するほど、おもしろくなります。","options":["したら","すれば","すると","しても"],"answer":1,"explain":"Mẫu 'càng ~ càng': Vば + Vる + ほど → 勉強すればするほど. Mẫu này chỉ dùng thể ば, không dùng たら hay と."}]},{"lesson":36,"title":"Mục tiêu · Thay đổi khả năng, thói quen · Cố gắng","summary":"Bài 36 dạy cách nói mục đích với động từ không ý chí (〜ように), sự thay đổi dần về khả năng/thói quen (〜ようになります) và việc cố gắng duy trì một hành động (〜ようにします).","grammar":[{"pattern":"Vる / Vない + ように、V2","meaning":"Để (có thể / không) ~ thì làm V2 — chỉ mục tiêu, trạng thái mong muốn","form":"V thể từ điển (thường là thể khả năng, わかる, 見える, 聞こえる, なる) / Vない + ように","notes":"V1 là động từ không ý chí hoặc thể khả năng, hay thể phủ định. Chủ ngữ của V1 và V2 có thể khác nhau.","examples":[{"ja":"忘{わす}れないように、手帳{てちょう}に書{か}いておきます。","vi":"Để không quên, tôi ghi sẵn vào sổ tay."},{"ja":"後{うし}ろの人{ひと}にも聞{き}こえるように、大{おお}きい声{こえ}で話{はな}してください。","vi":"Hãy nói to để người phía sau cũng nghe được."},{"ja":"上手{じょうず}に泳{およ}げるように、毎週{まいしゅう}プールへ行{い}っています。","vi":"Để bơi giỏi, tuần nào tôi cũng đi bể bơi."}]},{"pattern":"Vる + ようになります / Vない → なくなります","meaning":"Trở nên (có thể / có thói quen) ~; không còn ~ nữa","form":"V thể từ điển (thường là thể khả năng) + ようになります; Vない bỏ い + くなります","notes":"Diễn tả thay đổi diễn ra dần dần. Hỏi もう〜ようになりましたか, trả lời phủ định: いいえ、まだ〜ません.","examples":[{"ja":"毎日{まいにち}練習{れんしゅう}して、やっと漢字{かんじ}が書{か}けるようになりました。","vi":"Luyện tập mỗi ngày, cuối cùng tôi đã viết được chữ Hán."},{"ja":"日本{にほん}に来{き}てから、納豆{なっとう}を食{た}べるようになりました。","vi":"Từ khi sang Nhật, tôi đã bắt đầu ăn natto."},{"ja":"最近{さいきん}、子{こ}どもが野菜{やさい}を食{た}べなくなりました。","vi":"Dạo này con tôi không còn ăn rau nữa."}]},{"pattern":"Vる / Vない + ようにします / ようにしてください","meaning":"Cố gắng (để) làm / không làm ~ (thành thói quen); nhờ ai đó chú ý làm ~","form":"V thể từ điển / Vない + ようにします; ようにしています (đang duy trì); ようにしてください (nhờ, nhắc)","notes":"ようにしています nói về thói quen đang cố duy trì. ようにしてください mềm hơn 〜てください, thường dùng để nhắc nhở.","examples":[{"ja":"毎朝{まいあさ}、30分{ぷん}歩{ある}くようにしています。","vi":"Mỗi sáng tôi cố gắng đi bộ 30 phút."},{"ja":"甘{あま}い物{もの}を食{た}べないようにしています。","vi":"Tôi cố gắng không ăn đồ ngọt."},{"ja":"明日{あした}は遅{おく}れないようにしてください。","vi":"Ngày mai nhớ đừng đến muộn nhé."}]}],"vocab":[{"w":"届く","r":"とどく","m":"(đồ, thư) đến nơi; với tới","t":"v","g":1,"mw":"届きます","mr":"とどきます","k":["nhận được","gửi đến","giao đến"]},{"w":"出る","r":"でる","m":"tham gia, ra (thi đấu) (試合に～: tham gia trận đấu)","t":"v","g":2,"mw":"出ます","mr":"でます","k":["dự thi","tham dự","thi đấu cho","góp mặt","dự giải"]},{"w":"打つ","r":"うつ","m":"đánh (máy) (ワープロを～: đánh máy)","t":"v","g":1,"mw":"打ちます","mr":"うちます","k":["gõ","đập","đấm"]},{"w":"貯金する","r":"ちょきんする","m":"tiết kiệm tiền, để dành tiền","t":"v","g":3,"cls":1,"mw":"貯金します","mr":"ちょきんします","k":["dành dụm","gửi tiết kiệm","bỏ ống heo"]},{"w":"太る","r":"ふとる","m":"béo lên","t":"v","g":1,"mw":"太ります","mr":"ふとります","k":["mập lên","tăng cân","mập"]},{"w":"やせる","r":"やせる","m":"gầy đi","t":"v","g":2,"mw":"やせます","mr":"やせます","k":["giảm cân","ốm đi","sụt cân"]},{"w":"過ぎる","r":"すぎる","m":"quá (giờ), trôi qua (7時を過ぎる)","t":"v","g":2,"cls":1,"mw":"過ぎます","mr":"すぎます","k":["đi qua","quá giờ","hơn"]},{"w":"慣れる","r":"なれる","m":"quen với (仕事に慣れる)","t":"v","g":2,"cls":1,"mw":"慣れます","mr":"なれます","k":["làm quen","thích nghi","quen dần"]},{"w":"硬い","r":"かたい","m":"cứng","t":"a","k":["rắn","cứng rắn","chắc","cứng nhắc"]},{"w":"軟らかい","r":"やわらかい","m":"mềm","t":"a","k":["mềm mại","dẻo","mềm mịn"]},{"w":"電子～","r":"でんし～","m":"~ điện tử","t":"x","k":["đồ điện tử","từ điển điện tử","thiết bị điện tử"]},{"w":"携帯～","r":"けいたい～","m":"~ cầm tay, ~ di động","t":"x","k":["điện thoại di động","mang theo","xách tay"]},{"w":"工場","r":"こうじょう","m":"nhà máy","t":"n","k":["xưởng","công xưởng","xí nghiệp"]},{"w":"健康","r":"けんこう","m":"sức khỏe","t":"n","k":["khỏe mạnh","thể chất","sức khoẻ","lành mạnh"]},{"w":"剣道","r":"けんどう","m":"kiếm đạo","t":"n","cls":1,"k":["kendo","đấu kiếm","võ kiếm"]},{"w":"毎週","r":"まいしゅう","m":"hằng tuần","t":"n","cls":1,"k":["mỗi tuần","tuần nào cũng","hàng tuần"]},{"w":"毎月","r":"まいつき","m":"hằng tháng","t":"n","cls":1,"k":["mỗi tháng","tháng nào cũng","hàng tháng"]},{"w":"毎年","r":"まいとし","m":"hằng năm","t":"n","cls":1,"k":["mỗi năm","năm nào cũng","hàng năm"]},{"w":"やっと","r":"やっと","m":"cuối cùng thì, mãi mới","t":"x","cls":1,"k":["rốt cuộc","mãi rồi cũng","sau cùng"]},{"w":"かなり","r":"かなり","m":"khá, tương đối","t":"x","cls":1,"k":["khá là","kha khá","đáng kể"]},{"w":"必ず","r":"かならず","m":"nhất định, chắc chắn","t":"x","cls":1,"k":["luôn luôn","bằng mọi giá","chắc chắn sẽ"]},{"w":"絶対に","r":"ぜったいに","m":"tuyệt đối","t":"x","cls":1,"k":["nhất định","chắc chắn","hoàn toàn"]},{"w":"上手に","r":"じょうずに","m":"giỏi, khéo","t":"x","cls":1,"k":["khéo léo","thành thạo","tốt"]},{"w":"できるだけ","r":"できるだけ","m":"cố hết mức có thể","t":"x","cls":1,"k":["hết sức","trong khả năng","tối đa"]},{"w":"このごろ","r":"このごろ","m":"dạo này","t":"x","cls":1,"k":["dạo gần đây","gần đây","thời gian này"]},{"w":"そのほうが～","r":"そのほうが～","m":"như thế thì ~ hơn","t":"e","k":["như thế hơn","thế thì tốt hơn","làm vậy hơn"]},{"w":"お客様","r":"おきゃくさま","m":"quý khách","t":"n","k":["khách hàng","thượng đế","khách quý"]},{"w":"特別","r":"とくべつ","m":"đặc biệt","t":"a","k":["riêng biệt","khác thường","ngoại lệ"]},{"w":"していらっしゃいます","r":"していらっしゃいます","m":"đang làm (tôn kính của しています)","t":"e","k":["kính ngữ","đang làm việc","tôn kính ngữ"]},{"w":"水泳","r":"すいえい","m":"bơi lội","t":"n","k":["môn bơi","đi bơi","môn bơi lội"]},{"w":"～とか、～とか","r":"～とか、～とか","m":"nào là ~, nào là ~","t":"x","k":["chẳng hạn","như là","ví dụ"]},{"w":"タンゴ","r":"タンゴ","m":"điệu tango","t":"n","k":["nhảy tango","khiêu vũ","nhảy"]},{"w":"チャレンジする","r":"チャレンジする","m":"thử thách, thử sức","t":"v","g":3,"mw":"チャレンジします","mr":"チャレンジします","k":["thách thức","challenge","dám thử"]},{"w":"気持ち","r":"きもち","m":"tâm trạng, cảm giác","t":"n","k":["cảm xúc","tấm lòng","tinh thần"]},{"w":"乗り物","r":"のりもの","m":"phương tiện giao thông","t":"n","k":["xe cộ","phương tiện đi lại","đồ chơi cưỡi"]},{"w":"歴史","r":"れきし","m":"lịch sử","t":"n","k":["quá khứ","sử học","môn sử"]},{"w":"～世紀","r":"～せいき","m":"thế kỷ ~","t":"x","k":["thế kỉ"]},{"w":"遠く","r":"とおく","m":"nơi xa","t":"n","k":["chỗ xa","đằng xa","phương xa"]},{"w":"汽車","r":"きしゃ","m":"tàu hỏa (chạy hơi nước)","t":"n","k":["tàu hơi nước","xe lửa","tàu lửa"]},{"w":"汽船","r":"きせん","m":"tàu thủy (chạy hơi nước)","t":"n","k":["tàu hơi nước","tàu biển","tàu thuyền"]},{"w":"大勢の～","r":"おおぜいの～","m":"nhiều ~ (người)","t":"x","k":["nhiều người","đông người","đông đảo","rất nhiều"]},{"w":"運ぶ","r":"はこぶ","m":"vận chuyển, mang","t":"v","g":1,"mw":"運びます","mr":"はこびます","k":["chở","mang đi","khuân","vận tải","chuyên chở"]},{"w":"安全","r":"あんぜん","m":"an toàn","t":"a","k":["bình an","yên ổn","không nguy hiểm"]},{"w":"飛ぶ","r":"とぶ","m":"bay","t":"v","g":1,"mw":"飛びます","mr":"とびます","k":["bay lượn","bay lên","bay đi"]},{"w":"宇宙","r":"うちゅう","m":"vũ trụ","t":"n","cls":1,"k":["không gian","ngoài vũ trụ","vũ trụ bao la"]},{"w":"地球","r":"ちきゅう","m":"Trái Đất","t":"n","k":["địa cầu","quả đất","hành tinh"]},{"w":"あう","r":"あう","m":"gặp (tai nạn) (事故に～: gặp tai nạn)","t":"v","cls":1,"add":1,"g":1,"mw":"あいます","mr":"あいます","k":["gặp phải","bị tai nạn","gặp sự cố","gặp nạn"]},{"w":"腐る","r":"くさる","m":"bị thối, hỏng (食べ物が～: đồ ăn bị hỏng)","t":"v","cls":1,"add":1,"g":1,"mw":"腐ります","mr":"くさります","k":["ôi thiu","hư","bị ôi"]},{"w":"柔道","r":"じゅうどう","m":"judo, nhu đạo","t":"n","cls":1,"add":1,"k":["võ judo","võ Nhật","võ Nhu đạo","môn judo"]},{"w":"ラッシュ","r":"ラッシュ","m":"giờ cao điểm","t":"n","cls":1,"add":1,"k":["giờ tan tầm","kẹt xe","đông đúc"]},{"w":"曲","r":"きょく","m":"bản nhạc, bài hát","t":"n","cls":1,"add":1,"k":["bài hát","bài nhạc","giai điệu"]},{"w":"ほとんど","r":"ほとんど","m":"hầu hết, hầu như","t":"x","cls":1,"add":1,"k":["gần như","phần lớn","đa số"]}],"compare":[{"title":"〜ように vs 〜ために (bài 42)","points":[{"label":"〜ように","text":"Đi với động từ không ý chí, thể khả năng hoặc Vない; chủ ngữ hai vế có thể khác nhau. Ví dụ: 子どもにも分かるように、易しく書きます。"},{"label":"〜ために","text":"Đi với động từ có ý chí (V thể từ điển) hoặc Nの; chủ ngữ hai vế giống nhau, mục đích rõ ràng. Ví dụ: 家を買うために、貯金しています。"}],"tip":"Thể khả năng (読める, 話せる) hay ない → ように; hành động mình chủ động quyết làm → ために."}],"quiz":[{"q":"日本語{にほんご}の新聞{しんぶん}が読{よ}める＿＿、毎日{まいにち}漢字{かんじ}を勉強{べんきょう}しています。","options":["ために","ように","ことに","までに"],"answer":1,"explain":"読める là thể khả năng (không ý chí) nên dùng ように. ために chỉ đi với động từ có ý chí như 読む."},{"q":"3か月{げつ}練習{れんしゅう}して、ギターが弾{ひ}ける＿＿。","options":["ようになりました","ようにしました","ようにしています","ことになりました"],"answer":0,"explain":"Sau một thời gian luyện tập, khả năng thay đổi → ようになりました. ようにしています là cố gắng duy trì, không hợp với thể khả năng ở đây."},{"q":"健康{けんこう}のために、エレベーターを使{つか}わない＿＿。","options":["ところです","ようにしています","ために","てもいいです"],"answer":1,"explain":"Cố gắng duy trì thói quen không dùng thang máy vì sức khỏe → ないようにしています. ために cần vế sau, ところです và てもいいです không gắn được với Vない như vậy."},{"q":"風邪{かぜ}をひかない＿＿、毎日{まいにち}うがいをします。","options":["のに","ても","ように","ようと"],"answer":2,"explain":"Vない + ように chỉ mục tiêu: để không bị cảm. のに là 'mặc dù', không hợp nghĩa."},{"q":"前{まえ}は刺身{さしみ}が食{た}べられませんでしたが、今{いま}は食{た}べられる＿＿。","options":["ようにします","ためでした","ようにしました","ようになりました"],"answer":3,"explain":"So sánh trước và bây giờ, khả năng đã thay đổi → ようになりました. ようにしました là quyết tâm cố gắng, không dùng với 食べられる."}]},{"lesson":37,"title":"Thể bị động","summary":"Bài 37 dạy thể bị động (受身形): người chịu tác động trực tiếp, bị làm phiền qua đồ vật của mình, câu bị động khách quan về sự kiện, tác phẩm, phát minh và nguyên liệu.","grammar":[{"pattern":"N1は N2に V受身 (直接受身)","meaning":"N1 được / bị N2 làm ~","form":"Nhóm I: う→あ + れる (書く→書かれる, 言う→言われる); Nhóm II: る→られる (褒める→褒められる); Nhóm III: する→される, 来る→来られる","notes":"Thể bị động chia như động từ nhóm II. Người thực hiện hành động đi với に.","examples":[{"ja":"私{わたし}は部長{ぶちょう}に褒{ほ}められました。","vi":"Tôi được trưởng phòng khen."},{"ja":"弟{おとうと}は犬{いぬ}にかまれました。","vi":"Em trai tôi bị chó cắn."},{"ja":"私{わたし}は友達{ともだち}にパーティーに誘{さそ}われました。","vi":"Tôi được bạn rủ đi tiệc."}]},{"pattern":"N1は N2に N3を V受身","meaning":"N1 bị N2 làm gì đó với N3 (đồ vật, bộ phận cơ thể của N1) — thường mang nghĩa phiền toái","form":"(Người chịu ảnh hưởng)は (người làm)に (đồ vật/bộ phận)を V受身","notes":"Chủ ngữ là người chịu thiệt, không phải đồ vật: nói 私は足を踏まれました, không nói 私の足は踏まれました.","examples":[{"ja":"私{わたし}は電車{でんしゃ}で足{あし}を踏{ふ}まれました。","vi":"Tôi bị giẫm vào chân trên tàu."},{"ja":"妹{いもうと}にケーキを食{た}べられてしまいました。","vi":"Tôi bị em gái ăn mất cái bánh."},{"ja":"私{わたし}は母{はは}に日記{にっき}を読{よ}まれました。","vi":"Tôi bị mẹ đọc trộm nhật ký."}]},{"pattern":"Nが / Nは V受身 (khách quan)","meaning":"N được ~ (không cần nêu người làm)","form":"N (sự việc, đồ vật) + が/は + V受身","notes":"Dùng khi người làm không quan trọng hoặc là mọi người nói chung: tin tức, sự kiện, sản phẩm.","examples":[{"ja":"来月{らいげつ}、東京{とうきょう}で国際会議{こくさいかいぎ}が開{ひら}かれます。","vi":"Tháng sau, hội nghị quốc tế sẽ được tổ chức ở Tokyo."},{"ja":"この雑誌{ざっし}は若{わか}い人{ひと}によく読{よ}まれています。","vi":"Tạp chí này được giới trẻ đọc nhiều."},{"ja":"ベトナムのコーヒーは世界中{せかいじゅう}に輸出{ゆしゅつ}されています。","vi":"Cà phê Việt Nam được xuất khẩu đi khắp thế giới."}]},{"pattern":"Nは (người) によって V受身","meaning":"N được (ai) sáng tác / phát minh / phát hiện / thiết kế","form":"N (tác phẩm, phát minh) + は + người + によって + V受身","notes":"Dùng với 書く, 作る, 発明する, 発見する, 設計する. Không dùng に trong trường hợp này.","examples":[{"ja":"『源氏物語{げんじものがたり}』は紫式部{むらさきしきぶ}によって書{か}かれました。","vi":"Truyện Genji được Murasaki Shikibu viết."},{"ja":"電話{でんわ}はベルによって発明{はつめい}されました。","vi":"Điện thoại được Bell phát minh."},{"ja":"このお寺{てら}は有名{ゆうめい}な建築家{けんちくか}によって設計{せっけい}されました。","vi":"Ngôi chùa này được một kiến trúc sư nổi tiếng thiết kế."}]},{"pattern":"Nから / Nで 造られます","meaning":"Được làm từ (nguyên liệu) / bằng (vật liệu)","form":"Sản phẩm + は + nguyên liệu + から / vật liệu + で + 造られます (作られます)","notes":"から khi nguyên liệu biến đổi, không nhìn ra nữa (bia từ lúa mạch). で khi vẫn thấy được vật liệu (nhà bằng gỗ).","examples":[{"ja":"ビールは麦{むぎ}から造{つく}られます。","vi":"Bia được làm từ lúa mạch."},{"ja":"日本{にほん}の酒{さけ}は米{こめ}から造{つく}られます。","vi":"Rượu sake Nhật được làm từ gạo."},{"ja":"この家{いえ}は木{き}で造{つく}られています。","vi":"Ngôi nhà này được làm bằng gỗ."}]}],"vocab":[{"w":"褒める","r":"ほめる","m":"khen","t":"v","g":2,"cls":1,"mw":"褒めます","mr":"ほめます","k":["khen ngợi","tán dương","ca ngợi","khen thưởng"]},{"w":"しかる","r":"しかる","m":"mắng","t":"v","g":1,"cls":1,"mw":"しかります","mr":"しかります","k":["la mắng","trách mắng","la","quở trách"]},{"w":"誘う","r":"さそう","m":"rủ, mời","t":"v","g":1,"cls":1,"mw":"誘います","mr":"さそいます","k":["rủ rê","rủ đi","lôi kéo"]},{"w":"起こす","r":"おこす","m":"đánh thức","t":"v","g":1,"mw":"起こします","mr":"おこします","k":["gọi dậy","dựng dậy","kêu dậy"]},{"w":"招待する","r":"しょうたいする","m":"mời (dự tiệc, sự kiện)","t":"v","g":3,"cls":1,"mw":"招待します","mr":"しょうたいします","k":["mời mọc","mời dự","lời mời"]},{"w":"頼む","r":"たのむ","m":"nhờ","t":"v","g":1,"cls":1,"mw":"頼みます","mr":"たのみます","k":["nhờ vả","yêu cầu","gọi món"]},{"w":"注意する","r":"ちゅういする","m":"nhắc nhở, chú ý","t":"v","g":3,"cls":1,"mw":"注意します","mr":"ちゅういします","k":["cẩn trọng","để ý","nhắc nhở","lưu ý","coi chừng"]},{"w":"とる","r":"とる","m":"lấy (trộm)","t":"v","g":1,"cls":1,"mw":"とります","mr":"とります","k":["lấy cắp","ăn trộm","đánh cắp"]},{"w":"踏む","r":"ふむ","m":"giẫm","t":"v","g":1,"cls":1,"mw":"踏みます","mr":"ふみます","k":["giẫm lên","dẫm","đạp","giẫm chân"]},{"w":"壊す","r":"こわす","m":"làm hỏng, phá","t":"v","g":1,"cls":1,"mw":"壊します","mr":"こわします","k":["phá","làm hư","phá hỏng"]},{"w":"汚す","r":"よごす","m":"làm bẩn","t":"v","g":1,"cls":1,"mw":"汚します","mr":"よごします","k":["làm dơ","bôi bẩn","vấy bẩn"]},{"w":"行う","r":"おこなう","m":"tổ chức, tiến hành","t":"v","g":1,"cls":1,"mw":"行います","mr":"おこないます","k":["thực hiện","làm","cử hành"]},{"w":"輸出する","r":"ゆしゅつする","m":"xuất khẩu","t":"v","g":3,"cls":1,"mw":"輸出します","mr":"ゆしゅつします","k":["bán ra nước ngoài","xuất hàng","hàng xuất khẩu"]},{"w":"輸入する","r":"ゆにゅうする","m":"nhập khẩu","t":"v","g":3,"cls":1,"mw":"輸入します","mr":"ゆにゅうします","k":["mua từ nước ngoài","nhập hàng","hàng nhập khẩu"]},{"w":"翻訳する","r":"ほんやくする","m":"dịch (sách, văn bản)","t":"v","g":3,"cls":1,"mw":"翻訳します","mr":"ほんやくします","k":["dịch thuật","biên dịch","chuyển ngữ"]},{"w":"発明する","r":"はつめいする","m":"phát minh","t":"v","g":3,"cls":1,"mw":"発明します","mr":"はつめいします","k":["sáng chế","chế tạo","sáng tạo ra"]},{"w":"発見する","r":"はっけんする","m":"phát hiện","t":"v","g":3,"cls":1,"mw":"発見します","mr":"はっけんします","k":["tìm ra","khám phá","tìm thấy"]},{"w":"設計する","r":"せっけいする","m":"thiết kế","t":"v","g":3,"mw":"設計します","mr":"せっけいします","k":["vẽ thiết kế","lên bản vẽ","lên kế hoạch"]},{"w":"米","r":"こめ","m":"gạo","t":"n","cls":1,"k":["lúa gạo","thóc","gạo tẻ"]},{"w":"麦","r":"むぎ","m":"lúa mạch","t":"n","cls":1,"k":["lúa mì","lúa mạch đen","lúa mì mạch"]},{"w":"石油","r":"せきゆ","m":"dầu mỏ","t":"n","cls":1,"k":["dầu thô","dầu hỏa","xăng dầu"]},{"w":"原料","r":"げんりょう","m":"nguyên liệu","t":"n","cls":1,"k":["nguyên liệu thô","vật liệu","chất liệu"]},{"w":"デート","r":"デート","m":"cuộc hẹn hò","t":"n","cls":1,"k":["đi chơi","buổi hẹn","đi hẹn hò"]},{"w":"泥棒","r":"どろぼう","m":"kẻ trộm","t":"n","cls":1,"k":["ăn trộm","kẻ cắp","tên trộm"]},{"w":"警官","r":"けいかん","m":"cảnh sát","t":"n","cls":1,"k":["công an","viên cảnh sát","cảnh sát viên"]},{"w":"建築家","r":"けんちくか","m":"kiến trúc sư","t":"n","k":["người thiết kế nhà","nhà kiến trúc","người thiết kế công trình"]},{"w":"科学者","r":"かがくしゃ","m":"nhà khoa học","t":"n","k":["nhà nghiên cứu","khoa học gia","nhà bác học"]},{"w":"漫画","r":"まんが","m":"truyện tranh","t":"n","k":["manga","truyện","truyện tranh Nhật","comic"]},{"w":"世界中","r":"せかいじゅう","m":"khắp thế giới","t":"n","cls":1,"k":["toàn thế giới","cả thế giới","toàn cầu"]},{"w":"～中","r":"～じゅう","m":"khắp ~, suốt ~","t":"x","k":["khắp nơi","toàn bộ","cả","suốt cả"]},{"w":"～によって","r":"～によって","m":"bởi ~ (chủ thể trong câu bị động)","t":"x","k":["do","được làm bởi","nhờ"]},{"w":"よかったですね","r":"よかったですね","m":"may quá nhỉ, tốt quá nhỉ","t":"e","k":["may mắn","tốt rồi","mừng cho bạn","may thật"]},{"w":"埋め立てる","r":"うめたてる","m":"lấp (biển)","t":"v","g":2,"mw":"埋め立てます","mr":"うめたてます","k":["lấp đất","san lấp","lấn biển","san lấp biển"]},{"w":"技術","r":"ぎじゅつ","m":"kỹ thuật, công nghệ","t":"n","k":["kỹ năng","kĩ thuật","tay nghề"]},{"w":"土地","r":"とち","m":"đất đai","t":"n","k":["mảnh đất","khu đất","đất nền"]},{"w":"騒音","r":"そうおん","m":"tiếng ồn","t":"n","k":["tiếng ồn ào","ô nhiễm tiếng ồn","ồn ào"]},{"w":"利用する","r":"りようする","m":"sử dụng, tận dụng","t":"v","g":3,"mw":"利用します","mr":"りようします","k":["dùng","khai thác","sử dụng dịch vụ"]},{"w":"アクセス","r":"アクセス","m":"đường đi lại, giao thông (đến nơi)","t":"n","k":["cách đi","đường đến","phương tiện đến"]},{"w":"ドミニカ","r":"ドミニカ","m":"Dominica (quốc gia vùng Caribe)","t":"n","k":["Cộng hòa Dominica"]},{"w":"～世紀","r":"～せいき","m":"thế kỷ ~","t":"x","cls":1,"k":["thế kỉ"]},{"w":"豪華","r":"ごうか","m":"lộng lẫy, xa hoa","t":"a","k":["xa xỉ","sang trọng","hoành tráng"]},{"w":"彫刻","r":"ちょうこく","m":"điêu khắc, tác phẩm chạm khắc","t":"n","k":["tượng","bức tượng","chạm trổ"]},{"w":"眠る","r":"ねむる","m":"ngủ","t":"v","g":1,"mw":"眠ります","mr":"ねむります","k":["ngủ say","giấc ngủ","say ngủ","yên nghỉ"]},{"w":"彫る","r":"ほる","m":"khắc, chạm","t":"v","g":1,"mw":"彫ります","mr":"ほります","k":["chạm trổ","điêu khắc","tạc"]},{"w":"仲間","r":"なかま","m":"bạn bè, đồng bọn","t":"n","k":["đồng đội","đồng nghiệp","phe"]},{"w":"そのあと","r":"そのあと","m":"sau đó","t":"x","k":["rồi sau","tiếp theo","kế đó"]},{"w":"一生懸命","r":"いっしょうけんめい","m":"chăm chỉ, hết sức","t":"x","k":["cố gắng","hết mình","nỗ lực","miệt mài"]},{"w":"ねずみ","r":"ねずみ","m":"con chuột","t":"n","k":["chuột nhắt","chuột cống","chuột chù"]},{"w":"一匹もいません","r":"いっぴきもいません","m":"không có lấy một con nào","t":"e","k":["không có con nào","chẳng có con nào","không một con"]},{"w":"通訳する","r":"つうやくする","m":"phiên dịch","t":"v","cls":1,"add":1,"g":3,"mw":"通訳します","mr":"つうやくします","k":["thông dịch","dịch nói","phiên dịch viên"]},{"w":"インスタントラーメン","r":"インスタントラーメン","m":"mì ăn liền","t":"n","cls":1,"add":1,"k":["mì gói","mì tôm","mì ly"]}],"compare":[{"title":"Nから造られます vs Nで造られます","points":[{"label":"から","text":"Nguyên liệu đã biến đổi, nhìn sản phẩm không nhận ra: ワインはぶどうから造られます。"},{"label":"で","text":"Vật liệu vẫn nhìn thấy trong sản phẩm: この机は木で作られています。"}],"tip":"Nhìn thấy được vật liệu → で; không nhìn thấy nữa → から."},{"title":"私は〜を〜られました vs 私の〜は〜られました","points":[{"label":"私は Nを V受身","text":"Cách nói đúng khi mình chịu thiệt qua đồ vật của mình: 私は弟にカメラを壊されました。"},{"label":"私の Nは V受身","text":"Không tự nhiên khi muốn nói 'tôi bị'. Chỉ dùng câu có chủ ngữ là đồ vật khi nói khách quan, không có cảm giác bị thiệt."}],"tip":"Bị động phiền toái: người làm chủ ngữ, đồ vật giữ nguyên を."}],"quiz":[{"q":"私{わたし}は先生{せんせい}に＿＿。","options":["褒めました","褒められました","褒めれました","褒めています"],"answer":1,"explain":"先生に đánh dấu người thực hiện hành động trong câu bị động → 褒められました (được khen). 褒めました là 'tôi khen', không hợp với に; 褒めれました là dạng chia sai."},{"q":"電車{でんしゃ}の中{なか}で、だれかに財布{さいふ}を＿＿。","options":["盗めました","盗まりました","盗まれました","盗みました"],"answer":2,"explain":"Bị ai đó lấy trộm ví → bị động phiền toái 盗まれました. 盗みました là 'tôi lấy trộm', không đi được với だれかに; 盗まりました là dạng chia sai."},{"q":"1990年{ねん}に、この橋{はし}が＿＿。","options":["造られました","造りました","造ってあげました","造らせました"],"answer":0,"explain":"Chủ ngữ 橋が là vật, không tự xây được → bị động 造られました (được xây). Các thể chủ động/sai khiến cần chủ ngữ là người."},{"q":"『ハムレット』はシェイクスピア＿＿書{か}かれました。","options":["に","で","から","によって"],"answer":3,"explain":"Tác phẩm được ai sáng tác → によって. Không dùng に với người tạo ra tác phẩm, phát minh."},{"q":"ワインはぶどう＿＿造{つく}られます。","options":["で","を","から","に"],"answer":2,"explain":"Nho đã biến đổi thành rượu, không còn nhìn thấy → から. で dùng khi vật liệu vẫn nhìn thấy được."}]},{"lesson":38,"title":"Danh từ hóa động từ bằng の","summary":"Bài 38 dạy cách biến một hành động hoặc mệnh đề thành danh từ bằng の để làm chủ ngữ, tân ngữ, hoặc để nhấn mạnh thông tin trong câu.","grammar":[{"pattern":"Vる + のは + Adj です","meaning":"Việc ~ thì (khó, vui, nguy hiểm...)","form":"V thể từ điển + のは + tính từ đánh giá (楽しい, 難しい, 大変, 危ない...)","notes":"Dùng để nêu nhận xét, đánh giá về một hành động.","examples":[{"ja":"一人{ひとり}で旅行{りょこう}するのは楽{たの}しいです。","vi":"Đi du lịch một mình thì vui."},{"ja":"夜{よる}遅{おそ}くまで起{お}きているのは体{からだ}に悪{わる}いです。","vi":"Thức khuya không tốt cho cơ thể."},{"ja":"外国語{がいこくご}を覚{おぼ}えるのは大変{たいへん}です。","vi":"Học thuộc ngoại ngữ thật vất vả."}]},{"pattern":"Vる + のが + 好き / 嫌い / 上手 / 下手 / 速い / 遅い です","meaning":"Thích / ghét / giỏi / kém / nhanh / chậm (trong việc) ~","form":"V thể từ điển + のが + tính từ chỉ sở thích, năng lực, tốc độ","notes":"Tính từ sở thích, năng lực đi với が, không dùng を.","examples":[{"ja":"私{わたし}は写真{しゃしん}を撮{と}るのが好{す}きです。","vi":"Tôi thích chụp ảnh."},{"ja":"兄{あに}は料理{りょうり}を作{つく}るのが上手{じょうず}です。","vi":"Anh tôi nấu ăn giỏi."},{"ja":"田中{たなか}さんは歩{ある}くのが速{はや}いです。","vi":"Anh Tanaka đi bộ nhanh."}]},{"pattern":"Vる + のを忘れました","meaning":"Quên (làm) ~","form":"V thể từ điển + のを忘れました / 忘れないでください","notes":"Quên làm một việc (so với Nを忘れました: quên đồ vật).","examples":[{"ja":"傘{かさ}を持{も}って来{く}るのを忘{わす}れました。","vi":"Tôi quên mang ô."},{"ja":"宿題{しゅくだい}を出{だ}すのを忘{わす}れてしまいました。","vi":"Tôi lỡ quên nộp bài tập."},{"ja":"電気{でんき}を消{け}すのを忘{わす}れないでください。","vi":"Đừng quên tắt điện nhé."}]},{"pattern":"普通形 + のを知っていますか","meaning":"Bạn có biết (chuyện) ~ không?","form":"V・Aい thể thường + の; Aな・N + な + の + を知っていますか","notes":"Khi trước đó chưa biết, trả lời いいえ、知りませんでした (không nói 知っていません).","examples":[{"ja":"山田{やまだ}さんが結婚{けっこん}したのを知{し}っていますか。","vi":"Bạn có biết anh Yamada đã kết hôn không?"},{"ja":"来週{らいしゅう}の会議{かいぎ}が中止{ちゅうし}になったのを知{し}っていますか。","vi":"Bạn có biết cuộc họp tuần sau bị hủy rồi không?"},{"ja":"明日{あした}テストがあるのを知{し}りませんでした。","vi":"Tôi không biết là mai có bài kiểm tra."}]},{"pattern":"普通形 + のは + N です","meaning":"Cái / người / nơi mà ~ là N (nhấn mạnh N)","form":"V・Aい thể thường + のは; Aな + な + のは + N です","notes":"Đưa thông tin muốn nhấn mạnh xuống cuối câu, trước です.","examples":[{"ja":"私{わたし}が生{う}まれたのは小{ちい}さい村{むら}です。","vi":"Nơi tôi sinh ra là một ngôi làng nhỏ."},{"ja":"一番{いちばん}大切{たいせつ}なのは家族{かぞく}です。","vi":"Điều quan trọng nhất là gia đình."},{"ja":"昨日{きのう}電話{でんわ}したのは鈴木{すずき}さんです。","vi":"Người gọi điện hôm qua là anh Suzuki."}]}],"vocab":[{"w":"育てる","r":"そだてる","m":"nuôi, trồng","t":"v","g":2,"cls":1,"mw":"育てます","mr":"そだてます","k":["nuôi dưỡng","trồng cây","nuôi nấng","chăm sóc"]},{"w":"運ぶ","r":"はこぶ","m":"vận chuyển, mang","t":"v","g":1,"cls":1,"mw":"運びます","mr":"はこびます","k":["chở","mang đi","khuân","vận tải","chuyên chở"]},{"w":"亡くなる","r":"なくなる","m":"qua đời, mất","t":"v","g":1,"mw":"亡くなります","mr":"なくなります","k":["chết","từ trần","mất đi","tạ thế"]},{"w":"入院する","r":"にゅういんする","m":"nhập viện","t":"v","g":3,"cls":1,"mw":"入院します","mr":"にゅういんします","k":["vào viện","nằm viện","phải nhập viện"]},{"w":"退院する","r":"たいいんする","m":"xuất viện","t":"v","g":3,"cls":1,"mw":"退院します","mr":"たいいんします","k":["ra viện","được về nhà","rời bệnh viện"]},{"w":"入れる","r":"いれる","m":"bật (電源を～: bật nguồn điện)","t":"v","g":2,"cls":1,"mw":"入れます","mr":"いれます","k":["mở","bật máy","khởi đ ":"v","cls":1,"add":1,"g":1,"mw":"つきます","mr":"つきます","k":["đèn sáng","bật lên","được bật"]},{"w":"気持ち","r":"きもち","m":"cảm giác, tâm trạng (～がいい: dễ chịu / ～が悪い: khó chịu)","t":"n","cls":1,"add":1,"k":["cảm xúc","tấm lòng","tinh thần"]},{"w":"高校","r":"こうこう","m":"trường cấp 3","t":"n","cls":1,"add":1,"k":["trung học phổ thông","cấp ba","THPT","trường trung học"]},{"w":"工場","r":"こうじょう","m":"nhà máy","t":"n","cls":1,"add":1,"k":["xưởng","công xưởng","xí nghiệp"]},{"w":"村","r":"むら","m":"làng","t":"n","cls":1,"add":1,"k":["thôn","làng quê","nông thôn"]},{"w":"指輪","r":"ゆびわ","m":"nhẫn","t":"n","cls":1,"add":1,"k":["nhẫn cưới","nhẫn đeo tay","chiếc nhẫn"]},{"w":"習慣","r":"しゅうかん","m":"thói quen, tập quán","t":"n","cls":1,"add":1,"k":["phong tục","tập tục","nếp sống"]},{"w":"健康","r":"けんこう","m":"sức khỏe","t":"n","cls":1,"add":1,"k":["khỏe mạnh","thể chất","sức khoẻ","lành mạnh"]}],"compare":[{"title":"〜のは〜です vs 〜のが〜です","points":[{"label":"〜のは","text":"Đi với tính từ đánh giá hành động: 難しい, 楽しい, 大変, 危ない. Ví dụ: 漢字を覚えるのは難しいです。"},{"label":"〜のが","text":"Đi với tính từ sở thích, năng lực, tốc độ: 好き, 上手, 速い. Ví dụ: 妹は歌うのが上手です。"}],"tip":"Nhận xét việc đó thế nào → のは; ai thích/giỏi việc đó → のが."},{"title":"〜の vs 〜こと","points":[{"label":"〜こと","text":"Bắt buộc dùng trước です và trong mẫu cố định: 趣味は写真を撮ることです / 泳ぐことができます。"},{"label":"〜の","text":"Dùng trong mẫu bài 38 và với động từ giác quan (見る, 聞こえる): 子どもが遊んでいるのが見えます。"}],"tip":"Đứng trước です → こと; trong のは/のが/のを của bài 38 → の."}],"quiz":[{"q":"母{はは}は花{はな}を育{そだ}てる＿＿好{す}きです。","options":["のを","のに","のが","ので"],"answer":2,"explain":"好き đi với が → のが好きです. Không dùng のを với 好き."},{"q":"窓{まど}を閉{し}める＿＿忘{わす}れました。","options":["のが","のを","ことが","のに"],"answer":1,"explain":"忘れる là ngoại động từ, cần tân ngữ を → のを忘れました."},{"q":"鈴木{すずき}さんが会社{かいしゃ}を辞{や}めた＿＿知{し}っていますか。","options":["のを","のが","ので","のに"],"answer":0,"explain":"知る cần tân ngữ → のを知っていますか. のが sai trợ từ."},{"q":"毎日{まいにち}日記{にっき}を書{か}く＿＿大変{たいへん}です。","options":["のを","ための","ように","のは"],"answer":3,"explain":"Nêu đánh giá về một hành động → のは大変です. のを không đi với tính từ."},{"q":"私{わたし}が初{はじ}めて日本{にほん}へ行{い}った＿＿2015年{ねん}です。","options":["のに","のは","のを","ので"],"answer":1,"explain":"Mẫu nhấn mạnh 普通形 + のは + N です: lần đầu đi Nhật là năm 2015. のに/ので là liên từ, không đứng trước N です."}]},{"lesson":39,"title":"Nguyên nhân · Lý do","summary":"Bài 39 dạy cách nói nguyên nhân dẫn đến cảm xúc, trạng thái (thể て, Nで) và lý do một cách lịch sự, khách quan bằng 〜ので; cùng với 途中で (giữa chừng).","grammar":[{"pattern":"Vて / Aい→くて / Aな→で / Vない→なくて、〜","meaning":"Vì ~ nên (cảm thấy, ở trạng thái) ~","form":"Vて; Aい bỏ い + くて; Aな + で; Vない bỏ い + くて","notes":"Vế sau là cảm xúc (びっくりする, 安心する, 寂しい), trạng thái hoặc khả năng. Không dùng ý chí như 〜てください, 〜たい, 〜ましょう ở vế sau.","examples":[{"ja":"ニュースを聞{き}いて、びっくりしました。","vi":"Nghe tin tức, tôi giật mình."},{"ja":"家族{かぞく}に会{あ}えなくて、寂{さび}しいです。","vi":"Không gặp được gia đình nên tôi buồn."},{"ja":"この説明{せつめい}は複雑{ふくざつ}で、よく分{わ}かりません。","vi":"Lời giải thích này phức tạp nên tôi không hiểu lắm."}]},{"pattern":"N で、〜","meaning":"Do / vì N (sự kiện, hiện tượng)","form":"N (事故, 地震, 台風, 火事, 病気, けが...) + で","notes":"N là sự kiện, thiên tai, bệnh tật. Vế sau là kết quả, không dùng ý chí.","examples":[{"ja":"地震{じしん}で家{いえ}が壊{こわ}れました。","vi":"Nhà bị đổ do động đất."},{"ja":"事故{じこ}で電車{でんしゃ}が止{と}まりました。","vi":"Tàu dừng vì tai nạn."},{"ja":"病気{びょうき}で学校{がっこう}を休{やす}みました。","vi":"Tôi nghỉ học vì ốm."}]},{"pattern":"普通形 + ので、〜","meaning":"Vì ~ nên ~ (lịch sự, khách quan)","form":"V・Aい thể thường + ので; Aな・N + な + ので (休みなので)","notes":"Mềm và lịch sự hơn から, hợp khi xin phép, xin lỗi, giải thích. Trong văn rất lịch sự có thể dùng 〜ますので.","examples":[{"ja":"用事{ようじ}があるので、お先{さき}に失礼{しつれい}します。","vi":"Vì có việc nên tôi xin phép về trước."},{"ja":"明日{あした}は休{やす}みなので、ゆっくり寝{ね}ます。","vi":"Mai được nghỉ nên tôi sẽ ngủ thoải mái."},{"ja":"気分{きぶん}が悪{わる}いので、早{はや}く帰{かえ}ってもいいですか。","vi":"Tôi thấy không khỏe, tôi về sớm được không ạ?"}]},{"pattern":"Vる / Nの + 途中で","meaning":"Giữa đường, giữa chừng khi ~","form":"V thể từ điển + 途中で; Nの + 途中で","notes":"Dùng với hành động di chuyển (行く, 来る, 帰る) hoặc việc đang diễn ra (映画, 会議, 散歩).","examples":[{"ja":"会社{かいしゃ}へ来{く}る途中{とちゅう}で、雨{あめ}が降{ふ}り出{だ}しました。","vi":"Trên đường đến công ty thì trời đổ mưa."},{"ja":"散歩{さんぽ}の途中{とちゅう}で、昔{むかし}の友達{ともだち}に会{あ}いました。","vi":"Đang đi dạo thì tôi gặp bạn cũ."},{"ja":"映画{えいが}の途中{とちゅう}で、寝{ね}てしまいました。","vi":"Tôi ngủ quên giữa chừng bộ phim."}]}],"vocab":[{"w":"答える","r":"こたえる","m":"trả lời (câu hỏi: 質問に答える)","t":"v","g":2,"cls":1,"mw":"答えます","mr":"こたえます","k":["đáp","giải đáp","hồi đáp","trả lời câu hỏi"]},{"w":"倒れる","r":"たおれる","m":"đổ (ビルが～: tòa nhà đổ)","t":"v","g":2,"cls":1,"mw":"倒れます","mr":"たおれます","k":["sập","té","ngã xuống"]},{"w":"焼ける","r":"やける","m":"bị cháy (家が～: nhà bị cháy)","t":"v","g":2,"mw":"焼けます","mr":"やけます","k":["bị thiêu","cháy rụi","được nướng","rám nắng"]},{"w":"焼ける","r":"やける","m":"được nướng chín (パンが～: bánh mì chín)","t":"v","g":2,"mw":"焼けます","mr":"やけます","k":["bị thiêu","cháy rụi","được nướng","rám nắng"]},{"w":"通る","r":"とおる","m":"đi qua (đường)","t":"v","g":1,"cls":1,"mw":"通ります","mr":"とおります","k":["đi ngang qua","băng qua","thông qua","đỗ"]},{"w":"死ぬ","r":"しぬ","m":"chết","t":"v","g":1,"cls":1,"mw":"死にます","mr":"しにます","k":["qua đời","mất","tử vong","từ trần"]},{"w":"びっくりする","r":"びっくりする","m":"giật mình, ngạc nhiên","t":"v","g":3,"cls":1,"mw":"びっくりします","mr":"びっくりします","k":["hết hồn","sửng sốt","kinh ngạc","bất ngờ","hoảng hốt"]},{"w":"がっかりする","r":"がっかりする","m":"thất vọng","t":"v","g":3,"cls":1,"mw":"がっかりします","mr":"がっかりします","k":["chán nản","nản lòng","thất vọng quá","buồn"]},{"w":"安心する","r":"あんしんする","m":"yên tâm","t":"v","g":3,"cls":1,"mw":"安心します","mr":"あんしんします","k":["an tâm","yên lòng","nhẹ nhõm","bớt lo"]},{"w":"遅刻する","r":"ちこくする","m":"đến muộn","t":"v","g":3,"mw":"遅刻します","mr":"ちこくします","k":["đi muộn","trễ giờ","đi trễ","đến trễ"]},{"w":"早退する","r":"そうたいする","m":"về sớm","t":"v","g":3,"mw":"早退します","mr":"そうたいします","k":["về trước","nghỉ sớm","ra về sớm","xin về sớm"]},{"w":"けんかす ":"せっけん","m":"xà phòng","t":"n","cls":1,"k":["xà bông","bánh xà phòng","xà bông tắm"]},{"w":"大勢","r":"おおぜい","m":"đông người","t":"n","cls":1,"k":["nhiều người","đông đúc","đám đông"]},{"w":"お疲れさまでした","r":"おつかれさまでした","m":"anh/chị đã vất vả rồi","t":"e","k":["cảm ơn đã vất vả","chào tan làm","làm tốt lắm"]},{"w":"伺う","r":"うかがう","m":"đến thăm (khiêm nhường)","t":"v","g":1,"mw":"伺います","mr":"うかがいます","k":["ghé thăm","hỏi","nghe"]},{"w":"途中で","r":"とちゅうで","m":"giữa đường, giữa chừng","t":"x","k":["nửa đường","dọc đường","trên đường","nửa chừng"]},{"w":"トラック","r":"トラック","m":"xe tải","t":"n","k":["xe chở hàng","xe tải lớn","xe hàng"]},{"w":"ぶつかる","r":"ぶつかる","m":"va chạm, đâm vào","t":"v","g":1,"mw":"ぶつかります","mr":"ぶつかります","k":["đụng","đâm phải","tông","va phải","đụng phải"]},{"w":"並ぶ","r":"ならぶ","m":"xếp hàng","t":"v","g":1,"mw":"並びます","mr":"ならびます","k":["sắp hàng","xếp thành hàng","đứng xếp hàng","bày"]},{"w":"大人","r":"おとな","m":"người lớn","t":"n","k":["người trưởng thành","người lớn tuổi","trưởng thành"]},{"w":"洋服","r":"ようふく","m":"quần áo kiểu Âu","t":"n","k":["quần áo Tây","âu phục","đồ Tây"]},{"w":"西洋化する","r":"せいようかする","m":"Tây hóa","t":"v","g":3,"mw":"西洋化します","mr":"せいようかします","k":["Âu hóa","phương Tây hóa","Âu hóa xã hội","hiện đại hóa kiểu Tây"]},{"w":"合う","r":"あう","m":"hợp (với)","t":"v","g":1,"mw":"合います","mr":"あいます","k":["phù hợp","vừa","khớp","hợp nhau","đúng"]},{"w":"今では","r":"いまでは","m":"ngày nay thì","t":"x","k":["bây giờ thì","hiện nay","giờ đây","bây giờ"]},{"w":"成人式","r":"せいじんしき","m":"lễ thành nhân","t":"n","k":["lễ trưởng thành","lễ tuổi 20","lễ thành niên"]},{"w":"太る","r":"ふとる","m":"béo lên, tăng cân","t":"v","cls":1,"add":1,"g":1,"mw":"太ります","mr":"ふとります","k":["mập lên","tăng cân","mập"]},{"w":"やせる","r":"やせる","m":"gầy đi, giảm cân","t":"v","cls":1,"add":1,"g":2,"mw":"やせます","mr":"やせます","k":["giảm cân","ốm đi","sụt cân"]},{"w":"津波","r":"つなみ","m":"sóng thần","t":"n","cls":1,"add":1,"k":["tsunami","sóng lớn","thảm họa sóng thần"]},{"w":"雷","r":"かみなり","m":"sấm sét","t":"n","cls":1,"add":1,"k":["tiếng sấm","giông","sét đánh","tia chớp"]},{"w":"会場","r":"かいじょう","m":"hội trường, địa điểm tổ chức","t":"n","cls":1,"add":1,"k":["nơi tổ chức","sảnh","nơi diễn ra","địa điểm sự kiện"]},{"w":"首相","r":"しゅしょう","m":"thủ tướng","t":"n","cls":1,"add":1,"k":["thủ tướng chính phủ","người đứng đầu chính phủ","tể tướng"]},{"w":"ハイキング","r":"ハイキング","m":"đi bộ dã ngoại","t":"n","cls":1,"add":1,"k":["đi bộ đường dài","đi bộ đường núi","picnic"]},{"w":"操作","r":"そうさ","m":"thao tác, vận hành (～をする: thao tác)","t":"n","cls":1,"add":1,"k":["điều khiển","sử dụng","vận hành máy","cách dùng"]},{"w":"～屋","r":"～や","m":"cửa hàng ~, tiệm ~","t":"x","cls":1,"add":1,"k":["quán","cửa tiệm","người bán"]},{"w":"硬い","r":"かたい","m":"cứng","t":"a","cls":1,"add":1,"k":["rắn","cứng rắn","chắc","cứng nhắc"]},{"w":"柔らかい","r":"やわらかい","m":"mềm","t":"a","cls":1,"add":1,"k":["mềm mại","mềm mềm","dẻo","mịn"]}],"compare":[{"title":"から vs ので vs thể て (lý do)","points":[{"label":"から","text":"Nhấn mạnh lý do, mang tính chủ quan; vế sau dùng được ý chí, mệnh lệnh: 暑いから、窓を開けてください。"},{"label":"ので","text":"Khách quan, mềm, lịch sự; hợp khi xin phép, xin lỗi: 熱があるので、休んでもいいですか。"},{"label":"thể て","text":"Vế sau chỉ là cảm xúc, trạng thái, khả năng; không dùng ý chí: 雨が降って、困りました。 (sai: 雨が降って、傘を持って行ってください)"}],"tip":"Nhờ vả, rủ rê → から/ので (lịch sự hơn: ので); kết quả là cảm xúc → て."}],"quiz":[{"q":"試験{しけん}に合格{ごうかく}できなくて、＿＿。","options":["もう一度受けます","勉強しましょう","がっかりしました","頑張ってください"],"answer":2,"explain":"Sau thể て chỉ nguyên nhân, vế sau phải là cảm xúc → がっかりしました. Các lựa chọn khác là ý chí, rủ rê, nhờ vả nên không dùng được."},{"q":"台風{たいふう}＿＿飛行機{ひこうき}が飛{と}びませんでした。","options":["で","に","を","が"],"answer":0,"explain":"N (hiện tượng) + で chỉ nguyên nhân: vì bão. が sẽ tạo hai chủ ngữ, sai."},{"q":"明日{あした}は日曜日{にちようび}＿＿、会社{かいしゃ}は休{やす}みです。","options":["ので","だので","なので","なくて"],"answer":2,"explain":"Danh từ + な + ので → 日曜日なので. Không nói だので hay N + ので trực tiếp."},{"q":"この部屋{へや}は＿＿、勉強{べんきょう}できません。","options":["うるさいで","うるさくで","うるさいて","うるさくて"],"answer":3,"explain":"Tính từ い bỏ い thêm くて → うるさくて. Vế sau là khả năng (できません) nên dùng thể て được."},{"q":"駅{えき}へ行{い}く＿＿、銀行{ぎんこう}に寄{よ}りました。","options":["ながら","途中で","あとで","ように"],"answer":1,"explain":"Vる + 途中で: trên đường ra ga thì ghé ngân hàng. ながら phải đi với Vます (行きながら); あとで phải đi với Vた (行ったあとで)."}]},{"lesson":40,"title":"Câu hỏi lồng · Thử làm · Danh từ hóa tính từ","summary":"Bài 40 dạy cách lồng câu hỏi vào câu (〜か, 〜かどうか), cách nói thử làm gì (〜てみます) và biến tính từ い thành danh từ chỉ mức độ (〜さ).","grammar":[{"pattern":"疑問詞 + 普通形 + か、〜","meaning":"(Ai, cái gì, bao giờ...) ~ thì (không biết, hãy cho biết...)","form":"Từ để hỏi + V・Aい thể thường + か; Aな・N bỏ だ + か (何が好きか, どれが便利か)","notes":"Câu hỏi có từ để hỏi được lồng vào câu lớn, thường đi với 分かりません, 教えてください, 調べます.","examples":[{"ja":"会議{かいぎ}が何時{なんじ}に終{お}わるか、分{わ}かりません。","vi":"Tôi không biết cuộc họp mấy giờ kết thúc."},{"ja":"誰{だれ}が来{く}るか、教{おし}えてください。","vi":"Hãy cho tôi biết ai sẽ đến."},{"ja":"どれが一番{いちばん}便利{べんり}か、調{しら}べてみます。","vi":"Tôi sẽ thử tìm hiểu xem cái nào tiện nhất."}]},{"pattern":"普通形 + かどうか、〜","meaning":"Có ~ hay không","form":"V・Aい thể thường + かどうか; Aな・N bỏ だ + かどうか","notes":"Dùng cho câu hỏi có/không (không có từ để hỏi). Không dùng かどうか khi có từ để hỏi.","examples":[{"ja":"明日{あした}パーティーに行{い}けるかどうか、まだ分{わ}かりません。","vi":"Tôi chưa biết mai có đi dự tiệc được hay không."},{"ja":"この答{こた}えが正{ただ}しいかどうか、確{たし}かめてください。","vi":"Hãy kiểm tra xem câu trả lời này có đúng không."},{"ja":"荷物{にもつ}が届{とど}いたかどうか、電話{でんわ}で聞{き}いてみます。","vi":"Tôi sẽ gọi điện hỏi thử xem hàng đã đến chưa."}]},{"pattern":"Vて + みます","meaning":"Thử làm ~","form":"Vて + みます / みたいです / みてもいいですか","notes":"Làm thử để biết kết quả, cảm giác. みる thường viết bằng hiragana.","examples":[{"ja":"この靴{くつ}を履{は}いてみてもいいですか。","vi":"Tôi đi thử đôi giày này được không?"},{"ja":"日本{にほん}の料理{りょうり}を作{つく}ってみました。","vi":"Tôi đã thử nấu món Nhật."},{"ja":"一度{いちど}富士山{ふじさん}に登{のぼ}ってみたいです。","vi":"Tôi muốn thử leo núi Phú Sĩ một lần."}]},{"pattern":"Aい → Aさ","meaning":"Biến tính từ い thành danh từ chỉ mức độ (độ dài, chiều cao...)","form":"Aい bỏ い + さ: 長い→長さ, 高い→高さ, 重い→重さ, 大きい→大きさ; いい→よさ","notes":"Hay dùng khi nói về kích thước, số đo, hoặc tính chất (優しさ: sự hiền lành).","examples":[{"ja":"この橋{はし}の長{なが}さは500メートルです。","vi":"Chiều dài của cây cầu này là 500 mét."},{"ja":"富士山{ふじさん}の高{たか}さを知{し}っていますか。","vi":"Bạn có biết độ cao của núi Phú Sĩ không?"},{"ja":"箱{はこ}の重{おも}さを量{はか}ってください。","vi":"Hãy cân trọng lượng của cái hộp."}]}],"vocab":[{"w":"数える","r":"かぞえる","m":"đếm","t":"v","g":2,"cls":1,"mw":"数えます","mr":"かぞえます","k":["đếm số","tính","đếm số lượng"]},{"w":"測る・量る","r":"はかる","m":"đo (chiều dài), cân (trọng lượng)","t":"v","g":1,"cls":1,"mw":"測ります・量ります","mr":"はかります","k":["đo lường","đo đạc","đo nhiệt độ"]},{"w":"確かめる","r":"たしかめる","m":"xác nhận, kiểm tra","t":"v","g":2,"cls":1,"mw":"確かめます","mr":"たしかめます","k":["kiểm chứng","xác minh","xem lại","kiểm tra lại"]},{"w":"合う","r":"あう","m":"vừa (サイズが～: vừa cỡ)","t":"v","g":1,"cls":1,"mw":"合います","mr":"あいます","k":["phù hợp","vừa","khớp","hợp nhau","đúng"]},{"w":"出発する","r":"しゅっぱつする","m":"xuất phát","t":"v","g":3,"cls":1,"mw":"出発します","mr":"しゅっぱつします","k":["khởi hành","lên đường","bắt đầu đi","ra đi"]},{"w":"到着する","r":"とうちゃくする","m":"đến nơi","t":"v","g":3,"cls":1,"mw":"到着します","mr":"とうちゃくします","k":["tới nơi","cập bến","hạ cánh"]},{"w":"酔う","r":"よう","m":"say (rượu)","t":"v","g":1,"cls":1,"mw":"酔います","mr":"よいます","k":["say rượu","say xỉn","xỉn","say xe"]},{"w":"危険","r":"きけん","m":"nguy hiểm","t":"a","k":["rủi ro","hiểm nguy","nguy cơ","không an toàn","coi chừng"]},{"w":"必要","r":"ひつよう","m":"cần thiết","t":"a","cls":1,"k":["thiết yếu","quan trọng","bắt buộc","cần có"]},{"w":"宇宙","r":"うちゅう","m":"vũ trụ","t":"n","k":["không gian","ngoài vũ trụ","vũ trụ bao la"]},{"w":"地球","r":"ちきゅう","m":"trái đất","t":"n","k":["địa cầu","quả đất","hành tinh"]},{"w":"忘年会","r":"ぼうねんかい","m":"tiệc tất niên","t":"n","cls":1,"k":["liên hoan cuối năm","tiệc cuối năm","year end party","liên hoan tất niên"]},{"w":"新年会","r":"しんねんかい","m":"tiệc mừng năm mới","t":"n","cls":1,"k":["tân niên","liên hoan đầu năm","tiệc đầu năm"]},{"w":"二次会","r":"にじかい","m":"tăng hai (sau tiệc)","t":"n","cls":1,"k":["tăng 2","tiệc thứ hai","đi tiếp"]},{"w":"大会","r":"たいかい","m":"đại hội, cuộc thi","t":"n","cls":1,"k":["giải đấu","hội nghị","giải thi đấu","thi đấu"]},{"w":"マラソン","r":"マラソン","m":"marathon","t":"n","cls":1,"k":["chạy marathon","chạy đường dài","ma-ra-tông"]},{"w":"コンテスト","r":"コンテスト","m":"cuộc thi","t":"n","cls":1,"k":["hội thi","cuộc thi tài","cuộc tranh tài","thi tuyển"]},{"w":"表","r":"おもて","m":"mặt trước","t":"n","cls":1,"k":["mặt phải","mặt ngoài","bề mặt","phía trước"]},{"w":"裏","r":"うら","m":"mặt sau","t":"n","cls":1,"k":["mặt trái","phía sau","đằng sau","mặt trong"]},{"w":"返事","r":"へんじ","m":"sự trả lời, hồi âm","t":"n","k":["trả lời","phản hồi","đáp lại","thư trả lời"]},{"w":"申し込み","r":"もうしこみ","m":"sự đăng ký","t":"n","k":["đơn đăng ký","nộp đơn","ghi danh"]},{"w":"本当","r":"ほんとう","m":"sự thật","t":"n","k":["thật sự","đúng vậy","có thật"]},{"w":"間違い","r":"まちがい","m":"lỗi sai","t":"n","cls":1,"k":["sai sót","nhầm lẫn","chỗ sai","nhầm"]},{"w":"傷","r":"きず","m":"vết xước, vết thương","t":"n","cls":1,"k":["bị thương","trầy xước","vết trầy"]},{"w":"ズボン","r":"ズボン","m":"quần","t":"n","cls":1,"k":["quần dài","quần tây","quần âu"]},{"w":"長さ","r":"ながさ","m":"chiều dài","t":"n","cls":1,"k":["độ dài","chiều dài bao nhiêu","dài bao nhiêu","độ dài bao nhiêu"]},{"w":"重さ","r":"おもさ","m":"trọng lượng","t":"n","cls":1,"k":["cân nặng","khối lượng","độ nặng","nặng"]},{"w":"高さ","r":"たかさ","m":"chiều cao","t":"n","cls":1,"k":["độ cao","chiều cao bao nhiêu","cao bao nhiêu","độ cao bao nhiêu"]},{"w":"大きさ","r":"おおきさ","m":"kích thước","t":"n","cls":1,"k":["cỡ","độ lớn","size","to nhỏ"]},{"w":"～便","r":"～びん","m":"chuyến bay số ~","t":"x","k":["số hiệu chuyến bay","hiệu chuyến bay","flight"]},{"w":"～号","r":"～ごう","m":"số ~ (tàu, bão)","t":"x","k":["hiệu","tàu số","số hiệu","cơn bão số"]},{"w":"～個","r":"～こ","m":"~ cái, ~ quả (đếm vật nhỏ)","t":"x","k":["chiếc","đơn vị đếm","trái","đếm đồ vật"]},{"w":"～本","r":"～ほん","m":"~ cái, ~ chiếc (đếm vật dài)","t":"x","k":["chai","cây","bút","que"]},{"w":"～杯","r":"～はい","m":"~ cốc, ~ chén","t":"x","k":["ly","bát","tách"]},{"w":"～キロ","r":"～キロ","m":"~ ki-lô (kg, km)","t":"x","k":["cân","ký","ki-lô-mét","ki-lô-gam"]},{"w":"～グラム","r":"～グラム","m":"~ gam","t":"x","k":["gram","gờ ram","gờ-ram","đơn vị gam"]},{"w":"～センチ","r":"～センチ","m":"~ xen-ti-mét","t":"x","k":["cen-ti-mét","cm","phân"]},{"w":"～ミリ","r":"～ミリ","m":"~ mi-li-mét","t":"x","k":["mm","mili"]},{"w":"～以上","r":"～いじょう","m":"~ trở lên","t":"x","cls":1,"k":["hơn","ít nhất","từ ~ trở lên"]},{"w":"～以下","r":"～いか","m":"~ trở xuống","t":"x","cls":1,"k":["dưới","tối đa","không quá"]},{"w":"さあ","r":"さあ","m":"à, ừm (khi không chắc)","t":"x","k":["ờ","chà","tôi không rõ","không biết nữa"]},{"w":"どうでしょうか","r":"どうでしょうか","m":"không biết thế nào nhỉ (hỏi lịch sự)","t":"e","k":["không biết sao","liệu có được không","thế nào ạ","ra sao nhỉ"]},{"w":"クラス","r":"クラス","m":"lớp học","t":"n","k":["học sinh trong lớp","class","sĩ số lớp","bạn cùng lớp"]},{"w":"テスト","r":"テスト","m":"bài kiểm tra","t":"n","k":["bài thi","thi","test"]},{"w":"成績","r":"せいせき","m":"thành tích, kết quả học tập","t":"n","k":["điểm số","thành tích học tập","học lực"]},{"w":"ところで","r":"ところで","m":"nhân tiện, à này","t":"x","k":["tiện thể","à mà","nhân đây","nhân thể"]},{"w":"いらっしゃる","r":"いらっしゃる","m":"đến, đi, ở (tôn kính)","t":"v","g":1,"mw":"いらっしゃいます","mr":"いらっしゃいます","k":["có mặt","kính ngữ","ngài đến","có nhà"]},{"w":"様子","r":"ようす","m":"tình hình, dáng vẻ","t":"n","cls":1,"k":["tình trạng","vẻ ngoài","bộ dạng"]},{"w":"事件","r":"じけん","m":"vụ án, sự kiện","t":"n","k":["vụ việc","sự vụ","sự cố"]},{"w":"爆弾","r":"ばくだん","m":"bom","t":"n","k":["quả bom","bom nổ","thuốc nổ"]},{"w":"積む","r":"つむ","m":"chất (hàng)","t":"v","g":1,"mw":"積みます","mr":"つみます","k":["chất hàng","xếp chồng","tích lũy","chồng lên"]},{"w":"運転手","r":"うんてんしゅ","m":"tài xế","t":"n","k":["lái xe","người lái xe","bác tài"]},{"w":"離れた","r":"はなれた","m":"cách xa, xa xôi","t":"x","k":["xa cách","hẻo lánh","ở xa","xa nhà"]},{"w":"急に","r":"きゅうに","m":"đột nhiên","t":"x","cls":1,"k":["bỗng nhiên","bất ngờ","đột ngột","tự dưng"]},{"w":"動かす","r":"うごかす","m":"làm chuyển động, lái (xe)","t":"v","g":1,"mw":"動かします","mr":"うごかします","k":["di chuyển","khởi động","vận hành","cử động"]},{"w":"一生懸命","r":"いっしょうけんめい","m":"chăm chỉ, hết sức","t":"x","k":["cố gắng","hết mình","nỗ lực","miệt mài"]},{"w":"出る","r":"でる","m":"phát sinh, xuất hiện (問題が～: phát sinh vấn đề)","t":"v","cls":1,"add":1,"g":2,"mw":"出ます","mr":"でます","k":["dự thi","tham dự","thi đấu cho","góp mặt","dự giải"]},{"w":"うまくいく","r":"うまくいく","m":"suôn sẻ, thuận lợi","t":"v","cls":1,"add":1,"g":1,"mw":"うまくいきます","mr":"うまくいきます","k":["trôi chảy","thành công","êm xuôi"]},{"w":"相談する","r":"そうだんする","m":"bàn bạc, trao đổi, xin ý kiến","t":"v","cls":1,"add":1,"g":3,"mw":"相談します","mr":"そうだんします","k":["thảo luận","tư vấn","hỏi ý","trao đổi"]},{"w":"発表会","r":"はっぴょうかい","m":"buổi thuyết trình, buổi biểu diễn","t":"n","cls":1,"add":1,"k":["buổi báo cáo","buổi trình diễn","buổi trình bày","buổi công diễn"]},{"w":"［お］年寄り","r":"［お］としより","m":"người già","t":"n","cls":1,"add":1,"k":["người cao tuổi","cụ già","người già cả","người lớn tuổi"]}],"compare":[{"title":"疑問詞〜か vs 〜かどうか","points":[{"label":"疑問詞〜か","text":"Câu hỏi có từ để hỏi (何, 誰, いつ, どこ...): 誰が来るか、分かりません。"},{"label":"〜かどうか","text":"Câu hỏi có/không, không có từ để hỏi: 彼が来るかどうか、分かりません。"}],"tip":"Có từ để hỏi → chỉ か; không có → かどうか. Nhớ bỏ だ sau Aな/N."}],"quiz":[{"q":"田中{たなか}さんが何時{なんじ}に来{く}る＿＿、知{し}っていますか。","options":["かどうか","か","のを","ので"],"answer":1,"explain":"Có từ để hỏi 何時 → dùng か. かどうか chỉ dùng cho câu hỏi có/không."},{"q":"明日{あした}雨{あめ}が降{ふ}る＿＿、分{わ}かりません。","options":["のを","ように","かどうか","ので"],"answer":2,"explain":"Câu hỏi có/không (mưa hay không) lồng vào câu → かどうか. のを không đi được với 分かりません."},{"q":"駅{えき}までどの道{みち}が一番{いちばん}安全{あんぜん}＿＿、教{おし}えてください。","options":["だか","なか","か","のか"],"answer":2,"explain":"Tính từ な bỏ だ rồi thêm か → 安全か. Không nói 安全だか hay 安全なか."},{"q":"おいしいかどうか、ちょっと食{た}べて＿＿。","options":["おきます","しまいます","あります","みます"],"answer":3,"explain":"Ăn thử để biết có ngon không → 食べてみます. 食べておきます là ăn sẵn để chuẩn bị, không hợp nghĩa."},{"q":"この川{かわ}の＿＿は3メートルです。","options":["深さ","深い","深く","深くて"],"answer":0,"explain":"Cần danh từ chỉ mức độ trước は → 深い bỏ い thêm さ: 深さ (độ sâu)."}]},{"lesson":41,"title":"Cho – nhận có kính ngữ · Nhờ vả lịch sự","summary":"Bài này dạy cách nói cho – nhận đồ vật và hành động có phân biệt vị trí trên – dưới (いただく・くださる・やる), cách nhờ vả lịch sự bằng 〜てくださいませんか và cách nói làm gì nhân dịp gì (お祝いに、記念に).","grammar":[{"pattern":"いただきます / くださいます / やります","meaning":"Nhận / cho đồ vật, thể hiện quan hệ trên – dưới","form":"Người trên に N を いただきます (tôi nhận); Người trên が (私に) N を くださいます (người trên cho tôi); Người dưới・con vật・cây に N を やります (tôi cho)","notes":"いただく là dạng khiêm nhường của もらう, くださる là dạng tôn kính của くれる. やる dùng khi cho người dưới (con cái, em), con vật, cây cối; ngày nay nói với con người thường dùng あげる cho nhẹ nhàng hơn.","examples":[{"ja":"社長{しゃちょう}にお土産{みやげ}をいただきました。","vi":"Tôi đã nhận được quà lưu niệm từ giám đốc."},{"ja":"先生{せんせい}が私{わたし}に辞書{じしょ}をくださいました。","vi":"Thầy giáo đã cho tôi cuốn từ điển."},{"ja":"毎朝{まいあさ}、犬{いぬ}にえさをやります。","vi":"Sáng nào tôi cũng cho chó ăn."}]},{"pattern":"Vて + いただきます / くださいます / やります","meaning":"Được người trên làm cho / người trên làm cho tôi / tôi làm cho người dưới","form":"Người trên に Vて いただきます; Người trên が Vて くださいます; Người dưới に Vて やります","notes":"Thể hiện lòng biết ơn với hành động người khác làm cho mình. Chú ý trợ từ: いただく đi với に (người làm), くださる đi với が.","examples":[{"ja":"部長{ぶちょう}に資料{しりょう}を直{なお}していただきました。","vi":"Tôi đã được trưởng phòng sửa giúp tài liệu."},{"ja":"先輩{せんぱい}が駅{えき}まで送{おく}ってくださいました。","vi":"Anh khóa trên đã đưa tôi ra tận ga."},{"ja":"寝{ね}る前{まえ}に、息子{むすこ}に絵本{えほん}を読{よ}んでやりました。","vi":"Trước khi ngủ, tôi đã đọc sách tranh cho con trai."}]},{"pattern":"Vて + くださいませんか","meaning":"(Anh/chị) có thể làm ~ giúp tôi được không? (nhờ vả lịch sự)","form":"Vて + くださいませんか","notes":"Lịch sự hơn 〜てください và 〜てくれませんか. Dùng khi nhờ người trên hoặc người không thân. Không nói 〜ていただきませんか (sai); dạng đúng là 〜ていただけませんか.","examples":[{"ja":"すみません、この漢字{かんじ}の読{よ}み方{かた}を教{おし}えてくださいませんか。","vi":"Xin lỗi, anh có thể chỉ tôi cách đọc chữ Hán này được không?"},{"ja":"もう少{すこ}しゆっくり話{はな}してくださいませんか。","vi":"Chị có thể nói chậm hơn một chút được không ạ?"}]},{"pattern":"N に + V","meaning":"Làm V nhân dịp / để làm N (お祝いに、記念に、お礼に、お見舞いに)","form":"N (お祝い・記念・お礼・お見舞い・お土産…) + に + V","notes":"Diễn tả mục đích, dịp của hành động như tặng quà, chụp ảnh. Thường đi với あげる・もらう・買う・撮る.","examples":[{"ja":"友達{ともだち}の結婚{けっこん}のお祝{いわ}いに時計{とけい}をあげました。","vi":"Tôi đã tặng đồng hồ để mừng đám cưới của bạn."},{"ja":"卒業{そつぎょう}の記念{きねん}にみんなで写真{しゃしん}を撮{と}りました。","vi":"Mọi người đã chụp ảnh để làm kỷ niệm tốt nghiệp."},{"ja":"手伝{てつだ}ってもらったお礼{れい}に、ケーキを買{か}いました。","vi":"Tôi đã mua bánh để cảm ơn vì được giúp đỡ."}]}],"vocab":[{"w":"いただく","r":"いただく","m":"nhận (khiêm nhường của もらう)","t":"v","g":1,"cls":1,"mw":"いただきます","mr":"いただきます","k":["được cho","xin","dùng bữa"]},{"w":"くださる","r":"くださる","m":"(người trên) cho tôi (tôn kính của くれる)","t":"v","g":1,"cls":1,"mw":"くださいます","mr":"くださいます","k":["tặng","ban cho","được tặng"]},{"w":"やる","r":"やる","m":"cho (người dưới, con vật, cây cối)","t":"v","g":1,"cls":1,"mw":"やります","mr":"やります","k":["tiến hành","làm việc","thực hiện","chơi"]},{"w":"呼ぶ","r":"よぶ","m":"mời; gọi","t":"v","g":1,"mw":"呼びます","mr":"よびます","k":["kêu","gọi điện","gọi tên","gọi đến"]},{"w":"取り替える","r":"とりかえる","m":"đổi, thay","t":"v","g":2,"mw":"取り替えます","mr":"とりかえます","k":["thay thế","thay mới","đổi lại"]},{"w":"親切にする","r":"しんせつにする","m":"đối xử tử tế","t":"v","g":3,"cls":1,"mw":"親切にします","mr":"しんせつにします","k":["đối xử tốt","tốt bụng","giúp đỡ"]},{"w":"かわいい","r":"かわいい","m":"dễ thương, đáng yêu","t":"a","cls":1,"k":["cute","xinh","đáng yêu quá","xinh xắn"]},{"w":"お祝い", "が"],"answer":2,"explain":"Nに + V diễn tả dịp/mục đích: お祝いに (để mừng). から/を/が đều không thể đứng sau お祝い trong câu này."}]},{"lesson":42,"title":"Mục đích · Công dụng · Nhấn mạnh số lượng","summary":"Bài này dạy cách nói mục đích bằng 〜ために, nói công dụng của đồ vật bằng 〜のに/Nに 使います・便利です・かかります, và cách dùng は/も sau số lượng để nói 'ít nhất' hoặc 'tới tận'.","grammar":[{"pattern":"Vる / N の + ために","meaning":"Để (làm) ~ (mục đích); vì (lợi ích của) N","form":"Vる (động từ ý chí) + ために; N + の + ために","notes":"ために đi với động từ có ý chí (買う、行く、入る). Động từ không ý chí, thể khả năng hoặc ない dùng ように (bài 36). Nのために còn có nghĩa 'vì N' (家族のために).","examples":[{"ja":"自分{じぶん}の店{みせ}を持{も}つために、お金{かね}を貯{た}めています。","vi":"Tôi đang để dành tiền để có cửa hàng riêng."},{"ja":"健康{けんこう}のために、毎朝{まいあさ}３０分{ぷん}歩{ある}いています。","vi":"Vì sức khỏe, sáng nào tôi cũng đi bộ 30 phút."},{"ja":"子{こ}どもたちのために、大{おお}きい家{いえ}を建{た}てました。","vi":"Tôi đã xây ngôi nhà lớn vì các con."}]},{"pattern":"Vる の / N + に + 使います・いいです・便利です・役に立ちます・かかります","meaning":"Dùng để ~ / tốt cho ~ / tiện cho ~ / có ích cho ~ / tốn (thời gian, tiền) để ~","form":"Vる + のに + 使います・いいです・便利です・役に立ちます・かかります; N + に + (cùng các từ trên)","notes":"Nói về công dụng của đồ vật hoặc chi phí, thời gian cần để làm việc gì. Không dùng ために với 便利です・いいです.","examples":[{"ja":"この小{ちい}さいはさみは爪{つめ}を切{き}るのに使{つか}います。","vi":"Cái kéo nhỏ này dùng để cắt móng tay."},{"ja":"この辞書{じしょ}は漢字{かんじ}を調{しら}べるのに便利{べんり}です。","vi":"Cuốn từ điển này tiện để tra chữ Hán."},{"ja":"この報告書{ほうこくしょ}を書{か}くのに三日{みっか}かかりました。","vi":"Tôi mất 3 ngày để viết bản báo cáo này."}]},{"pattern":"Số lượng + は / Số lượng + も","meaning":"は: ít nhất là ~; も: tới tận ~ (nhiều hơn dự đoán)","form":"Số + đơn vị đếm + は / も","notes":"は đưa ra mức tối thiểu ước tính (thường đi với 少なくとも); も nhấn mạnh người nói thấy số lượng nhiều, bất ngờ.","examples":[{"ja":"駅{えき}から会社{かいしゃ}まで歩{ある}いて２０分{ぷん}はかかります。","vi":"Từ ga đến công ty đi bộ mất ít nhất 20 phút."},{"ja":"昨日{きのう}の会議{かいぎ}は５時間{じかん}も続{つづ}きました。","vi":"Cuộc họp hô
